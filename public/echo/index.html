<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0C1210">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ECHO">
<meta name="format-detection" content="telephone=no">
<title>ECHO</title>
<style>
  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    position: fixed; inset: 0; overflow: hidden;
    background: #0C1210;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  #game {
    display: block; position: fixed; top: 0; left: 0;
    width: 100vw; height: 100vh; width: 100dvw; height: 100dvh;
    touch-action: none;
  }
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 10;
    background: #0C1210; color: #7E8A80;
    font: 500 12px/2 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: .26em; text-transform: uppercase;
    align-items: center; justify-content: center; text-align: center;
    padding: calc(var(--safe-top) + 16px) 28px calc(var(--safe-bottom) + 16px);
  }
  #rotate b { display: block; color: #E7E3D4; font-size: 14px; letter-spacing: .3em; margin-bottom: 8px; font-weight: 600; }
  #rotate i { display: block; font-style: normal; color: #5E9C8A; font-size: 30px; letter-spacing: 0; margin-bottom: 14px; }
  /* the descent is vertical: a short landscape window makes the type unreadable */
  @media (orientation: landscape) and (max-height: 560px) {
    #game { display: none; }
    #rotate { display: flex; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="rotate"><div><i>&#10549;</i><b>Turn the device</b>Echo descends &mdash; hold it upright</div></div>
<script>
  // iOS: let the canvas own every gesture (no scroll, pinch-zoom, double-tap-zoom, callout)
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
</script>
<script>
"use strict";
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let SAFE_TOP = 0, SAFE_BOTTOM = 0;

  // ---- Display / scaling -------------------------------------------------
  let DPR = 1, W = 0, H = 0, S = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = vpW(); H = vpH();
    S = H / 800;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  function vpW(){ var v = window.visualViewport; return Math.round((v && v.width) || window['innerWidth']); }
  function vpH(){ var v = window.visualViewport; return Math.round((v && v.height) || window['innerHeight']); }
  function readSafeInsets(){ var cs = getComputedStyle(document.documentElement); function p(k){ var n = parseFloat(cs.getPropertyValue(k)); return isFinite(n) ? n : 0; } SAFE_TOP = p('--safe-top'); SAFE_BOTTOM = p('--safe-bottom'); }
  function relayout(){ readSafeInsets(); resize(); }
  window.addEventListener('resize', relayout);
  window.addEventListener('orientationchange', relayout);
  if (window.visualViewport) { window.visualViewport.addEventListener('resize', relayout); window.visualViewport.addEventListener('scroll', relayout); }
  relayout();

  // ---- Tunables ----------------------------------------------------------
  const T = {
    sink:        150,    // base descent speed (px/s)
    sinkGain:    90,     // extra descent at max depth
    swim:        12,     // horizontal steering stiffness (lower = looser)
    swimDamp:    0.91,   // higher = more glide / float
    maxSwim:     640,    // horizontal speed cap
    cr:          11,     // creature radius
    pingSpeed:   1500,   // how fast the sonar ring expands (px/s)
    pingLife:    1.35,   // seconds a ping's reveal lingers
    pingRange:   520,    // max reveal radius
    pingBand:    70,     // width of the bright leading arc
    cooldown:    0.42,   // min seconds between manual pings
    selfGlow:    70,     // creature's always-on glow radius
    step:        14,     // cave sampling resolution (px of depth)
    pxPerM:      32,
    jellyR:      11,     // jellyfish bell radius (base px)
    jellyGlow:   44,     // faint always-on glow halo (px)
    jellySway:   42,     // horizontal sway amplitude (px)
    jellySwaySpd: 0.6    // sway speed (rad/s) -> ~25 px/s drift
  };
  function sc(v) { return v * S; }

  // ---- Input -------------------------------------------------------------
  let pointerDown = false, targetX = 0, pointerY = 0;
  function px(e) {
    const r = canvas.getBoundingClientRect();
    return (e.clientX - r.left);
  }
  function py(e) {
    const r = canvas.getBoundingClientRect();
    return (e.clientY - r.top);
  }
  function onDown(e) {
    if (e.cancelable) e.preventDefault();
    pointerDown = true;
    AUD.init();
    if (state === 'PAUSE') { handlePauseTap(px(e), py(e)); return; }
    if (state === 'GUIDE') { guideDownX = px(e); guideDownY = py(e); guideSwiped = false; return; }
    if (state === 'MENU') {
      const mx = px(e), my = py(e);
      const hit = function (r) { return r && mx > r.x && mx < r.x + r.w && my > r.y && my < r.y + r.h; };
      if (hit(MENU_DESCEND)) { AUD.resume(); start(); return; }
      if (hit(MENU_SINK)) { AUD.resume(); start(true); return; }
      if (hit(MENU_GUIDE)) { guidePage = 0; state = 'GUIDE'; return; }
      if (hit(MENU_SETT)) { pausedFrom = 'MENU'; state = 'PAUSE'; return; }
      return;                                       // the menu is a choice now, not a tap-anywhere
    }
    if (state === 'DEAD') {
      if (now() - deadAt > (zen ? 1400 : 1000)) {
        if (zen) { zen = false; state = 'MENU'; saveSink(); AUD.suspend(); return; }
        const mx2 = px(e), my2 = py(e);
        if (DEAD_MENU && mx2 > DEAD_MENU.x && mx2 < DEAD_MENU.x + DEAD_MENU.w && my2 > DEAD_MENU.y && my2 < DEAD_MENU.y + DEAD_MENU.h) { state = 'MENU'; return; }
        AUD.resume(); start();
      }
      return;
    }
    // playing: pause pip?
    const mx = px(e), my = py(e);
    if (mx > W - sc(56) && my < SAFE_TOP + sc(56)) { pausedFrom = 'PLAY'; state = 'PAUSE'; AUD.suspend(); return; }
    AUD.resume();
    targetX = mx; pointerY = my;
    tryPing();
  }
  function handlePauseTap(mx, my) {
    for (const r of PAUSE_ROWS) {
      if (mx < r.x || mx > r.x + r.w || my < r.y || my > r.y + r.h) continue;
      if (r.act === 'resume') {
        state = pausedFrom === 'MENU' ? 'MENU' : 'PLAY';
        last = now(); acc = 0;
        if (state === 'PLAY') AUD.resume();
        return;
      }
      if (r.act === 'restart') { AUD.resume(); start(zen); return; }
      if (r.act === 'mainmenu') { if (zen) saveSink(); zen = false; state = 'MENU'; AUD.suspend(); return; }
      if (r.act === 'sink') { AUD.resume(); start(true); return; }
      if (r.act === 'steer') { OPT.steer = (OPT.steer + 1) % 3; saveOpt(); return; }
      if (r.act === 'sinktimer') { OPT.sinkTimer = (OPT.sinkTimer + 1) % SINK_TIMES.length; saveOpt(); return; }
      if (r.act === 'soundopen') { soundOpen = !soundOpen; return; }
      if (r.act in OPT) { OPT[r.act] = OPT[r.act] ? 0 : 1; saveOpt(); if (r.act === 'snd') AUD.master(); return; }
      return;
    }
  }
  function onMove(e) {
    if (e.cancelable) e.preventDefault();
    if (pointerDown && state === 'PLAY') { targetX = px(e); pointerY = py(e); }
    if (pointerDown && state === 'GUIDE' && !guideSwiped) {   // swipe left = next page, right = previous
      const dx = px(e) - guideDownX, dy = py(e) - guideDownY;
      if (Math.abs(dx) > sc(46) && Math.abs(dx) > Math.abs(dy)) {
        if (dx < 0) guidePage = Math.min(GUIDE_PAGES.length - 1, guidePage + 1);
        else guidePage = Math.max(0, guidePage - 1);
        guideSwiped = true;
      }
    }
  }
  function onUp(e) {
    if (e.cancelable) e.preventDefault();
    if (state === 'GUIDE' && pointerDown && !guideSwiped) handleGuideTap(guideDownX, guideDownY);
    pointerDown = false;
  }
  canvas.addEventListener('pointerdown', onDown, { passive: false });
  window.addEventListener('pointermove', onMove, { passive: false });
  window.addEventListener('pointerup', onUp, { passive: false });
  window.addEventListener('pointercancel', onUp, { passive: false });

  // ---- State -------------------------------------------------------------
  let state = 'MENU', deadAt = 0, best = 0;
  try { best = parseInt(localStorage.getItem('echo_best') || '0', 10) || 0; } catch (e) {}
  let sinkBest = 0, sinkDays = 0, sinkLastDay = '';
  try { sinkBest = parseInt(localStorage.getItem('echo_sinkbest') || '0', 10) || 0; } catch (e) {}
  try { sinkDays = parseInt(localStorage.getItem('echo_sinkdays') || '0', 10) || 0; } catch (e) {}
  try { sinkLastDay = localStorage.getItem('echo_sinkday') || ''; } catch (e) {}
  function saveSink() { try { localStorage.setItem('echo_sinkbest', String(sinkBest)); } catch (e) {} }
  function markSinkDay() { try { const d = new Date().toDateString(); if (d !== sinkLastDay) { sinkLastDay = d; sinkDays++; localStorage.setItem('echo_sinkdays', String(sinkDays)); localStorage.setItem('echo_sinkday', d); } } catch (e) {} }

  const me = { x: 0, y: 0, vx: 0, startY: 0 };
  let camTop = 0, camX = 0;    // camTop follows depth; camX slides the open water past the echo
  let genY = 0;                // depth cursor for spawning
  let jellies = [];     // bioluminescent, faintly self-lit  {y,x,baseX,r,sway,t}
  let vents = [];       // bubble vents that emit rising bubbles {x,y,emit}
  let bubbles = [];     // rising bubbles (lethal)            {x,y,r,vy,ph,amp}
  let anomalies = [];   // dark drifting anomalies (pulse-only, lethal) {x,y,r,drift,vy,t,pts,inr}
  let anglers = [];     // dark body + glowing lure (lure telegraphed, body pulse-only, lethal)
  let squids = [];      // abyss pursuer — lunges toward where you last pinged {x,y,vx,vy,state,...}
  let eels = [];        // dark undulating serpents crossing laterally (pulse-only, lethal)
  let siphos = [];      // hanging stinging-bead curtains (faintly lit, lethal)
  let currents = [];    // non-lethal depth bands that shove you sideways
  let nextJellyY = 0, nextVentY = 0, nextAnomalyY = 0, nextAnglerY = 0, nextEelY = 0, nextSiphoY = 0, nextCurrentY = 0, nextSquidY = 0;   // depth schedulers
  let driftX = 0, sinkV = sc(150);   // smoothed horizontal drift + vertical speed, for leading spawns to where you're heading
  let leviathan = null; // rare, vast, indifferent — cannot touch you
  let nextLevY = 0;
  let pings = [];       // {x,y,age,range}
  let pingCD = 0;
  let motes = [];       // plankton {x,y,s,p,z,d,tw}
  let shake = 0, dangerGlow = 0, deathFlash = 0;
  let coreFlare = 0;    // brief bloom when the echo calls out
  let echoWake = [];    // recent world positions -> falling trail
  const ECHO_LOOK = 'classic';   // <- 'resonance' for the alternate look

  function now() { return performance.now(); }
  // onboarding: 0 at the surface, ramps to 1 over the first ~5 screens of depth
  function ob() { return Math.min(1, Math.max(0, me.y - me.startY) / (H * 5)); }
  function cooldownNow() { return T.cooldown * (0.65 + 0.35 * ob()); }
  function glowNow() { return sc(T.selfGlow) * (1.5 - 0.5 * ob()); }
  // the deep closes in: each pulse reaches less far the lower you go (100% -> 70%)
  function pingRangeNow() {
    const depth = Math.max(0, me.y - me.startY);
    const dd = Math.min(1, depth / (H * 16));
    return sc(T.pingRange) * (1 - 0.30 * dd);
  }

  // ---- Open-world generation --------------------------------------------
  // hazards spawn in a horizontal spread around the echo's current column, so the
  // field stays populated no matter how far it steers across the open dark.
  function leadX(y) {                                   // predicted horizontal offset by the time you reach depth y
    const tt = Math.min(12, Math.max(0, y - me.y) / Math.max(sinkV, sc(30)));
    let l = driftX * tt, cap = W * 14;
    return l > cap ? cap : l < -cap ? -cap : l;
  }
  function spawnX(y) { const r = (Math.random() + Math.random()) - 1; return me.x + (y != null ? leadX(y) : 0) + r * (W * 0.5 + sc(120)); }

  function spawnJelly(y) {
    const r = sc(T.jellyR + Math.random() * 4);
    const x = spawnX(y);
    const sway = sc(T.jellySway) * (0.45 + Math.random() * 0.6);
    jellies.push({ u: ++UID, y: y, x: x, baseX: x, r: r, sway: sway, t: Math.random() * 6.28 });
  }

  function addBubble(x, y) {
    bubbles.push({ x: x, y: y, r: sc(4 + Math.random() * 5),
      vy: -sc(95 + Math.random() * 70), ph: Math.random() * 6.28, amp: sc(10 + Math.random() * 14) });
  }
  function spawnVent(y) {
    const vx = spawnX(y);
    vents.push({ u: ++UID, x: vx, y: y, emit: 0 });
    for (let i = 0; i < 9; i++) addBubble(vx + sc((Math.random() - 0.5) * 40), y - i * sc(34) - Math.random() * sc(20));
  }

  function spawnAnomaly(y) {
    const r = sc(28 + Math.random() * 30);
    const x = spawnX(y);
    const N = 20, pts = [], inr = [], a0 = Math.random() * 6.28;
    for (let i = 0; i < N; i++) {
      const a = a0 + (i / N) * Math.PI * 2;
      const wob = 0.72 + 0.34 * Math.sin(a * 3 + a0) * Math.sin(a * 2 - a0 * 1.7);
      pts.push([Math.cos(a) * r * wob, Math.sin(a) * r * wob]);
      inr.push([Math.cos(a) * r * wob * 0.52, Math.sin(a) * r * wob * 0.52]);
    }
    pts.push(pts[0]); inr.push(inr[0]);
    anomalies.push({ u: ++UID, x: x, y: y, r: r, drift: (Math.random() * 2 - 1) * sc(11),
      vy: (Math.random() * 2 - 1) * sc(7), t: Math.random() * 6.28, pts: pts, inr: inr });
  }

  function spawnLeviathan(y) {
    const ly = y + H * 0.7;
    const lx = me.x + sc((Math.random() - 0.5) * W * 0.45);
    const levU = sc(280 + Math.random() * 70);
    leviathan = { x: lx, y: ly, drift: (Math.random() < 0.5 ? -1 : 1) * sc(6 + Math.random() * 6), t: 0, U: levU, parts: buildLeviathan(levU) };
  }

  // anglerfish: a realistic deep-sea seadevil — bulbous body, gaping fanged jaw,
  // illicium arcing over the head to the glowing esca (the lure)
  function buildAngler(R, hy) {
    const X = R, Y = hy, P = (x, y) => [x * X, y * Y];
    const seg = (a, c, b, n) => qCurve(a, c, b, n || 8);
    const headTop = P(0.30, -0.95), napeBack = P(-0.35, -0.98), backMid = P(-0.85, -0.55),
      rearTop = P(-1.30, -0.16), rearBot = P(-1.30, 0.16), bellyMid = P(-0.80, 0.70),
      bellyFront = P(-0.10, 0.98), lowerHinge = P(0.35, 0.78), lowerTip = P(1.18, 0.40),
      upperTip = P(1.24, 0.06), snout = P(0.72, -0.30);
    const outline = [], add = a => { for (const p of a) outline.push(p); };
    add(seg(headTop, P(-0.02, -1.14), napeBack, 7));
    add(seg(napeBack, P(-0.65, -0.92), backMid, 7));
    add(seg(backMid, P(-1.18, -0.42), rearTop, 7));
    add(seg(rearTop, P(-1.44, 0.0), rearBot, 5));
    add(seg(rearBot, P(-1.18, 0.5), bellyMid, 7));
    add(seg(bellyMid, P(-0.5, 1.06), bellyFront, 7));
    add(seg(bellyFront, P(0.1, 1.02), lowerHinge, 6));
    add(seg(lowerHinge, P(0.78, 0.74), lowerTip, 8));
    add(seg(lowerTip, P(1.34, 0.24), upperTip, 6));
    add(seg(upperTip, P(1.02, -0.14), snout, 7));
    add(seg(snout, P(0.55, -0.72), headTop, 6));
    // needle teeth into the gape
    const teeth = [], upJaw = seg(snout, P(1.0, -0.05), upperTip, 6), loJaw = seg(lowerHinge, P(0.78, 0.62), lowerTip, 6);
    for (let i = 1; i < upJaw.length - 1; i++) { const p = upJaw[i], L = (0.11 + 0.06 * (i % 2)) * Y; teeth.push([p, [p[0] + 0.03 * X, p[1] + L]]); }
    for (let i = 1; i < loJaw.length - 1; i++) { const p = loJaw[i], L = (0.11 + 0.06 * ((i + 1) % 2)) * Y; teeth.push([p, [p[0] + 0.03 * X, p[1] - L]]); }
    // fins as small fans of rays
    const fan = (bx, by, ang, spread, len, k) => { const out = []; for (let i = 0; i < k; i++) { const tt = (k === 1 ? 0 : (i / (k - 1) - 0.5)) * spread; out.push([[bx * X, by * Y], [bx * X + Math.cos(ang + tt) * len * X, by * Y + Math.sin(ang + tt) * len * X]]); } return out; };
    const finP = fan(-0.15, 0.55, 1.15, 0.9, 0.42, 4);   // pectoral
    const finD = fan(-0.55, -0.62, -1.25, 0.7, 0.34, 3); // dorsal
    const tail = fan(-1.28, 0.0, Math.PI, 1.1, 0.58, 5); // caudal
    const gill = [P(0.18, -0.02), P(0.10, 0.30)];
    const eye = [0.52 * X, -0.34 * Y, Math.max(sc(1.6), 0.06 * X)];
    return { outline: outline, teeth: teeth, finP: finP, finD: finD, tail: tail, gill: gill, eye: eye };
  }
  function spawnAngler(y) {
    const rx = sc(26 + Math.random() * 16), ry = rx * (0.62 + Math.random() * 0.12);
    const drift = (Math.random() < 0.5 ? -1 : 1) * sc(9 + Math.random() * 10);
    anglers.push({ u: ++UID, x: spawnX(y), y: y, rx: rx, ry: ry, dir: drift < 0 ? -1 : 1, drift: drift,
      vy: (Math.random() * 2 - 1) * sc(6), t: Math.random() * 6.28,
      lureLen: rx * (1.0 + Math.random() * 0.5), shape: buildAngler(rx, ry) });
  }
  function spawnSquid(y) {
    squids.push({ u: ++UID, x: spawnX(y), y: y, vx: 0, vy: 0, r: sc(22),
      state: 'hover', stateT: 0, cd: 1 + Math.random() * 1.5, ang: Math.PI / 2, targAng: Math.PI / 2,
      t: Math.random() * 6.28, drift: (Math.random() * 2 - 1) * sc(9),
      tx: 0, ty: 0, mLen: sc(46 + Math.random() * 14), w: sc(14 + Math.random() * 3) });
  }
  // eel: a serpent that swims with a meandering head; the body follows and curls
  function spawnEel(y) {
    const dir = Math.random() < 0.5 ? -1 : 1;
    const hx = me.x + leadX(y) - dir * (W * 0.55 + sc(60)), hy = y;
    const heading = dir < 0 ? Math.PI : 0;
    const n = 18 + (Math.random() * 8 | 0), seg = sc(12 + Math.random() * 4);
    const pts = [];
    for (let i = 0; i <= n; i++) pts.push({ x: hx - Math.cos(heading) * i * seg, y: hy - Math.sin(heading) * i * seg });
    eels.push({ u: ++UID, pts: pts, x: hx, y: hy, heading: heading, n: n, seg: seg,
      w: sc(6.5 + Math.random() * 2.5), speed: sc(74 + Math.random() * 44), t: Math.random() * 6.28,
      tf1: 0.5 + Math.random() * 0.5, tf2: 1.3 + Math.random() * 0.9, ph1: Math.random() * 6.28, ph2: Math.random() * 6.28,
      turn: 1.5 + Math.random() * 1.1, dir: dir, flourishCd: 4 + Math.random() * 8, spin: 0, spinDir: 1 });
  }
  // siphonophore: a hanging colony of stinging beads that curls, breathes, and wanders
  function spawnSipho(y) {
    siphos.push({ u: ++UID, x: spawnX(y), y: y, n: 16 + (Math.random() * 12 | 0), seg: sc(22 + Math.random() * 8),
      br: sc(5 + Math.random() * 3),
      sp1: 0.6 + Math.random() * 0.5, sp2: 1.3 + Math.random() * 0.8,
      wl1: 0.22 + Math.random() * 0.18, wl2: 0.5 + Math.random() * 0.3,
      amp1: sc(16 + Math.random() * 16), amp2: sc(8 + Math.random() * 12),
      wander: sc(18 + Math.random() * 22), wph: Math.random() * 6.28, pulseSpd: 0.9 + Math.random() * 0.8,
      drift: (Math.random() * 2 - 1) * sc(8), vy: sc(8 + Math.random() * 14), t: Math.random() * 6.28,
      coil: 0, coilDir: 1, flourishCd: 5 + Math.random() * 9 });
  }
  // shared bead position so collision and drawing agree exactly
  function siphoBead(s, k) {
    const f = k / s.n;
    const env = s.coil > 0 ? Math.min(1, s.coil) : 0;                 // 0..1 flourish envelope
    const wander = Math.sin(s.t * 0.35 + s.wph) * s.wander;
    let curl = Math.sin(s.t * s.sp1 + k * s.wl1) * s.amp1 * f + Math.sin(s.t * s.sp2 + k * s.wl2) * s.amp2 * Math.pow(f, 1.4);
    curl *= (1 + env * 0.8);                                          // curls tighter during a flourish
    const spin = env * s.coilDir * Math.sin(s.t * 2.4 + f * 6.283) * s.amp1 * f;   // a rotating twist travels the colony
    const segNow = s.seg * (1 + 0.14 * Math.sin(s.t * s.pulseSpd + f * 2));
    return [s.x + wander + curl + spin, s.y + k * segNow];
  }
  // current: a non-lethal depth band that carries the echo sideways
  function spawnCurrent(y) {
    const streaks = [];
    for (let i = 0; i < 20; i++) streaks.push({ fx: Math.random(), fy: Math.random() * 2 - 1, len: sc(14 + Math.random() * 22), sp: 0.6 + Math.random() * 0.8 });
    currents.push({ y: y, h: H * (0.34 + Math.random() * 0.24), dir: Math.random() < 0.5 ? -1 : 1,
      speed: sc(80 + Math.random() * 55), t: Math.random() * 6.28, streaks: streaks });
  }

  function generate() {
    const genStep = sc(26);
    while (genY < camTop + H * 2.0) {
      genY += genStep;
      const d = genY - me.startY;
      if (genY >= nextJellyY) {
        spawnJelly(genY);
        nextJellyY += (d < H * 4 ? H * (0.85 + Math.random() * 0.4) : H * (0.7 + Math.random() * 0.8));
      }
      if (genY >= nextVentY) {
        if (d > H * 1.0) spawnVent(genY);
        nextVentY += (d < H * 6 ? H * (1.8 + Math.random() * 0.9) : H * (1.2 + Math.random() * 0.9));
      }
      if (genY >= nextAnomalyY) {
        if (d > H * 3.4) spawnAnomaly(genY);
        nextAnomalyY += (d < H * 6 ? H * (1.6 + Math.random() * 0.9) : H * (1.0 + Math.random() * 0.9));
      }
      if (genY >= nextAnglerY) {
        if (d > H * 7.0) spawnAngler(genY);
        nextAnglerY += (d < H * 8 ? H * (2.2 + Math.random() * 1.0) : H * (1.6 + Math.random() * 1.0));
      }
      if (genY >= nextEelY) {
        if (d > H * 4.0) spawnEel(genY);
        nextEelY += (d < H * 8 ? H * (2.2 + Math.random() * 1.1) : H * (1.6 + Math.random() * 1.1));
      }
      if (genY >= nextSiphoY) {
        if (d > H * 2.4) spawnSipho(genY);
        nextSiphoY += (d < H * 7 ? H * (2.0 + Math.random() * 1.0) : H * (1.4 + Math.random() * 1.0));
      }
      if (genY >= nextCurrentY) {
        if (d > H * 1.4) spawnCurrent(genY);
        nextCurrentY += H * (3.5 + Math.random() * 2.0);
      }
      if (!leviathan && genY >= nextLevY && d > H * 9) {
        spawnLeviathan(genY);
        nextLevY += H * (10 + Math.random() * 7);
      }
      if (genY >= nextSquidY) {
        if (d > H * 8) spawnSquid(genY);
        nextSquidY += (d < H * 13 ? H * (3.4 + Math.random() * 1.6) : H * (2.4 + Math.random() * 1.4));
      }
    }
    // cull anything well above the view or a full screen off to the side
    const cullY = camTop - sc(90), farX = W + sc(220), farXe = W + sc(480);
    if (jellies.length)   jellies   = jellies.filter(j => j.y > cullY - sc(160) && Math.abs(j.x - me.x) < farX);
    if (bubbles.length)   bubbles   = bubbles.filter(b => b.y > cullY && Math.abs(b.x - me.x) < farX);
    if (vents.length)     vents     = vents.filter(v => v.y > cullY - sc(40) && Math.abs(v.x - me.x) < farX);
    if (anomalies.length) anomalies = anomalies.filter(an => an.y > cullY - sc(120) && Math.abs(an.x - me.x) < farX);
    if (anglers.length)   anglers   = anglers.filter(an => an.y > cullY - sc(140) && Math.abs(an.x - me.x) < farX);
    if (eels.length)      eels      = eels.filter(e => e.y > cullY - sc(320) && Math.abs(e.x - me.x) < farXe);
    if (siphos.length)    siphos    = siphos.filter(s => (s.y + s.n * s.seg) > cullY && Math.abs(s.x - me.x) < farX);
    if (currents.length)  currents  = currents.filter(c => (c.y + c.h) > cullY - sc(40));
    if (squids.length)    squids    = squids.filter(sq => sq.y > cullY - sc(200) && Math.abs(sq.x - me.x) < farXe);
  }

  // ---- Motes (plankton) --------------------------------------------------
  function buildMotes() {
    motes = [];
    const n = Math.round((W * H) / 22000);
    for (let i = 0; i < n; i++) {
      const d01 = Math.random();                          // 0 near .. 1 far
      motes.push({ x: Math.random() * W, y: Math.random() * H,
                   s: (1.7 - 1.2 * d01) * (0.55 + Math.random() * 0.5),
                   p: 0.95 - 0.80 * d01,                  // near scrolls fast, far drifts slow
                   z: d01 * sc(300),                       // far = the wave reaches it later & dimmer
                   d: d01, tw: Math.random() * Math.PI * 2 });
    }
  }
  buildMotes();
  window.addEventListener('resize', buildMotes);

  // ---- Lifecycle ---------------------------------------------------------
  function start(zenMode) {
    zen = !!zenMode;
    if (zen) markSinkDay();
    state = 'PLAY';
    me.x = 0; me.y = 0; me.vx = 0; me.startY = 0;
    targetX = W * 0.5;
    camTop = me.y - H * 0.4; camX = me.x - W * 0.5;
    jellies = []; bubbles = []; vents = []; anomalies = []; anglers = []; eels = []; siphos = []; currents = []; squids = []; pings = [];
    genY = camTop - sc(30);
    nextJellyY = me.startY + H * 1.2;
    nextVentY = me.startY + H * 1.6;
    nextAnomalyY = me.startY + H * 1.3;
    nextAnglerY = me.startY + H * 2.0;
    nextSquidY = me.startY + H * 8.5;
    nextEelY = me.startY + H * 2.2;
    nextSiphoY = me.startY + H * 1.7;
    nextCurrentY = me.startY + H * 2.0;
    leviathan = null; nextLevY = me.startY + H * (6 + Math.random() * 4);

    coreFlare = 0; echoWake = [];
    zenPulse = 0;
    zenRemain = (zen && SINK_TIMES[OPT.sinkTimer] > 0) ? SINK_TIMES[OPT.sinkTimer] * 60 : 0;
    generate();
    ping(true);                 // reveal the opening
  }

  function die() {
    if (state !== 'PLAY' || zen) return;   // in Sink mode you pass through everything
    state = 'DEAD'; deadAt = now();
    shake = OPT.rmotion ? 0 : sc(7); deathFlash = OPT.rmotion ? 0 : 1;
    AUD.death();
    ping(true);                 // one last reveal of where you came to rest
    const s = scoreVal();
    if (s > best) { best = s; try { localStorage.setItem('echo_best', String(best)); } catch (e) {} }
  }

  function scoreVal() { return Math.floor(Math.max(0, me.y - me.startY) / sc(T.pxPerM)); }

  // ---- Ping --------------------------------------------------------------
  function ping(force) {
    pings.push({ x: me.x, y: me.y, age: 0, range: pingRangeNow(), life: T.pingLife * (OPT.hivis ? 1.35 : 1) });
    if (pings.length > 7) pings.shift();
    coreFlare = Math.min(1.2, coreFlare + 0.9);   // the echo flares as it calls
    if (!force) pingCD = cooldownNow();
    for (const sq of squids) {                        // your pulse gives you away
      if (sq.state === 'hover' && sq.cd <= 0) {
        const dx = me.x - sq.x, dy = me.y - sq.y;
        if (dx * dx + dy * dy < sc(500) * sc(500)) { sq.state = 'wind'; sq.stateT = 0; sq.tx = me.x; sq.ty = me.y; sq.targAng = Math.atan2(dy, dx); }
      }
    }
    if (OPT.call) {
      const df = Math.min(1, Math.max(0, me.y - me.startY) / (H * 26));
      const top = HZ * 2 * Math.pow(0.5, df);         // 272.2 shallow, 136.1 deep
      AUD.tone(top, 0.95, 0.12, 'sine', 0, 0.5, 0.12, 6, 4.2);   // falls an octave, landing on the root
    }
  }
  function tryPing() { if (pingCD <= 0) ping(false); }

  // brightness 0..1 contributed by all pings at a world point
  function lightAt(x, y, z) {
    let b = 0;
    const band = sc(T.pingBand), speed = sc(T.pingSpeed), z2 = z ? z * z : 0;
    for (let i = 0; i < pings.length; i++) {
      const p = pings[i];
      const range = p.range || sc(T.pingRange);
      const dx = x - p.x, dy = y - p.y;
      const d = Math.sqrt(dx * dx + dy * dy + z2);
      if (d > range) continue;
      const ringR = p.age * speed;
      if (d > ringR) continue;                              // ring hasn't arrived
      const fade = Math.max(0, 1 - p.age / (p.life || T.pingLife));
      const falloff = 1 - d / range;
      const linger = fade * falloff * 0.7;
      let spike = 0;
      const behind = ringR - d;
      if (behind < band) spike = (1 - behind / band) * fade * falloff;
      const v = Math.max(linger, spike);
      if (v > b) b = v;
    }
    return b > 1 ? 1 : b;
  }

  // ---- The leviathan -----------------------------------------------------
  // draw a polyline where each tiny segment only shows where a pulse reaches it,
  // so the sonar never gives you more than a passing sliver of something vast
  function levStroke(pts, base, w, col) {
    for (let i = 1; i < pts.length; i++) {
      const x0 = pts[i - 1][0], y0 = pts[i - 1][1], x1 = pts[i][0], y1 = pts[i][1];
      const lit = lightAt((x0 + x1) / 2, (y0 + y1) / 2);
      if (lit < 0.06) continue;
      ctx.globalAlpha = base * lit;
      ctx.lineWidth = w; ctx.strokeStyle = col;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  function arcPts(cx, cy, rx, ry, a0, a1, n) {

    return out;
  }

  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function tentacle(rx, ry, ang0, len, baseW, curl) {

    return { cen, top, bot, curl };

  // Build a massive tentacled head once at spawn (local coords, eye at origin).

    fills.push({ pts: arcPts(0, R * 0.2, R * 3.0, R * 3.3, 0, Math.PI * 2, 44), cx: 0, cy: 0, col: [0, 1, 4], a: 0.45 });
    seg.push({ pts: arcPts(0, 0, R, R * 0.94, 0, Math.PI * 2, 72), base: 0.85, w: sc(2.4), col });
    seg.push({ pts: qCurve([-R * 1.7, R * 0.15], [0, -R * 2.1], [R * 1.8, -R * 0.2], 40), base: 0.55, w: sc(2.4), col });
    seg.push({ pts: qCurve([-R * 1.4, R * 1.4], [0, R * 2.0], [R * 1.6, R * 1.1], 32), base: 0.4, w: sc(1.8), col });
    seg.push({ pts: arcPts(0, 0, R * 0.66, R * 0.66, 0, Math.PI * 2, 52), base: 0.62, w: sc(1.9), col });
    for (let i = 0; i < 28; i++) { const a = (i / 28) * Math.PI * 2; seg.push({ pts: [[Math.cos(a) * R * 0.34, Math.sin(a) * R * 0.34], [Math.cos(a) * R * 0.62, Math.sin(a) * R * 0.62]], base: 0.4, w: sc(1.3), col }); }
    seg.push({ pts: arcPts(0, 0, R * 0.16, R * 0.66, -Math.PI / 2, Math.PI / 2, 22).concat(arcPts(0, 0, R * 0.16, R * 0.66, Math.PI / 2, Math.PI * 1.5, 22)), base: 0.85, w: sc(2), col: hot });
    fills.push({ pts: arcPts(0, 0, R * 0.15, R * 0.62, 0, Math.PI * 2, 30), cx: 0, cy: 0, col: [0, 1, 4], a: 0.9 });
    fills.push({ pts: arcPts(-R * 0.2, -R * 0.24, R * 0.11, R * 0.11, 0, Math.PI * 2, 14), cx: -R * 0.2, cy: -R * 0.24, col: LEV_HOT, a: 0.95 });
    for (let k = 0; k < 5; k++) {
      const t = (k - 2) / 2, baseA = -Math.PI / 2 + t * 0.55;
      const bx = Math.cos(baseA) * 1.15 * R, by = Math.sin(baseA) * 1.15 * R, dir = baseA - 0.1, len = (3.4 - Math.abs(t) * 0.7) * R;
      const tip = [bx + Math.cos(dir) * len, by + Math.sin(dir) * len];
      const c = [(bx + tip[0]) / 2 + Math.cos(dir + 1.4) * 0.4 * R, (by + tip[1]) / 2 + Math.sin(dir + 1.4) * 0.4 * R];
      const e1 = qCurve([bx - 0.12 * R, by], c, tip, 16), e2 = qCurve([bx + 0.12 * R, by], [c[0] + 0.12 * R, c[1]], tip, 16);
      fills.push({ pts: e1.concat(e2.slice().reverse()), cx: (bx + tip[0]) / 2, cy: (by + tip[1]) / 2, col: [8, 14, 22], a: 0.5 });
      seg.push({ pts: e1, base: 0.4, w: sc(1.4), col }); seg.push({ pts: e2, base: 0.4, w: sc(1.4), col });
    }

    for (let k = 0; k < arms; k++) {
      const ang = lerp(-0.22 * Math.PI, 1.22 * Math.PI, k / (arms - 1));
      const bx = Math.cos(ang) * 1.3 * R, by = Math.sin(ang) * 1.3 * R;
      const len = (4.4 + ((k * 3) % 4) * 0.6) * R, bw = 0.5 * R, curl = (k % 2 ? 1 : -1) * (1.7 + ((k * 2) % 3) * 0.25);

      seg.push({ pts: Tn.bot, base: 0.5, w: sc(1.6), col });
      seg.push({ pts: Tn.cen, base: 0.15, w: sc(1), col });
      const edge = curl < 0 ? Tn.top : Tn.bot;
      for (let i = 3; i < Tn.cen.length - 2; i += 4) { const u = i / (Tn.cen.length - 1); const rr = (bw * Math.pow(1 - u, 1.3)) * 0.5; if (rr < sc(4)) continue; const p = edge[i]; seg.push({ pts: arcPts(p[0], p[1], rr, rr, 0, Math.PI * 2, 10), base: lerp(0.42, 0.12, u), w: sc(1), col }); }
    }
    const bky = 1.5 * R;
    fills.push({ pts: [[0.5 * R, bky - 0.45 * R], [-0.45 * R, bky + 0.55 * R], [0.45 * R, bky + 0.35 * R]], cx: 0, cy: bky, col: [2, 6, 12], a: 0.9 });
    seg.push({ pts: [[0.5 * R, bky - 0.45 * R], [-0.45 * R, bky + 0.55 * R]], base: 0.7, w: sc(1.7), col: hot });
    return { seg, fills };
  }
  function drawLeviathan() {
    const L = leviathan; if (!L || !L.parts) return;
    const ox = L.x, oy = L.y, P = L.parts;
    for (let f = 0; f < P.fills.length; f++) {
      const q = P.fills[f], lit = lightAt(ox + q.cx, oy + q.cy);
      if (lit < 0.05) continue;
      ctx.fillStyle = rgb(q.col, (q.a || 0.7) * 0.72 * lit); ctx.beginPath();
      const pts = q.pts;
      for (let i = 0; i < pts.length; i++) { const px = ox + pts[i][0], py = oy + pts[i][1]; if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
      ctx.closePath(); ctx.fill();
    }
    for (let s = 0; s < P.seg.length; s++) {
      const g = P.seg[s], pts = g.pts; ctx.lineWidth = g.w; ctx.strokeStyle = g.col;
      for (let i = 1; i < pts.length; i++) {
        const ax = ox + pts[i - 1][0], ay = oy + pts[i - 1][1], bx = ox + pts[i][0], by = oy + pts[i][1];
        const lit = lightAt((ax + bx) / 2, (ay + by) / 2);
        if (lit < 0.06) continue;
        ctx.globalAlpha = g.base * 0.6 * lit; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
      }
    }

  }

  // ---- Physics -----------------------------------------------------------
  const DT = 1 / 120;
  function step() {
    const depth = Math.max(0, me.y - me.startY);
    const df = Math.min(1, depth / (H * 26));
    const sink = sc(T.sink * (0.55 + 0.45 * ob()) + T.sinkGain * df);
    me.y += sink * DT;
    sinkV = sink;

    // release the finger and the echo eases back to straight-down
    if (!pointerDown) targetX += (W * 0.5 - targetX) * 0.08;
    // steering authority scales with WHERE you hold: full up near mid-screen, fine near the bottom
    const tyN = Math.min(1, Math.max(0, (pointerY / H - 0.45) / 0.55));
    const steerGain = 1 - tyN * 0.72;                  // 1.0 near middle -> ~0.28 at the very bottom
    // steer toward the tapped screen column (relative to the echo's on-screen position)
    me.vx += (targetX - (me.x - camX)) * T.swim * steerGain * STEERK[OPT.steer] * DT;
    me.vx *= T.swimDamp;
    const mxs = sc(T.maxSwim);
    if (me.vx > mxs) me.vx = mxs; if (me.vx < -mxs) me.vx = -mxs;
    me.x += me.vx * DT;
    driftX += (me.vx - driftX) * Math.min(1, DT * 2.5);   // steady sideways trend

    const cr = sc(T.cr);
    let nearest = 1e9;
    const tsec = now() / 1000;

    // jellyfish: gentle sway, lethal on contact
    for (let i = 0; i < jellies.length; i++) {
      const j = jellies[i];
      j.t += DT;
      j.x = j.baseX + j.sway * Math.sin(j.t * T.jellySwaySpd);
      const dx = me.x - j.x, dy = me.y - j.y, rr = j.r + cr, dd = dx * dx + dy * dy;
      if (dd < rr * rr) { if (!zen) { die(); return; } }
      const gap = dd - rr * rr; if (gap < nearest) nearest = gap;
    }
    // rising bubbles: fast closing speed, lethal
    for (let i = 0; i < bubbles.length; i++) {
      const b = bubbles[i];
      b.y += b.vy * DT;
      b.x += Math.sin(b.ph + tsec * 2.2) * b.amp * DT;
      const dx = me.x - b.x, dy = me.y - b.y, rr = b.r + cr, dd = dx * dx + dy * dy;
      if (dd < rr * rr) { if (!zen) { die(); return; } }
      const gap = dd - rr * rr; if (gap < nearest) nearest = gap;
    }
    // dark anomalies: drift, lethal
    for (let i = 0; i < anomalies.length; i++) {
      const an = anomalies[i];
      an.t += DT; an.x += an.drift * DT; an.y += an.vy * DT;
      const dx = me.x - an.x, dy = me.y - an.y, rr = an.r * 0.82 + cr, dd = dx * dx + dy * dy;
      if (dd < rr * rr) { if (!zen) { die(); return; } }
      const gap = dd - rr * rr; if (gap < nearest) nearest = gap;
    }
    // anglerfish: drifts; lethal along the dark body (elliptical hitbox), not the lure
    for (let i = 0; i < anglers.length; i++) {
      const an = anglers[i];
      an.t += DT; an.x += an.drift * DT; an.y += an.vy * DT;
      const bx = (me.x - an.x) * an.dir, by = me.y - an.y;
      const ex = bx / (an.rx * 0.92 + cr), ey = by / (an.ry * 0.95 + cr);

      const gap = (bx * bx + by * by) - (an.rx + cr) * (an.rx + cr); if (gap < nearest) nearest = gap;
    }
    // colossal squid: hovers, then jets toward where you last pinged — lethal on contact
    for (let i = 0; i < squids.length; i++) {
      const sq = squids[i];
      sq.t += DT;
      if (sq.state === 'hover') {
        sq.cd -= DT;
        sq.x += sq.drift * DT + Math.sin(sq.t * 0.6) * sc(6) * DT;
        sq.y += Math.sin(sq.t * 0.4) * sc(5) * DT;
        sq.ang += (Math.sin(sq.t * 0.5) * 0.4 + (Math.PI / 2) - sq.ang) * 0.6 * DT;

        sq.stateT += DT;

        if (sq.stateT > 0.32) { sq.state = 'jet'; sq.stateT = 0; const js = sc(700); sq.vx = Math.cos(sq.targAng) * js; sq.vy = Math.sin(sq.targAng) * js; }
      } else if (sq.state === 'jet') {                 // the lunge — toward your afterimage, so move after you ping
        sq.stateT += DT;
        sq.x += sq.vx * DT; sq.y += sq.vy * DT;

        if (sq.stateT > 0.5) { sq.state = 'recover'; sq.stateT = 0; }

        sq.stateT += DT;
        sq.x += sq.vx * DT; sq.y += sq.vy * DT; sq.vx *= 0.9; sq.vy *= 0.9;
        if (sq.stateT > 0.6) { sq.state = 'hover'; sq.cd = 2.2 + Math.random() * 1.5; }
      }
      const dx = me.x - sq.x, dy = me.y - sq.y, rr = sq.r + cr, dd = dx * dx + dy * dy;
      if (dd < rr * rr) { if (!zen) { die(); return; } }

    }

    for (let i = 0; i < eels.length; i++) {
      const e = eels[i];
      e.t += DT;
      e.flourishCd -= DT;
      if (e.flourishCd <= 0 && e.spin <= 0) { e.spin = 1.4 + Math.random() * 1.3; e.spinDir = Math.random() < 0.5 ? -1 : 1; e.flourishCd = 7 + Math.random() * 9; }
      let turnRate = (Math.sin(e.t * e.tf1 + e.ph1) + 0.6 * Math.sin(e.t * e.tf2 + e.ph2)) * e.turn;
      if (e.spin > 0) { e.spin -= DT; turnRate += e.spinDir * e.turn * 3.2; }   // a tight coiling flourish
      e.heading += turnRate * DT;
      const h = e.pts[0];
      h.x += Math.cos(e.heading) * e.speed * DT;
      h.y += Math.sin(e.heading) * e.speed * DT;
      for (let k = 1; k <= e.n; k++) {
        const p = e.pts[k], q = e.pts[k - 1];
        let dx = p.x - q.x, dy = p.y - q.y; const L = Math.hypot(dx, dy) || 1;
        p.x = q.x + dx / L * e.seg; p.y = q.y + dy / L * e.seg;
      }
      e.x = h.x; e.y = h.y;
      const rr = e.w + cr;
      for (let k = 0; k <= e.n; k += 2) {
        const p = e.pts[k], dx = me.x - p.x, dy = me.y - p.y, dd = dx * dx + dy * dy;
        if (dd < rr * rr) { if (!zen) { die(); return; } }
        const gap = dd - rr * rr; if (gap < nearest) nearest = gap;
      }
    }
    // siphonophores: a curling, breathing colony of stinging beads, lethal on contact
    for (let i = 0; i < siphos.length; i++) {
      const s = siphos[i];
      s.t += DT; s.x += s.drift * DT; s.y += s.vy * DT;
      s.flourishCd -= DT;
      if (s.flourishCd <= 0 && s.coil <= 0) { s.coil = 2.0 + Math.random() * 1.6; s.coilDir = Math.random() < 0.5 ? -1 : 1; s.flourishCd = 8 + Math.random() * 10; }
      if (s.coil > 0) s.coil -= DT;
      const rr = s.br + cr;
      for (let k = 0; k < s.n; k++) {
        const b = siphoBead(s, k);
        if (Math.abs(b[1] - me.y) > s.seg + rr) continue;
        const dx = me.x - b[0], dy = me.y - b[1], dd = dx * dx + dy * dy;
        if (dd < rr * rr) { if (!zen) { die(); return; } }
        const gap = dd - rr * rr; if (gap < nearest) nearest = gap;
      }
    }
    // currents: non-lethal, carry the echo sideways while it sinks through the band
    for (let i = 0; i < currents.length; i++) {
      const c = currents[i];
      c.t += DT;
      const dy = Math.abs(me.y - c.y);
      if (dy < c.h) { const fall = 1 - dy / c.h; me.x += c.dir * c.speed * fall * fall * DT; }
    }
    // vents emit rising bubbles while near the view
    for (let i = 0; i < vents.length; i++) {
      const v = vents[i];
      if (v.y > camTop - sc(40) && v.y < camTop + H * 1.5) {
        v.emit -= DT;
        if (v.emit <= 0) { v.emit = 0.11 + Math.random() * 0.13; addBubble(v.x + sc((Math.random() - 0.5) * 40), v.y); }
      }
    }
    if (bubbles.length > 170) bubbles.splice(0, bubbles.length - 170);

    // proximity danger feedback (nearest lethal thing; only seen when a pulse lights you)
    const near = Math.sqrt(Math.max(0, nearest));
    const dz = 1 - Math.min(1, near / sc(120));
    dangerGlow += (Math.max(0, dz) - dangerGlow) * 0.2;

    // the leviathan drifts, indifferent; it cannot touch you
    if (leviathan) {
      leviathan.t += DT;
      leviathan.x += leviathan.drift * DT;
      if (camTop > leviathan.y + H * 3.5) leviathan = null;
    }

    // cameras: depth follows the sink; the world slides sideways to keep the echo centred
    camTop += (me.y - H * 0.4 - camTop) * 0.12;
    camX += (me.x - W * 0.5 - camX) * 0.11;
    const lean = W * 0.34;                                // never let the echo leave the centre band
    const off = me.x - camX - W * 0.5;
    if (off > lean) camX = me.x - W * 0.5 - lean;
    else if (off < -lean) camX = me.x - W * 0.5 + lean;
    generate();
  }

  // ---- Update ------------------------------------------------------------
  let last = now(), acc = 0;
  function update() {
    const t = now(); let dt = (t - last) / 1000; last = t;
    if (dt > 0.1) dt = 0.1;
    if (state === 'PLAY') {
      acc += dt;
      while (acc >= DT) { step(); acc -= DT; if (state !== 'PLAY') break; }
      if (pingCD > 0) pingCD -= dt;
      if (zen) {
        zenPulse -= dt;
        if (zenPulse <= 0) { zenPulse = 2.6; ping(true); }   // a slow breath; the deep answers on its own
        const cur = scoreVal(); if (cur > sinkBest) { sinkBest = cur; saveSink(); }
        if (zenRemain > 0) { zenRemain -= dt; if (zenRemain <= 0) { state = 'DEAD'; deadAt = now(); saveSink(); } }   // the session closes, gently
      }
    }
    if (state !== 'PAUSE') {
      for (let i = pings.length - 1; i >= 0; i--) {
        pings[i].age += dt;
        if (pings[i].age > (pings[i].life || T.pingLife) + 0.2) pings.splice(i, 1);
      }
      if (shake > 0) shake = Math.max(0, shake - dt * sc(50));
      if (coreFlare > 0) coreFlare = Math.max(0, coreFlare - dt * 2.2);
      if (deathFlash > 0) deathFlash = Math.max(0, deathFlash - dt * 0.8);
    }

    // ---- returning echoes: the wavefront reports what it touches ---------
    if (AUD.ctx && OPT.snd && OPT.echo && state !== 'PAUSE' && (state === 'PLAY' || state === 'DEAD')) {
      let fired = 0;
      const speed = sc(T.pingSpeed);
      for (let pi = 0; pi < pings.length; pi++) {
        const p = pings[pi];
        const r0 = (p.prevAge || 0) * speed, r1 = p.age * speed;
        const range = p.range || sc(T.pingRange);
        if (!p.heard) p.heard = {};
        const hear = function (u, x, y, base, fn) {
          if (fired >= 2 || p.heard[u]) return;
          const d = Math.hypot(x - p.x, y - p.y);
          if (d > r0 && d <= r1 && d <= range) {
            p.heard[u] = 1; fired++;
            const v = base * (1 - d / range);
            const pan = Math.max(-1, Math.min(1, (x - me.x) / (W * 0.6)));
            if (v > 0.008) fn(v, pan);
          }
        };
        for (const j of jellies) hear(j.u, j.x, j.y, 0.13, function (v, pn) { AUD.hiss(0.6, v * 0.5, HZ * 8, pn, 9, 0, 0.15); });
        for (const an of anomalies) hear(an.u, an.x, an.y, 0.16, function (v, pn) { AUD.hiss(0.55, v * 0.6, HZ * 2, pn, 7, 0, 0.12); });
        for (const an of anglers) hear(an.u, an.x, an.y, 0.13, function (v, pn) { AUD.hiss(0.6, v * 0.5, HZ * 4, pn, 8, 0, 0.15); });
        for (const sq of squids) hear(sq.u, sq.x, sq.y, 0.18, function (v, pn) { AUD.hiss(0.45, v * 0.6, HZ * 3, pn, 5, 0.5, 0.05); });
        for (const e2 of eels) hear(e2.u, e2.pts[0].x, e2.pts[0].y, 0.12, function (v, pn) { AUD.hiss(0.5, v * 0.5, HZ * 6, pn, 8, 0, 0.1); });
        for (const s2 of siphos) hear(s2.u, s2.x, s2.y + s2.n * s2.seg * 0.4, 0.11, function (v, pn) { AUD.hiss(0.55, v * 0.5, HZ * 10, pn, 9, 0, 0.15); });
        for (const v2 of vents) hear(v2.u, v2.x, v2.y, 0.10, function (v, pn) { AUD.hiss(0.6, v * 0.42, HZ, pn, 0.5, 0, 0.2, 'lowpass'); });
        if (leviathan) hear(leviathan.u || (leviathan.u = ++UID), leviathan.x, leviathan.y, 0.32, function (v, pn) { AUD.hiss(2.4, Math.min(0.12, v * 0.9), HZ * 0.5, pn, 6, 0, 0.5); });
      }
      for (let pi = 0; pi < pings.length; pi++) pings[pi].prevAge = pings[pi].age;
    }

    // ---- continuous audio: pressure, heartbeat, fx ------------------------
    if (AUD.ctx && state !== 'PAUSE') {
      const c = AUD.ctx, ct = c.currentTime;
      const df = Math.min(1, Math.max(0, me.y - me.startY) / (H * 26));
      const playing = state === 'PLAY';
      if (AUD.ambG) {
        AUD.ambG.gain.setTargetAtTime(playing && OPT.snd && OPT.amb ? 0.055 : 0, ct, 0.4);
        AUD.ambF.frequency.setTargetAtTime(560 - 380 * df, ct, 0.5);
      }
      // danger: rising water — a low swell that grows as something nears
      if (AUD.dG) {
        const on = playing && OPT.snd && OPT.danger && !zen && dangerGlow > 0.12;
        const tgt = on ? 0.16 * Math.min(1, (dangerGlow - 0.12) / 0.7) : 0;
        AUD.dG.gain.setTargetAtTime(tgt, ct, on ? 0.3 : 0.12);
        AUD.dOsc.frequency.setTargetAtTime(HZ * 0.5 + 4 * dangerGlow, ct, 0.35);
      }
      // fx: bubble fizz nearby + current wash
      if (AUD.fxCD > 0) AUD.fxCD -= dt;
      let inCur = false;
      if (playing && OPT.fx) {
        for (const cu of currents) { if (Math.abs(me.y - cu.y) < cu.h) { inCur = true; break; } }
        if (AUD.fxCD <= 0) {
          for (const b of bubbles) {
            const d = Math.hypot(b.x - me.x, b.y - me.y);
            if (d < sc(85)) { AUD.hiss(0.16, 0.07, HZ * (1.5 + Math.random()), (b.x - me.x) / (W * 0.6), 3, 0.55, 0.02); AUD.fxCD = 0.18; break; }
          }
        }
      }
      if (AUD.washG) AUD.washG.gain.setTargetAtTime(playing && OPT.snd && OPT.fx && inCur ? 0.045 : 0, ct, 0.15);
    }
  }

      // siphonophore curtains (faintly lit stinging beads)
      for (const s of siphos) {
        const m = s.amp1 + s.amp2 + s.wander + sc(50);
        if (s.y > bot || (s.y + s.n * s.seg) < top || s.x < wl - m || s.x > wr + m) continue;
        drawSipho(s);
      }

      // expanding ping rings — the echo's only trace; flush red when near danger
      const dgv = zen ? 0 : Math.min(1, dangerGlow);
      const ringCol = [CYAN[0] + (DANGER[0] - CYAN[0]) * dgv, CYAN[1] + (DANGER[1] - CYAN[1]) * dgv, CYAN[2] + (DANGER[2] - CYAN[2]) * dgv];
      for (const p of pings) {
        const pr = p.range || sc(T.pingRange);
        const ringR = p.age * sc(T.pingSpeed);
        if (ringR > pr + sc(40)) continue;
        const a = Math.max(0, 1 - p.age / (p.life || T.pingLife)) * 0.28;
        if (a <= 0.01) continue;
        ctx.lineWidth = sc(1.7); ctx.strokeStyle = rgb(ringCol, a);
        ctx.beginPath(); ctx.arc(p.x, p.y, ringR, 0, Math.PI * 2); ctx.stroke();
      }

      // creature
      if (state === 'PLAY') drawCreature(t);

      ctx.restore();
    } else {
      ctx.restore();
      // menu ambient motes
      for (const mo of motes) {
        const tw = 0.4 + 0.4 * Math.sin(t * 1.5 + mo.tw);
        ctx.fillStyle = rgb(CYAN, 0.06 + mo.p * 0.08 * tw);
        ctx.beginPath(); ctx.arc(mo.x, mo.y, mo.s, 0, Math.PI * 2); ctx.fill();
      }
    }

    // death flash (full-screen reveal pulse)
    if (deathFlash > 0) { ctx.fillStyle = rgb(CYAN, deathFlash * 0.12); ctx.fillRect(0, 0, W, H); }

    // ---- HUD / overlays --------------------------------------------------
    if (state === 'PLAY') {
      SND.draw(ctx, String(scoreVal()), W / 2, SAFE_TOP + sc(74), sc(42), rgb(CYAN_HOT, 0.92), 'center', 0.08);
      if (zen) {
        SND.draw(ctx, 'METRES DEEP', W / 2, SAFE_TOP + sc(96), sc(9.5), rgb(DIMS, 0.85), 'center', 0.3);
        if (zenRemain > 0) {
          const rem = Math.max(0, zenRemain), mm = Math.floor(rem / 60), ss = Math.floor(rem % 60);
          SND.draw(ctx, mm + (ss < 10 ? ':0' : ':') + ss, W / 2, SAFE_TOP + sc(116), sc(10), rgb(MARI, 0.7), 'center', 0.14);
        }
        SND.draw(ctx, 'SINK INTO THE DEEP', W / 2, H - SAFE_BOTTOM - sc(28), sc(9), rgb(DIMS, 0.5), 'center', 0.26);
      } else {
        SND.draw(ctx, 'METRES DEEP', W / 2, SAFE_TOP + sc(96), sc(9.5), rgb(DIMS, 0.85), 'center', 0.3);
        const cdReady = pingCD <= 0;
        ctx.fillStyle = cdReady ? rgb(MARI, 0.9) : rgb(DIMS, 0.35);
        ctx.beginPath(); ctx.arc(W / 2, SAFE_TOP + sc(114), sc(3.5), 0, Math.PI * 2); ctx.fill();
        SND.draw(ctx, 'TAP TO PULSE ' + '\u00b7' + ' HOLD LEFT / RIGHT TO STEER', W / 2, H - SAFE_BOTTOM - sc(28), sc(9), rgb(DIMS, 0.55), 'center', 0.22);
      }

      // pause pip (top-right)
      ctx.fillStyle = rgb(DIMS, 0.65);
      ctx.fillRect(W - sc(38), SAFE_TOP + sc(20), sc(4.5), sc(15));
      ctx.fillRect(W - sc(29), SAFE_TOP + sc(20), sc(4.5), sc(15));
    }
    if (state === 'MENU') drawMenu(t);
    if (state === 'DEAD') drawDead(t);
    if (state === 'PAUSE') drawPause(t);
    if (state === 'GUIDE') drawGuide(t);
  }

  function drawJelly(j) {                              // MEDUSA — translucent bell, canals, oral arms, fine tentacles
    const x = j.x, y = j.y, r = j.r;
    const lit = lightAt(x, y), L2 = Math.min(1, lit * 1.5);
    const baseA = OPT.hivis ? 0.16 : 0.10;
    const a = baseA + L2 * 0.75;
    const pulse = 1 + 0.10 * Math.sin(j.t * 1.8);
    const R = r * pulse;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // soft bell glow
    const glowR = r + sc(T.jellyGlow);
    const g = ctx.createRadialGradient(x, y, r * 0.2, x, y, glowR);
    g.addColorStop(0, rgb(JELLY, (OPT.hivis ? 0.22 : 0.11) + L2 * 0.5));
    g.addColorStop(1, rgb(JELLY, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, glowR, 0, Math.PI * 2); ctx.fill();
    // translucent bell fill + dome with wavy margin
    ctx.fillStyle = rgb(JELLY, a * 0.14);
    ctx.beginPath(); ctx.arc(x, y, R, Math.PI, 0); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = rgb(JELLY, a); ctx.lineWidth = sc(1.7);
    ctx.beginPath();
    for (let i = 0; i <= 18; i++) {
      const ang = Math.PI + Math.PI * i / 18, rr = R * (1 + 0.045 * Math.sin(ang * 4));
      const px = x + Math.cos(ang) * rr, py = y + Math.sin(ang) * rr * 0.9;
      if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.stroke();
    // radial canals
    ctx.lineWidth = sc(1); ctx.strokeStyle = rgb(JELLY, a * 0.5);
    for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(x + k * R * 0.22, y - R * 0.5); ctx.lineTo(x + k * R * 0.26, y + R * 0.08); ctx.stroke(); }
    // frilly oral arms
    ctx.lineWidth = sc(1.4); ctx.strokeStyle = rgb(JELLY, a * 0.85);
    for (let k = -2; k <= 2; k++) {
      const bx = x + k * R * 0.3; ctx.beginPath(); ctx.moveTo(bx, y + R * 0.15);
      for (let s = 1; s <= 6; s++) { const yy = y + R * 0.15 + s * r * 0.5; const xx = bx + Math.sin(j.t * 1.6 + k + s * 0.7) * (r * 0.35 + s * 1.4); ctx.lineTo(xx, yy); }
      ctx.stroke();
    }
    // fine tentacles, varied length
    ctx.lineWidth = sc(0.9); ctx.strokeStyle = rgb(JELLY, a * 0.55);
    for (let m = -4; m <= 4; m++) {
      const tx = x + m * R * 0.18; ctx.beginPath(); ctx.moveTo(tx, y + R * 0.08);
      const len = 6 + (((m + 4) * 3) % 4);
      for (let s = 1; s < len; s++) ctx.lineTo(tx + Math.sin(j.t * 2.4 + m + s * 0.4) * r * 0.32, y + R * 0.08 + s * r * 0.55);
      ctx.stroke();
    }
  }

  // a dark anomaly: a wrong, drifting shape you only find by pinging into it
  function drawAnomaly(an) {                            // DECO APERTURE — counter-rotating faceted rings + dilating iris (pulse-only)
    const ox = an.x, oy = an.y, r = an.r, t = an.t;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let ring = 0; ring < 4; ring++) {
      const R = r * (1 - ring * 0.2), dir = ring % 2 ? 1 : -1, rot = t * 0.4 * dir, sides = 8 - ring;
      ctx.lineWidth = ring === 0 ? sc(2) : sc(1.3);
      for (let i = 1; i <= sides; i++) {
        const a0 = rot + (i - 1) / sides * Math.PI * 2, a1 = rot + i / sides * Math.PI * 2;
        const ax = ox + Math.cos(a0) * R, ay = oy + Math.sin(a0) * R * 0.92;
        const bx = ox + Math.cos(a1) * R, by = oy + Math.sin(a1) * R * 0.92;
        const lit = lightAt((ax + bx) / 2, (ay + by) / 2);
        if (lit < 0.05) continue;
        const L2 = Math.min(1, lit * 1.5);
        ctx.strokeStyle = rgb(ANOM, (1 - ring * 0.16) * L2);
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
      }
    }
    // dilating iris
    const iris = r * 0.18 + r * 0.09 * Math.sin(t * 1.4), sd = 6;
    ctx.lineWidth = sc(1.6);
    for (let i = 1; i <= sd; i++) {
      const a0 = -t * 0.6 + (i - 1) / sd * Math.PI * 2, a1 = -t * 0.6 + i / sd * Math.PI * 2;
      const ax = ox + Math.cos(a0) * iris, ay = oy + Math.sin(a0) * iris;
      const bx = ox + Math.cos(a1) * iris, by = oy + Math.sin(a1) * iris;
      const lit = lightAt((ax + bx) / 2, (ay + by) / 2);
      if (lit < 0.05) continue;
      ctx.strokeStyle = rgb(ANOM, 0.9 * Math.min(1, lit * 1.5));
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    }
    const litC = lightAt(ox, oy);
    if (litC > 0.06) {
      const gr = ctx.createRadialGradient(ox, oy, 0, ox, oy, r);
      gr.addColorStop(0, rgb(ANOM, 0.11 * litC)); gr.addColorStop(1, rgb(ANOM, 0));
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(ox, oy, r, 0, Math.PI * 2); ctx.fill();
    }
  }

  // anglerfish: the lure is a lone warm light in the dark; a pulse reveals the body around it
  function drawSquid(sq) {                              // pulse-only pursuer, edge-lit
    const lit = lightAt(sq.x, sq.y);
    if (lit < 0.04) return;
    const a = Math.min(1, lit * 1.5);
    const strike = sq.state === 'jet' ? 1 : sq.state === 'wind' ? (sq.stateT / 0.32) * 0.6 : sq.state === 'recover' ? Math.max(0, 1 - sq.stateT / 0.6) : 0;
    const breathe = 1 + 0.10 * Math.sin(sq.t * 2.4) - strike * 0.12;   // stronger jet pulse
    const undulate = Math.sin(sq.t * 1.6) * 0.14 * (1 - strike * 0.5); // whole-body sway
    const w = sq.w * breathe, mLen = sq.mLen;
    const BODY = [210, 214, 200];
    ctx.save();
    ctx.translate(sq.x, sq.y); ctx.rotate(sq.ang + undulate);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // mantle (tail points back, head/arms toward prey) — sides flex as it breathes
    const flex = Math.sin(sq.t * 2.4) * w * 0.12;
    const M = [[-mLen, 0], [-mLen * 0.5, -w - flex], [-mLen * 0.08, -w * 0.9], [w * 0.35, -w * 0.5], [w * 0.35, w * 0.5], [-mLen * 0.08, w * 0.9], [-mLen * 0.5, w + flex]];
    ctx.beginPath(); ctx.moveTo(M[0][0], M[0][1]);
    for (let i = 1; i < M.length; i++) { const p0 = M[i], p1 = M[(i + 1) % M.length], xc = (p0[0] + p1[0]) / 2, yc = (p0[1] + p1[1]) / 2; ctx.quadraticCurveTo(p0[0], p0[1], xc, yc); }
    ctx.closePath();
    ctx.fillStyle = rgb(BODY, a * 0.08); ctx.fill();
    ctx.strokeStyle = rgb(BODY, a); ctx.lineWidth = sc(2); ctx.stroke();
    // fins near the tail — travelling ripple along the edge
    ctx.lineWidth = sc(1.5);
    for (const sgn of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(-mLen * 0.3, sgn * w * 0.7);
      for (let s = 0; s <= 6; s++) { const u = s / 6; ctx.lineTo(-mLen * (0.3 + u * 0.5), sgn * (w * 0.7 + Math.sin(u * 3.4 + sq.t * 5) * w * 0.5 * (0.4 + u))); }
      ctx.stroke();
    }
    // photophores
    for (let i = 0; i < 5; i++) { const px = -mLen * (0.12 + i * 0.16); ctx.fillStyle = rgb(MARI, a * (0.5 + 0.35 * Math.sin(sq.t * 3 + i))); ctx.beginPath(); ctx.arc(px, 0, sc(1.7), 0, Math.PI * 2); ctx.fill(); }
    // eye
    ctx.fillStyle = rgb(BODY, a); ctx.beginPath(); ctx.arc(w * 0.12, -w * 0.35, sc(3), 0, Math.PI * 2); ctx.fill();
    // 8 arms fanning toward prey — curling with more life
    ctx.strokeStyle = rgb(BODY, a * 0.9); ctx.lineWidth = sc(1.6);
    for (let k = -3; k <= 3; k++) {
      const spread = k * 0.16, len = mLen * 0.46 * (1 - strike * 0.3);
      ctx.beginPath(); ctx.moveTo(w * 0.3, 0);
      for (let s = 1; s <= 6; s++) { const u = s / 6, ang = spread + Math.sin(sq.t * 2.6 + k + u * 4) * 0.3 * (1 - strike * 0.5) + Math.sin(sq.t * 1.3 + u * 2) * 0.12; ctx.lineTo(w * 0.3 + Math.cos(ang) * len * u, Math.sin(ang) * len * u + k * sc(1.8)); }
      ctx.stroke();
    }
    // two long hunting tentacles — writhe, then extend on the strike
    ctx.lineWidth = sc(2);
    for (const sgn of [-1, 1]) {
      const reach = mLen * 0.55 + strike * sc(150);
      const wob = Math.sin(sq.t * 3.2 + sgn) * sc(6) * (1 - strike * 0.7);
      ctx.beginPath(); ctx.moveTo(w * 0.32, sgn * w * 0.2);
      ctx.bezierCurveTo(reach * 0.4, sgn * (w * 0.6) + wob, reach * 0.75, sgn * (w * 0.3) - wob, reach, sgn * sc(3) + Math.sin(sq.t * 4 + sgn) * sc(3) * (1 - strike));
      ctx.stroke();
      ctx.fillStyle = rgb(BODY, a); ctx.beginPath(); ctx.arc(reach, sgn * sc(3) + Math.sin(sq.t * 4 + sgn) * sc(3) * (1 - strike), sc(3.2), 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  function drawAngler(an) {
    const ox = an.x, oy = an.y, d = an.dir, S2 = an.shape;
    const wx = x => ox + x * d, wy = y => oy + y;
    const litHead = lightAt(ox + d * an.rx * 0.5, oy);
    // solid dark mass when a pulse reaches it — reads as a body, not a wireframe
    if (litHead > 0.04) {
      ctx.fillStyle = rgb([5, 9, 14], 0.72 * litHead);
      ctx.beginPath();
      const O = S2.outline;
      for (let i = 0; i < O.length; i++) { const X = wx(O[i][0]), Y = wy(O[i][1]); if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y); }
      ctx.closePath(); ctx.fill();
    }
    const seg = (a, b, alpha, w, col) => {
      const ax = wx(a[0]), ay = wy(a[1]), bx = wx(b[0]), by = wy(b[1]);
      const lit = lightAt((ax + bx) / 2, (ay + by) / 2);
      if (lit < 0.05) return;
      ctx.strokeStyle = rgb(col, alpha * Math.min(1, lit * 1.5)); ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    };
    const O = S2.outline;
    for (let i = 1; i < O.length; i++) seg(O[i - 1], O[i], 0.9, sc(1.9), ANGLER);
    for (const f of S2.tail) seg(f[0], f[1], 0.6, sc(1.4), ANGLER);
    for (const f of S2.finP) seg(f[0], f[1], 0.5, sc(1.2), ANGLER);
    for (const f of S2.finD) seg(f[0], f[1], 0.5, sc(1.2), ANGLER);
    if (litHead > 0.05) {
      for (const tt of S2.teeth) seg(tt[0], tt[1], 0.85, sc(1.2), [212, 226, 224]);
      seg(S2.gill[0], S2.gill[1], 0.6, sc(1.2), ANGLER);
      const ex = wx(S2.eye[0]), ey = wy(S2.eye[1]);
      ctx.strokeStyle = rgb(ANGLER, 0.7 * litHead); ctx.lineWidth = sc(1.2);
      ctx.beginPath(); ctx.arc(ex, ey, S2.eye[2], 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = rgb(ANGLER_LURE, 0.85 * litHead);
      ctx.beginPath(); ctx.arc(ex, ey, S2.eye[2] * 0.5, 0, Math.PI * 2); ctx.fill();
    }
    // illicium rod arcing over the head to the esca (lure): faint always, bright on a pulse
    const lx = ox + d * (an.rx * 0.95 + an.lureLen), ly = oy - an.ry * 0.78 + Math.sin(an.t * 1.6) * an.ry * 0.3;
    const litL = lightAt(lx, ly);
    ctx.strokeStyle = rgb(ANGLER, 0.12 + litL * 0.5); ctx.lineWidth = sc(1.3);
    ctx.beginPath(); ctx.moveTo(ox + d * an.rx * 0.28, oy - an.ry * 0.9);
    ctx.quadraticCurveTo(ox + d * an.rx * 0.7, oy - an.ry * 1.5, lx, ly); ctx.stroke();
    const lr = sc(9) + sc(3) * Math.sin(an.t * 3);
    const gl = ctx.createRadialGradient(lx, ly, 0, lx, ly, lr);
    gl.addColorStop(0, rgb(ANGLER_LURE, (OPT.hivis ? 0.66 : 0.5) + litL * 0.4));
    gl.addColorStop(1, rgb(ANGLER_LURE, 0));
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(lx, ly, lr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgb([255, 240, 208], 0.6 + litL * 0.4);
    ctx.beginPath(); ctx.arc(lx, ly, sc(1.9), 0, Math.PI * 2); ctx.fill();
  }

  // eel: a dark ribbon of a body with a dorsal fin ridge, revealed sliver by sliver
  function drawEel(e) {
    const pts = e.pts;
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const lit = lightAt(mx, my);
      if (lit < 0.05) continue;
      const L2 = Math.min(1, lit * 1.5);
      const u = i / e.n, head = u < 0.08 ? u / 0.08 : 1;
      const wd = e.w * (1 - 0.85 * u) * head;
      let tx = b.x - a.x, ty = b.y - a.y; const L = Math.hypot(tx, ty) || 1; tx /= L; ty /= L;
      const nx = ty, ny = -tx;
      ctx.lineWidth = sc(1.8); ctx.strokeStyle = rgb(EEL, L2);
      ctx.beginPath(); ctx.moveTo(a.x + nx * wd, a.y + ny * wd); ctx.lineTo(b.x + nx * wd, b.y + ny * wd); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(a.x - nx * wd, a.y - ny * wd); ctx.lineTo(b.x - nx * wd, b.y - ny * wd); ctx.stroke();
      ctx.lineWidth = sc(0.9); ctx.strokeStyle = rgb(EEL, 0.4 * L2);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      if (i % 2 === 0) {
        const up = ny < 0 ? 1 : -1;
        const bx0 = a.x + nx * wd * up, by0 = a.y + ny * wd * up;
        const finH = e.w * (0.9 - 0.6 * u) * (0.5 + 0.5 * Math.sin(e.t * 5 + i));
        ctx.lineWidth = sc(1); ctx.strokeStyle = rgb(EEL, 0.5 * L2);
        ctx.beginPath(); ctx.moveTo(bx0, by0); ctx.lineTo(bx0 + nx * finH * up + tx * sc(2), by0 + ny * finH * up + ty * sc(2)); ctx.stroke();
      }
    }
    // head: a wedge snout with a jaw line and eye, aimed along the heading
    const h = pts[0], litH = lightAt(h.x, h.y);
    if (litH > 0.05) {
      const L2 = Math.min(1, litH * 1.5);
      const tx = Math.cos(e.heading), ty = Math.sin(e.heading), nx = ty, ny = -tx, w = e.w;
      const sx = h.x + tx * w * 2.0, sy = h.y + ty * w * 2.0;
      ctx.fillStyle = rgb(EEL, 0.55 * litH);
      ctx.beginPath();
      ctx.moveTo(h.x + nx * w, h.y + ny * w);
      ctx.quadraticCurveTo(sx + nx * w * 0.25, sy + ny * w * 0.25, sx, sy);
      ctx.quadraticCurveTo(sx - nx * w * 0.25, sy - ny * w * 0.25, h.x - nx * w, h.y - ny * w);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = rgb(EEL, 0.75 * L2); ctx.lineWidth = sc(1.1);
      ctx.beginPath(); ctx.moveTo(h.x + tx * w * 0.2, h.y + ty * w * 0.2); ctx.lineTo(sx, sy); ctx.stroke();
      ctx.fillStyle = rgb([238, 240, 226], 0.9 * L2);
      ctx.beginPath(); ctx.arc(h.x + tx * w * 0.5 + nx * w * 0.45, h.y + ty * w * 0.5 + ny * w * 0.45, sc(1.6), 0, Math.PI * 2); ctx.fill();
    }
  }

  // siphonophore: a swaying vertical string of faintly glowing stinging beads
  function drawSipho(s) {                              // COLONY — fine curling stem, clustered bells up top, trailing tendrils
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const pts = [];
    for (let k = 0; k < s.n; k++) pts.push(siphoBead(s, k));
    // the stem (whole chain — this is the lethal length)
    for (let k = 1; k < pts.length; k++) {
      const a = pts[k - 1], b = pts[k];
      const lit = lightAt((a[0] + b[0]) / 2, (a[1] + b[1]) / 2), L2 = Math.min(1, lit * 1.5);
      ctx.strokeStyle = rgb(SIPHO, ((OPT.hivis ? 0.12 : 0.07) + L2 * 0.55) * 0.7); ctx.lineWidth = sc(1.1);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    }
    // clustered translucent bells near the top
    const nb = Math.min(5, s.n);
    for (let k = 0; k < nb; k++) {
      const b = pts[k], lit = lightAt(b[0], b[1]), L2 = Math.min(1, lit * 1.5);
      const a = (OPT.hivis ? 0.18 : 0.11) + L2 * 0.8, br = s.br * (1.5 - k * 0.16);
      const gr = ctx.createRadialGradient(b[0], b[1], 0, b[0], b[1], br * 2.6);
      gr.addColorStop(0, rgb(SIPHO, a * 0.5)); gr.addColorStop(1, rgb(SIPHO, 0));
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(b[0], b[1], br * 2.6, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = rgb(SIPHO, a); ctx.lineWidth = sc(1.3);
      ctx.beginPath();
      for (let i = 0; i <= 12; i++) { const ang = Math.PI + Math.PI * i / 12; const px = b[0] + Math.cos(ang) * br, py = b[1] + Math.sin(ang) * br * 0.8; if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py); }
      ctx.stroke();
      ctx.fillStyle = rgb([248, 238, 212], 0.35 + L2 * 0.5);
      ctx.beginPath(); ctx.arc(b[0], b[1], s.br * 0.4, 0, Math.PI * 2); ctx.fill();
    }
    // trailing fine tendrils from the lower stem
    ctx.lineWidth = sc(0.9);
    for (let k = nb; k < pts.length; k += 2) {
      const b = pts[k], lit = lightAt(b[0], b[1]), L2 = Math.min(1, lit * 1.5);
      ctx.strokeStyle = rgb(SIPHO, (OPT.hivis ? 0.11 : 0.06) + L2 * 0.5);
      const len = 4 + ((k * 5) % 5);

  // current: faint streaks flowing the way the water pushes; a band you sink through
  function drawCurrent(cur) {
    const flow = cur.t * cur.speed * 0.02;
    for (let i = 0; i < cur.streaks.length; i++) {
      const st = cur.streaks[i];
      let f = (st.fx + cur.dir * flow * st.sp) % 1; if (f < 0) f += 1;
      const wx = me.x + (f * 2 - 1) * W * 0.72;
      const wy = cur.y + st.fy * cur.h * 0.9;
      const edge = 1 - Math.abs(st.fy);           // fade toward band edges
      const lit = lightAt(wx, wy);
      const a = (0.05 + lit * 0.4) * edge;
      if (a < 0.02) continue;
      const grd = ctx.createLinearGradient(wx, wy, wx + cur.dir * st.len, wy);
      grd.addColorStop(0, rgb(CURRENT, 0)); grd.addColorStop(1, rgb(CURRENT, a));
      ctx.strokeStyle = grd; ctx.lineWidth = sc(1.4);
      ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx + cur.dir * st.len, wy); ctx.stroke();
    }
  }

  // The echo as resonance: a white mote that is always faintly ringing outward,
  // trailing itself as it falls, flaring softly each time it calls into the dark.
  function drawCreatureResonance(t) {
    const breath = 0.82 + 0.18 * Math.sin(t * 1.6);     // slow, calm
    const flare = 1 + coreFlare * 0.7;
    const glow = glowNow();
    const cr0 = sc(T.cr);
    const WHITE = [246, 243, 231];

    // falling wake: a soft residue of where the sound has been
    echoWake.push({ x: me.x, y: me.y });
    if (echoWake.length > 16) echoWake.shift();
    ctx.lineCap = 'round';
    for (let i = 1; i < echoWake.length; i++) {
      const f = i / echoWake.length;                    // 0 oldest .. 1 newest
      ctx.strokeStyle = rgb(CYAN, 0.16 * f * f);
      ctx.lineWidth = cr0 * (0.25 + 0.75 * f);
      ctx.beginPath(); ctx.moveTo(echoWake[i - 1].x, echoWake[i - 1].y); ctx.lineTo(echoWake[i].x, echoWake[i].y); ctx.stroke();
    }

    // continuous resonance rings -> it always reads as an echo, even at rest
    const RN = 3, ringMax = glow * 1.1;
    for (let i = 0; i < RN; i++) {
      const ph = ((t * 0.5) + i / RN) % 1;
      const a = (1 - ph) * 0.16 * (0.7 + 0.3 * breath);
      if (a < 0.012) continue;
      ctx.strokeStyle = rgb(CYAN, a);
      ctx.lineWidth = sc(1.4);
      ctx.beginPath(); ctx.arc(me.x, me.y, ph * ringMax, 0, Math.PI * 2); ctx.stroke();
    }

    // outer self-glow (cyan halo)
    const gr = ctx.createRadialGradient(me.x, me.y, 0, me.x, me.y, glow * flare);
    gr.addColorStop(0, rgb(CYAN, 0.30 * breath * flare));
    gr.addColorStop(1, rgb(CYAN, 0));
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(me.x, me.y, glow * flare, 0, Math.PI * 2); ctx.fill();

    // danger tint
    if (dangerGlow > 0.02) {
      const dg = ctx.createRadialGradient(me.x, me.y, 0, me.x, me.y, glow);
      dg.addColorStop(0, rgb(DANGER, 0.32 * dangerGlow));
      dg.addColorStop(1, rgb(DANGER, 0));
      ctx.fillStyle = dg;
      ctx.beginPath(); ctx.arc(me.x, me.y, glow, 0, Math.PI * 2); ctx.fill();
    }

    // inner bloom
    const bl = ctx.createRadialGradient(me.x, me.y, 0, me.x, me.y, cr0 * 2.3 * flare);
    bl.addColorStop(0, rgb(CYAN_HOT, 0.55 * flare));
    bl.addColorStop(1, rgb(CYAN_HOT, 0));
    ctx.fillStyle = bl;
    ctx.beginPath(); ctx.arc(me.x, me.y, cr0 * 2.3 * flare, 0, Math.PI * 2); ctx.fill();

    // luminous core + white center
    ctx.fillStyle = rgb(CYAN_HOT, 0.95);
    ctx.beginPath(); ctx.arc(me.x, me.y, (cr0 - sc(1)) * flare, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgb(WHITE, 1);
    ctx.beginPath(); ctx.arc(me.x, me.y, Math.max(sc(2), (cr0 - sc(5))) * breath * flare, 0, Math.PI * 2); ctx.fill();
  }

      SND.draw(ctx, 'YOU SANK', W / 2, H * 0.42, sc(11), rgb(JELLY, 0.8 * fade), 'center', 0.32);
      SND.draw(ctx, scoreVal() + ' m', W / 2, H * 0.52, sc(56), rgb(CYAN_HOT, 0.94 * fade), 'center', 0.08);
      if (now() - deadAt > 1400) {
        const p = 0.5 + 0.5 * Math.sin(t * 2);
        SND.draw(ctx, 'TAP TO RETURN', W / 2, H * 0.66, sc(12), rgb(MARI, p), 'center', 0.2);
      }
      return;
    }
    const fade = Math.min(1, (now() - deadAt) / 1100);   // settle in slowly
    ctx.fillStyle = 'rgba(9,14,12,' + (0.55 * fade) + ')'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    SND.draw(ctx, 'SILENCE', W / 2, H * 0.36, sc(13), rgb(DANGER, 0.85 * fade), 'center', 0.32);
    const s = scoreVal();
    SND.draw(ctx, s + ' m', W / 2, H * 0.48, sc(62), rgb(CYAN_HOT, 0.96 * fade), 'center', 0.08);
    const isBest = s >= best && s > 0;
    SND.draw(ctx, isBest ? 'NEW DEEPEST!' : 'DEEPEST ' + best + ' m', W / 2, H * 0.48 + sc(40), sc(12), isBest ? rgb(MARI, 0.95 * fade) : rgb(DIMS, 0.8 * fade), 'center', 0.2);
    if (now() - deadAt > 1000) {
      const p = 0.55 + 0.45 * Math.sin(t * 2.5);
      SND.draw(ctx, 'TAP TO DESCEND AGAIN', W / 2, H * 0.66, sc(13), rgb(MARI, p), 'center', 0.18);
      const mw = SND.w('MAIN MENU', sc(10), 0.24);
      SND.draw(ctx, 'MAIN MENU', W / 2, H * 0.75, sc(10), rgb(DIMS, 0.8 * fade), 'center', 0.24);
      DEAD_MENU = { x: W / 2 - mw / 2 - sc(16), y: H * 0.75 - sc(20), w: mw + sc(32), h: sc(32) };
    } else DEAD_MENU = null;
  }

  // ---- Loop --------------------------------------------------------------
  function frame() { update(); render(); requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (state === 'PLAY') { pausedFrom = 'PLAY'; state = 'PAUSE'; AUD.suspend(); } }
    else { last = now(); acc = 0; }
  });
})();
</script>
</body>
</html>
