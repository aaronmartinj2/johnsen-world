<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Decision Wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0f0d1a;
    --bg-2: #1a1530;
    --ink: #f5ecd7;
    --ink-dim: #a89d82;
    --gold: #e8b84a;
    --gold-deep: #b8892a;
    --crimson: #c9303b;
    --teal: #2a9d8f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse at top, #2a1f4a 0%, var(--bg) 60%),
      var(--bg);
    color: var(--ink);
    font-family: 'Fraunces', serif;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(232, 184, 74, 0.08) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(201, 48, 59, 0.08) 0, transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  header {
    text-align: center;
    margin-bottom: 2rem;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.5rem;
  }

  h1 {
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    font-weight: 900;
    font-style: italic;
    letter-spacing: -0.02em;
    line-height: 0.95;
    background: linear-gradient(180deg, var(--ink) 0%, var(--gold) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .tagline {
    font-size: 0.95rem;
    color: var(--ink-dim);
    margin-top: 0.5rem;
    font-style: italic;
  }

  /* ---------- Set bar ---------- */
  .set-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
    justify-content: center;
    margin-bottom: 2rem;
    padding: 0.85rem 1.25rem;
    background: linear-gradient(160deg, rgba(245, 236, 215, 0.04), rgba(245, 236, 215, 0.01));
    border: 1px solid rgba(245, 236, 215, 0.1);
    border-radius: 10px;
    backdrop-filter: blur(10px);
  }

  .set-bar-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .set-select {
    font-family: 'Fraunces', serif;
    font-size: 0.95rem;
    font-style: italic;
    background: rgba(0, 0, 0, 0.3);
    color: var(--ink);
    border: 1px solid rgba(245, 236, 215, 0.15);
    border-radius: 6px;
    padding: 0.45rem 0.75rem;
    min-width: 180px;
    cursor: pointer;
  }

  .set-select:focus {
    outline: none;
    border-color: var(--gold);
  }

  .set-select option {
    background: var(--bg-2);
    color: var(--ink);
  }

  .dirty-dot {
    color: var(--crimson);
    font-weight: 700;
    display: none;
    font-size: 1.2rem;
    line-height: 1;
  }

  .dirty .dirty-dot {
    display: inline;
  }

  .set-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0.55rem 0.85rem;
    border: 1px solid rgba(245, 236, 215, 0.2);
    background: transparent;
    color: var(--ink);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .set-btn:hover:not(:disabled) {
    border-color: var(--gold);
    color: var(--gold);
  }

  .set-btn.btn-danger:hover:not(:disabled) {
    border-color: var(--crimson);
    color: var(--crimson);
  }

  .set-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 2.5rem;
    align-items: start;
  }

  @media (min-width: 900px) {
    .layout {
      grid-template-columns: 1.2fr 1fr;
    }
  }

  /* ---------- Wheel ---------- */
  .wheel-stage {
    position: relative;
    aspect-ratio: 1 / 1;
    max-width: 560px;
    margin: 0 auto;
    width: 100%;
  }

  .wheel-stage::before {
    content: '';
    position: absolute;
    inset: -4%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232, 184, 74, 0.15), transparent 70%);
    filter: blur(20px);
  }

  .wheel-wrap {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .wheel-svg {
    width: 100%;
    height: 100%;
    transition: transform 11s cubic-bezier(0.16, 0.77, 0.18, 1);
    filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.5));
  }

  .pointer {
    position: absolute;
    top: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 46px;
    height: 60px;
    z-index: 3;
    filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.6));
  }

  .hub {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 16%;
    height: 16%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fef3d0 0%, var(--gold) 40%, var(--gold-deep) 100%);
    box-shadow:
      inset 0 2px 4px rgba(255, 255, 255, 0.4),
      inset 0 -4px 8px rgba(0, 0, 0, 0.3),
      0 4px 12px rgba(0, 0, 0, 0.5);
    z-index: 2;
    display: grid;
    place-items: center;
  }

  .hub::after {
    content: '';
    width: 30%;
    height: 30%;
    border-radius: 50%;
    background: radial-gradient(circle, var(--bg-2), var(--bg));
    box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.8);
  }

  .result {
    position: absolute;
    left: 50%;
    bottom: -4rem;
    transform: translateX(-50%);
    text-align: center;
    min-height: 3rem;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .result.show { opacity: 1; }

  .result-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .result-value {
    font-size: 1.75rem;
    font-weight: 700;
    font-style: italic;
    color: var(--ink);
    margin-top: 0.25rem;
  }

  /* ---------- Panels ---------- */
  .panel {
    background: linear-gradient(160deg, rgba(245, 236, 215, 0.04), rgba(245, 236, 215, 0.01));
    border: 1px solid rgba(245, 236, 215, 0.1);
    border-radius: 12px;
    padding: 1.5rem;
    backdrop-filter: blur(10px);
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 1rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid rgba(245, 236, 215, 0.1);
  }

  .panel-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .panel-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--ink-dim);
  }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex;
    gap: 0.25rem;
    margin-bottom: 1rem;
    background: rgba(0, 0, 0, 0.25);
    padding: 0.25rem;
    border-radius: 8px;
  }

  .tab {
    flex: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    background: transparent;
    border: none;
    color: var(--ink-dim);
    padding: 0.55rem;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .tab.active {
    background: rgba(232, 184, 74, 0.15);
    color: var(--gold);
  }

  .tab:not(.active):hover {
    color: var(--ink);
  }

  .tab-panel {
    display: none;
  }

  .tab-panel.active {
    display: block;
  }

  /* ---------- Labels list ---------- */
  .labels-list {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    max-height: 320px;
    overflow-y: auto;
    padding-right: 0.5rem;
  }

  .labels-list::-webkit-scrollbar { width: 6px; }
  .labels-list::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 3px; }
  .labels-list::-webkit-scrollbar-thumb { background: var(--gold-deep); border-radius: 3px; }

  .label-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .swatch {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15);
  }

  .label-input {
    flex: 1;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(245, 236, 215, 0.12);
    color: var(--ink);
    padding: 0.55rem 0.75rem;
    font-family: 'Fraunces', serif;
    font-size: 0.95rem;
    border-radius: 6px;
    transition: border-color 0.2s, background 0.2s;
    min-width: 0;
  }

  .label-input:focus {
    outline: none;
    border-color: var(--gold);
    background: rgba(0, 0, 0, 0.4);
  }

  .label-input::placeholder {
    color: rgba(168, 157, 130, 0.5);
    font-style: italic;
  }

  .remove-btn {
    background: transparent;
    border: 1px solid rgba(245, 236, 215, 0.15);
    color: var(--ink-dim);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    display: grid;
    place-items: center;
    font-size: 1.1rem;
    line-height: 1;
    flex-shrink: 0;
    transition: all 0.2s;
  }

  .remove-btn:hover {
    background: var(--crimson);
    border-color: var(--crimson);
    color: var(--ink);
  }

  .btn-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid rgba(245, 236, 215, 0.1);
  }

  .btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0.7rem 1rem;
    border: 1px solid rgba(245, 236, 215, 0.2);
    background: transparent;
    color: var(--ink);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    flex: 1;
    min-width: 90px;
  }

  .btn:hover:not(:disabled) {
    border-color: var(--gold);
    color: var(--gold);
  }

  .btn.btn-gold {
    background: linear-gradient(180deg, #fef3d0 0%, var(--gold) 45%, var(--gold-deep) 100%);
    color: var(--bg);
    border-color: var(--gold);
    font-weight: 700;
  }

  .btn.btn-gold:hover:not(:disabled) {
    color: var(--bg);
    filter: brightness(1.1);
  }

  .btn.btn-danger:hover:not(:disabled) {
    border-color: var(--crimson);
    color: var(--crimson);
  }

  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* ---------- Wins list ---------- */
  .wins-list {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    max-height: 320px;
    overflow-y: auto;
    padding-right: 0.5rem;
  }

  .wins-list::-webkit-scrollbar { width: 6px; }
  .wins-list::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 3px; }
  .wins-list::-webkit-scrollbar-thumb { background: var(--gold-deep); border-radius: 3px; }

  .win-row {
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    align-items: center;
    gap: 0.65rem;
    padding: 0.5rem 0.6rem;
    background: rgba(0, 0, 0, 0.15);
    border-radius: 6px;
    font-size: 0.95rem;
  }

  .win-row.leader {
    background: rgba(232, 184, 74, 0.1);
    border: 1px solid rgba(232, 184, 74, 0.25);
  }

  .win-name {
    font-style: italic;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .win-bar {
    width: 70px;
    height: 6px;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 3px;
    overflow: hidden;
  }

  .win-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-deep), var(--gold));
    transition: width 0.5s ease;
  }

  .win-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--gold);
    min-width: 2.2rem;
    text-align: right;
  }

  .empty-state {
    text-align: center;
    padding: 2rem 1rem;
    color: var(--ink-dim);
    font-style: italic;
    font-size: 0.9rem;
  }

  /* ---------- Spin button ---------- */
  .spin-area {
    margin-top: 1.25rem;
    text-align: center;
  }

  .spin-btn {
    position: relative;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 900;
    font-size: 1.5rem;
    letter-spacing: 0.05em;
    padding: 1rem 3rem;
    color: var(--bg);
    background: linear-gradient(180deg, #fef3d0 0%, var(--gold) 45%, var(--gold-deep) 100%);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow:
      inset 0 2px 4px rgba(255, 255, 255, 0.6),
      inset 0 -4px 8px rgba(0, 0, 0, 0.2),
      0 8px 24px rgba(232, 184, 74, 0.4),
      0 2px 4px rgba(0, 0, 0, 0.3);
    transition: transform 0.15s, box-shadow 0.2s;
    width: 100%;
    max-width: 320px;
  }

  .spin-btn:hover:not(:disabled) {
    transform: translateY(-2px);
  }

  .spin-btn:active:not(:disabled) {
    transform: translateY(1px);
  }

  .spin-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 13, 26, 0.8);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 1rem;
  }

  .modal-backdrop.show { display: flex; }

  .modal {
    background: var(--bg-2);
    border: 1px solid rgba(232, 184, 74, 0.3);
    border-radius: 12px;
    padding: 2rem;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
  }

  .modal-title {
    font-size: 1.5rem;
    font-weight: 700;
    font-style: italic;
    margin-bottom: 0.5rem;
  }

  .modal-body {
    color: var(--ink-dim);
    font-size: 0.95rem;
    margin-bottom: 1.25rem;
    line-height: 1.5;
  }

  .modal-input {
    width: 100%;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(245, 236, 215, 0.15);
    color: var(--ink);
    padding: 0.7rem 0.9rem;
    font-family: 'Fraunces', serif;
    font-size: 1rem;
    border-radius: 6px;
    margin-bottom: 1.25rem;
  }

  .modal-input:focus {
    outline: none;
    border-color: var(--gold);
  }

  .modal-actions {
    display: flex;
    gap: 0.5rem;
    justify-content: flex-end;
  }

  .modal-actions .btn {
    flex: 0 0 auto;
    min-width: 100px;
  }

  @keyframes resultPop {
    0% { transform: translateX(-50%) scale(0.8); opacity: 0; }
    60% { transform: translateX(-50%) scale(1.05); }
    100% { transform: translateX(-50%) scale(1); opacity: 1; }
  }

  .result.pop {
    animation: resultPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="eyebrow">Spin · Land · Decide</div>
    <h1>The Decision Wheel</h1>
    <p class="tagline">Save sets. Track wins. Let the wheel decide.</p>
  </header>

  <div id="set-bar" class="set-bar">
    <span class="set-bar-label">Set</span>
    <select id="set-select" class="set-select">
      <option value="__working__">Working Set (unsaved)</option>
    </select>
    <span class="dirty-dot" title="Unsaved changes">●</span>
    <button id="save-btn" class="set-btn">Save</button>
    <button id="save-as-btn" class="set-btn">Save As</button>
    <button id="rename-btn" class="set-btn" disabled>Rename</button>
    <button id="delete-set-btn" class="set-btn btn-danger" disabled>Delete</button>
  </div>

  <div class="layout">
    <section class="wheel-stage">
      <div class="wheel-wrap">
        <svg class="pointer" viewBox="0 0 46 60" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="pointerGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fef3d0" />
              <stop offset="50%" stop-color="#e8b84a" />
              <stop offset="100%" stop-color="#b8892a" />
            </linearGradient>
          </defs>
          <path d="M23 58 L4 20 Q4 4 23 4 Q42 4 42 20 Z" fill="url(#pointerGrad)" stroke="#0f0d1a" stroke-width="2" stroke-linejoin="round" />
          <circle cx="23" cy="18" r="4" fill="#0f0d1a" />
        </svg>
        <svg id="wheel" class="wheel-svg" viewBox="-110 -110 220 220" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="hub"></div>
      </div>
      <div id="result" class="result">
        <div class="result-label">The Wheel Speaks</div>
        <div id="result-value" class="result-value">—</div>
      </div>
    </section>

    <aside>
      <div class="panel">
        <div class="tabs">
          <button class="tab active" data-tab="labels">Labels</button>
          <button class="tab" data-tab="wins">Wins</button>
        </div>

        <div id="tab-labels" class="tab-panel active">
          <div class="panel-header">
            <span class="panel-title">Labels</span>
            <span class="panel-sub"><span id="count">0</span> / 20</span>
          </div>
          <div id="labels-list" class="labels-list"></div>
          <div class="btn-row">
            <button id="add-btn" class="btn">+ Add</button>
            <button id="clear-btn" class="btn">Clear</button>
            <button id="reset-btn" class="btn">Defaults</button>
          </div>
        </div>

        <div id="tab-wins" class="tab-panel">
          <div class="panel-header">
            <span class="panel-title">Win Tally</span>
            <span class="panel-sub"><span id="total-wins">0</span> spins</span>
          </div>
          <div id="wins-list" class="wins-list"></div>
          <div class="btn-row">
            <button id="clear-wins-btn" class="btn btn-danger">Clear Win Record</button>
          </div>
        </div>
      </div>

      <div class="spin-area">
        <button id="spin-btn" class="spin-btn">Spin the Wheel</button>
      </div>
    </aside>
  </div>
</div>

<div id="modal" class="modal-backdrop">
  <div class="modal">
    <div id="modal-title" class="modal-title">Save Set</div>
    <div id="modal-body" class="modal-body">Name this set of labels.</div>
    <input id="modal-input" class="modal-input" type="text" maxlength="40" />
    <div class="modal-actions">
      <button id="modal-cancel" class="btn">Cancel</button>
      <button id="modal-confirm" class="btn btn-gold">Confirm</button>
    </div>
  </div>
</div>

<script>
  const MAX_LABELS = 20;
  const STORAGE_KEY = 'decision-wheel-v1';
  const DEFAULTS = [
    'Prize', 'Bankrupt', 'Free Spin', 'Lose a Turn',
    '$500', '$1000', '$2500', 'Mystery'
  ];

  const PALETTE = [
    '#c9303b', '#e8b84a', '#2a9d8f', '#4a5ea8',
    '#d66a3e', '#8b5a9f', '#5b8c5a', '#b03a5c',
    '#3f7cac', '#d4a845', '#6a4c93', '#e07856',
    '#2f6b8e', '#a84a3e', '#7ba05b', '#c96b87',
    '#5c7fb8', '#d49545', '#4e8f7e', '#9c5a6c'
  ];

  // State shape:
  // {
  //   sets: { [name]: { labels: string[], wins: { [label]: number } } },
  //   activeSet: string | null,   // null means the working (unsaved) set is active
  //   working: { labels, wins }
  // }
  let state = loadState();
  let currentRotation = 0;
  let spinning = false;

  const wheelEl = document.getElementById('wheel');
  const listEl = document.getElementById('labels-list');
  const countEl = document.getElementById('count');
  const spinBtn = document.getElementById('spin-btn');
  const addBtn = document.getElementById('add-btn');
  const clearBtn = document.getElementById('clear-btn');
  const resetBtn = document.getElementById('reset-btn');
  const resultEl = document.getElementById('result');
  const resultValueEl = document.getElementById('result-value');
  const setSelect = document.getElementById('set-select');
  const setBar = document.getElementById('set-bar');
  const saveBtn = document.getElementById('save-btn');
  const saveAsBtn = document.getElementById('save-as-btn');
  const renameBtn = document.getElementById('rename-btn');
  const deleteSetBtn = document.getElementById('delete-set-btn');
  const winsListEl = document.getElementById('wins-list');
  const totalWinsEl = document.getElementById('total-wins');
  const clearWinsBtn = document.getElementById('clear-wins-btn');
  const tabs = document.querySelectorAll('.tab');
  const tabPanels = document.querySelectorAll('.tab-panel');

  const modal = document.getElementById('modal');
  const modalTitle = document.getElementById('modal-title');
  const modalBody = document.getElementById('modal-body');
  const modalInput = document.getElementById('modal-input');
  const modalCancel = document.getElementById('modal-cancel');
  const modalConfirm = document.getElementById('modal-confirm');

  // ---------- Persistence ----------
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object') {
          return {
            sets: parsed.sets || {},
            activeSet: parsed.activeSet || null,
            working: parsed.working || { labels: [...DEFAULTS], wins: {} }
          };
        }
      }
    } catch (e) {
      console.warn('Failed to load state', e);
    }
    return {
      sets: {},
      activeSet: null,
      working: { labels: [...DEFAULTS], wins: {} }
    };
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.warn('Failed to save state', e);
    }
  }

  // ---------- Active scope ----------
  function getActive() {
    if (state.activeSet && state.sets[state.activeSet]) {
      return state.sets[state.activeSet];
    }
    return state.working;
  }

  function getLabels() { return getActive().labels; }
  function getWins() { return getActive().wins; }

  // ---------- Wheel ----------
  function truncate(text, maxLen) {
    if (!text) return '';
    if (text.length <= maxLen) return text;
    return text.slice(0, maxLen - 1) + '…';
  }

  function renderWheel() {
    const labels = getLabels();
    wheelEl.innerHTML = '';
    const n = labels.length;
    const svgNS = 'http://www.w3.org/2000/svg';

    if (n === 0) {
      const circle = document.createElementNS(svgNS, 'circle');
      circle.setAttribute('cx', 0);
      circle.setAttribute('cy', 0);
      circle.setAttribute('r', 100);
      circle.setAttribute('fill', '#1a1530');
      circle.setAttribute('stroke', '#b8892a');
      circle.setAttribute('stroke-width', '2');
      wheelEl.appendChild(circle);

      const text = document.createElementNS(svgNS, 'text');
      text.setAttribute('x', 0);
      text.setAttribute('y', 0);
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('dominant-baseline', 'middle');
      text.setAttribute('fill', '#a89d82');
      text.setAttribute('font-family', 'Fraunces, serif');
      text.setAttribute('font-style', 'italic');
      text.setAttribute('font-size', '10');
      text.textContent = 'Add some labels';
      wheelEl.appendChild(text);
      return;
    }

    const sliceAngle = 360 / n;
    const radius = 100;

    const ring = document.createElementNS(svgNS, 'circle');
    ring.setAttribute('cx', 0);
    ring.setAttribute('cy', 0);
    ring.setAttribute('r', 104);
    ring.setAttribute('fill', 'none');
    ring.setAttribute('stroke', '#b8892a');
    ring.setAttribute('stroke-width', '6');
    wheelEl.appendChild(ring);

    for (let i = 0; i < n; i++) {
      const startAngle = -90 - sliceAngle / 2 + i * sliceAngle;
      const endAngle = startAngle + sliceAngle;
      const startRad = (startAngle * Math.PI) / 180;
      const endRad = (endAngle * Math.PI) / 180;
      const x1 = radius * Math.cos(startRad);
      const y1 = radius * Math.sin(startRad);
      const x2 = radius * Math.cos(endRad);
      const y2 = radius * Math.sin(endRad);
      const largeArc = sliceAngle > 180 ? 1 : 0;

      const path = document.createElementNS(svgNS, 'path');
      path.setAttribute('d', `M 0 0 L ${x1} ${y1} A ${radius} ${radius} 0 ${largeArc} 1 ${x2} ${y2} Z`);
      path.setAttribute('fill', PALETTE[i % PALETTE.length]);
      path.setAttribute('stroke', '#0f0d1a');
      path.setAttribute('stroke-width', '0.8');
      wheelEl.appendChild(path);

      const centerAngle = startAngle + sliceAngle / 2;
      const textRadius = radius * 0.62;

      const text = document.createElementNS(svgNS, 'text');
      text.setAttribute('x', textRadius);
      text.setAttribute('y', 0);
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('dominant-baseline', 'middle');
      text.setAttribute('fill', '#fff');
      text.setAttribute('font-family', 'Fraunces, serif');
      text.setAttribute('font-weight', '700');

      const fontSize = Math.max(4, Math.min(10, 70 / n + 3));
      text.setAttribute('font-size', fontSize);
      text.setAttribute('transform', `rotate(${centerAngle})`);

      const maxChars = Math.max(6, Math.floor(18 - n * 0.4));
      text.textContent = truncate(labels[i] || `Slice ${i + 1}`, maxChars);
      text.setAttribute('style', 'paint-order: stroke; stroke: rgba(0,0,0,0.35); stroke-width: 0.6px;');

      wheelEl.appendChild(text);
    }
  }

  // ---------- Labels list ----------
  function renderList() {
    const labels = getLabels();
    listEl.innerHTML = '';
    labels.forEach((label, i) => {
      const row = document.createElement('div');
      row.className = 'label-row';

      const swatch = document.createElement('div');
      swatch.className = 'swatch';
      swatch.style.background = PALETTE[i % PALETTE.length];

      const input = document.createElement('input');
      input.className = 'label-input';
      input.type = 'text';
      input.value = label;
      input.placeholder = `Label ${i + 1}`;
      input.maxLength = 40;
      input.addEventListener('input', (e) => {
        getLabels()[i] = e.target.value;
        renderWheel();
        saveState();
      });

      const remove = document.createElement('button');
      remove.className = 'remove-btn';
      remove.type = 'button';
      remove.textContent = '×';
      remove.title = 'Remove';
      remove.addEventListener('click', () => {
        getLabels().splice(i, 1);
        renderList();
        renderWheel();
        updateCount();
        saveState();
      });

      row.appendChild(swatch);
      row.appendChild(input);
      row.appendChild(remove);
      listEl.appendChild(row);
    });
  }

  // ---------- Wins list ----------
  function renderWins() {
    const labels = getLabels();
    const wins = getWins();
    winsListEl.innerHTML = '';

    let total = 0;
    Object.values(wins).forEach(v => { total += (v || 0); });
    totalWinsEl.textContent = total;

    if (labels.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'Add labels to see win tracking.';
      winsListEl.appendChild(empty);
      return;
    }

    const counts = labels.map(l => wins[l] || 0);
    const maxCount = Math.max(1, ...counts);
    const hasAnyWins = counts.some(c => c > 0);

    labels.forEach((label, i) => {
      const count = counts[i];
      const row = document.createElement('div');
      row.className = 'win-row';
      if (hasAnyWins && count > 0 && count === maxCount) row.classList.add('leader');

      const swatch = document.createElement('div');
      swatch.className = 'swatch';
      swatch.style.background = PALETTE[i % PALETTE.length];

      const name = document.createElement('div');
      name.className = 'win-name';
      name.textContent = label || `Slice ${i + 1}`;

      const bar = document.createElement('div');
      bar.className = 'win-bar';
      const fill = document.createElement('div');
      fill.className = 'win-bar-fill';
      fill.style.width = `${(count / maxCount) * 100}%`;
      bar.appendChild(fill);

      const countNode = document.createElement('div');
      countNode.className = 'win-count';
      countNode.textContent = count;

      row.appendChild(swatch);
      row.appendChild(name);
      row.appendChild(bar);
      row.appendChild(countNode);
      winsListEl.appendChild(row);
    });
  }

  function updateCount() {
    const labels = getLabels();
    countEl.textContent = labels.length;
    addBtn.disabled = labels.length >= MAX_LABELS;
    spinBtn.disabled = labels.length < 2 || spinning;
  }

  // ---------- Set management ----------
  function renderSetSelect() {
    setSelect.innerHTML = '';
    const workingOpt = document.createElement('option');
    workingOpt.value = '__working__';
    workingOpt.textContent = 'Working Set (unsaved)';
    setSelect.appendChild(workingOpt);

    const names = Object.keys(state.sets).sort((a, b) => a.localeCompare(b));
    names.forEach(n => {
      const opt = document.createElement('option');
      opt.value = n;
      opt.textContent = n;
      setSelect.appendChild(opt);
    });

    setSelect.value = state.activeSet || '__working__';

    const isSaved = !!state.activeSet;
    renameBtn.disabled = !isSaved;
    deleteSetBtn.disabled = !isSaved;
  }

  function switchToSet(name) {
    if (name === '__working__') {
      state.activeSet = null;
    } else if (state.sets[name]) {
      state.activeSet = name;
    }
    saveState();
    renderAll();
    hideResult();
  }

  function saveSetAs() {
    openModal({
      title: 'Save As New Set',
      body: 'Name this set of labels. Win counts start fresh.',
      placeholder: 'e.g., Dinner Options',
      initial: '',
      onConfirm: (name) => {
        name = (name || '').trim();
        if (!name) return false;
        if (name === '__working__') { alert('That name is reserved.'); return false; }
        if (state.sets[name]) {
          if (!confirm(`"${name}" already exists. Overwrite its labels and win record?`)) return false;
        }
        state.sets[name] = {
          labels: [...getLabels()],
          wins: {}
        };
        state.activeSet = name;
        saveState();
        renderAll();
        return true;
      }
    });
  }

  function saveCurrent() {
    // If we're on the working set, treat Save as Save As
    if (!state.activeSet) {
      saveSetAs();
      return;
    }
    // Otherwise edits are already live in state.sets[activeSet] — just persist
    saveState();
    // Quick visual nudge
    saveBtn.textContent = 'Saved ✓';
    setTimeout(() => { saveBtn.textContent = 'Save'; }, 1200);
  }

  function renameSet() {
    if (!state.activeSet) return;
    const oldName = state.activeSet;
    openModal({
      title: 'Rename Set',
      body: `Rename "${oldName}" to:`,
      placeholder: 'New name',
      initial: oldName,
      onConfirm: (name) => {
        name = (name || '').trim();
        if (!name) return false;
        if (name === oldName) return true;
        if (name === '__working__') { alert('That name is reserved.'); return false; }
        if (state.sets[name]) { alert(`"${name}" already exists.`); return false; }
        state.sets[name] = state.sets[oldName];
        delete state.sets[oldName];
        state.activeSet = name;
        saveState();
        renderAll();
        return true;
      }
    });
  }

  function deleteSet() {
    if (!state.activeSet) return;
    const name = state.activeSet;
    if (!confirm(`Delete set "${name}"? This removes its labels and win record.`)) return;
    delete state.sets[name];
    state.activeSet = null;
    saveState();
    renderAll();
    hideResult();
  }

  function clearWins() {
    const scope = state.activeSet ? `"${state.activeSet}"` : 'the working set';
    if (!confirm(`Clear all win counts for ${scope}?`)) return;
    getActive().wins = {};
    saveState();
    renderWins();
  }

  // ---------- Labels bulk ----------
  function addLabel() {
    const labels = getLabels();
    if (labels.length >= MAX_LABELS) return;
    labels.push('');
    renderList();
    renderWheel();
    updateCount();
    saveState();
    const inputs = listEl.querySelectorAll('.label-input');
    if (inputs.length) inputs[inputs.length - 1].focus();
  }

  function clearAll() {
    if (!confirm('Clear all labels from this set?')) return;
    getActive().labels = [];
    saveState();
    renderAll();
    hideResult();
  }

  function resetDefaults() {
    if (!confirm('Replace labels with defaults?')) return;
    getActive().labels = [...DEFAULTS];
    saveState();
    renderAll();
    hideResult();
  }

  // ---------- Modal ----------
  let modalOnConfirm = null;

  function openModal({ title, body, placeholder, initial, onConfirm }) {
    modalTitle.textContent = title;
    modalBody.textContent = body;
    modalInput.placeholder = placeholder || '';
    modalInput.value = initial || '';
    modalOnConfirm = onConfirm;
    modal.classList.add('show');
    setTimeout(() => { modalInput.focus(); modalInput.select(); }, 50);
  }

  function closeModal() {
    modal.classList.remove('show');
    modalOnConfirm = null;
  }

  modalCancel.addEventListener('click', closeModal);
  modalConfirm.addEventListener('click', () => {
    if (modalOnConfirm) {
      const result = modalOnConfirm(modalInput.value);
      if (result !== false) closeModal();
    } else {
      closeModal();
    }
  });
  modalInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); modalConfirm.click(); }
    if (e.key === 'Escape') closeModal();
  });
  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
  });

  // ---------- Spin ----------
  function hideResult() {
    resultEl.classList.remove('show', 'pop');
  }

  function spin() {
    const labels = getLabels();
    if (spinning || labels.length < 2) return;
    spinning = true;
    updateCount();
    hideResult();

    const n = labels.length;
    const sliceAngle = 360 / n;
    const winnerIndex = Math.floor(Math.random() * n);

    const jitter = (Math.random() - 0.5) * sliceAngle * 0.7;
    const targetBase = -winnerIndex * sliceAngle + jitter;

    const fullRotations = 12;
    const currentMod = ((currentRotation % 360) + 360) % 360;
    const targetMod = ((targetBase % 360) + 360) % 360;
    let delta = targetMod - currentMod;
    if (delta <= 0) delta += 360;
    const finalRotation = currentRotation + fullRotations * 360 + delta;

    currentRotation = finalRotation;
    wheelEl.style.transform = `rotate(${finalRotation}deg)`;

    window.setTimeout(() => {
      spinning = false;
      updateCount();
      const winnerLabel = labels[winnerIndex] || `Slice ${winnerIndex + 1}`;
      resultValueEl.textContent = winnerLabel;
      resultEl.classList.add('show', 'pop');

      // Record the win using the actual label text as the key
      const wins = getWins();
      const key = labels[winnerIndex] || `__slice_${winnerIndex}`;
      wins[key] = (wins[key] || 0) + 1;
      saveState();
      renderWins();
    }, 11200);
  }

  // ---------- Tabs ----------
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const target = tab.dataset.tab;
      tabs.forEach(t => t.classList.toggle('active', t === tab));
      tabPanels.forEach(p => {
        p.classList.toggle('active', p.id === `tab-${target}`);
      });
      if (target === 'wins') renderWins();
    });
  });

  // ---------- Render everything ----------
  function renderAll() {
    renderSetSelect();
    renderList();
    renderWheel();
    renderWins();
    updateCount();
  }

  // ---------- Wire up ----------
  spinBtn.addEventListener('click', spin);
  addBtn.addEventListener('click', addLabel);
  clearBtn.addEventListener('click', clearAll);
  resetBtn.addEventListener('click', resetDefaults);
  setSelect.addEventListener('change', (e) => switchToSet(e.target.value));
  saveBtn.addEventListener('click', saveCurrent);
  saveAsBtn.addEventListener('click', saveSetAs);
  renameBtn.addEventListener('click', renameSet);
  deleteSetBtn.addEventListener('click', deleteSet);
  clearWinsBtn.addEventListener('click', clearWins);

  renderAll();
</script>
</body>
</html>
