}

// ── UPDATE ───────────────────────────────────────────────────────
function update(){
  frame++;if(state!=='playing')return;

  const PX=88;
  const phys=(pl,col)=>{
    if(!pl.alive)return;
    pl.vy+=.24;if(pl.lopsideAngle!==0)pl.vy+=pl.lopsideAngle*.4;pl.y+=pl.vy;
    if(pl.cheerTimer>0)pl.cheerTimer--;if(pl.fistTimer>0)pl.fistTimer--;
    if(pl.sweatTimer>0)pl.sweatTimer--;if(pl.nearMissTimer>0)pl.nearMissTimer--;
    if(pl.graceTimer>0)pl.graceTimer--;
    if(pl.tearAlpha>0){pl.tearY+=.8;pl.tearAlpha-=.02;}
    if(nearPipe(PX,pl.y))pl.sweatTimer=Math.max(pl.sweatTimer,18);
    if(pl.bananaTimer>0){pl.bananaTimer--;if(pl.bananaTimer===0){pl.bananaMulti=1;puBar.style.opacity='0';}}
    spawnEx(PX,pl.y+22);
    if(checkWallHit(pl)){if(!tryBounce(pl,PX))killP(pl,PX,col);}
  };
  phys(p1,'#ff6600');
  for(const s of stars){s.x-=s.spd;if(s.x<0)s.x=W;}
  let rightmostX=-9999;for(const p of pipes)if(p.x>rightmostX)rightmostX=p.x;
  const pi=Math.max(75,108-p1.score*2);
  if(frame%Math.floor(pi)===0&&(rightmostX<0||rightmostX<W-MIN_PIPE_SPACING)){const lucky=luckyPipeCountdown<=0&&planetIdx>=1;spawnObs(lucky);if(lucky)luckyPipeCountdown=8+Math.floor(Math.random()*5);}
  for(let i=pipes.length-1;i>=0;i--){
    const p=pipes[i];p.x-=speed;p.movePhase+=p.moveSpeed;
    if(p.type==='closing'){p.closePhase+=p.closeDir*.008;if(p.closePhase>1||p.closePhase<0)p.closeDir*=-1;}
    if(p.x<-120){pipes.splice(i,1);continue;}
    // Lucky gates: track whether the player crosses BETWEEN the satellites.
    // Over/under disqualifies the bonus; bouncing through the gap does not.
    if(p.isLucky&&!p.scored&&Math.abs(p.x-PX)<=Math.max(p.topR||30,p.botR||30)+10){
      const[lt,lb]=getTH(p);
      if(p1.y<lt||p1.y>lb)p.outOfBand=true;
    }
    if(!p.scored&&p.x+(p.topR||30)+8<PX){p.scored=true;if(p1.alive)scoreP(p1,p.isLucky&&!p.outOfBand);}
    if(p1.alive&&p1.graceTimer===0&&checkHit(PX,p1.y,p)){if(!tryBounce(p1,PX,true))killP(p1,PX,'#ff6600');}

  }
  // near miss sparks
  for(const p of pipes){if(Math.abs(PX-p.x)<50&&p1.alive){const[t,b]=getTH(p);if(p1.y-t<30||b-p1.y<30){if(!p1.nearMissTimer){const[c1]=nearMissCol();spawnP(PX,p1.y,c1,4);}p1.nearMissTimer=22;}}}
  const mag=upgrades.magnet*12;
  for(let i=powerBananas.length-1;i>=0;i--){
    const b=powerBananas[i];b.x-=speed;
    if(b.collected){b.collectedTimer++;if(b.collectedTimer>20){powerBananas.splice(i,1);continue;}continue;}
    if(b.x<-30){powerBananas.splice(i,1);continue;}
    if(mag>0&&p1.alive){const dx=PX-b.x,dy=p1.y-(b.y+Math.sin(frame*.08+b.bob)*5);if(dx*dx+dy*dy<(80+mag)*(80+mag)){b.x+=(PX-b.x)*.05;}}
    const colB=(pl)=>{if(!pl.alive)return;const dy=pl.y-(b.y+Math.sin(frame*.08+b.bob)*5);if((PX-b.x)*(PX-b.x)+dy*dy<(22+mag*.3)*(22+mag*.3)){b.collected=true;sndBanana();pl.bananaMulti=2;pl.bananaTimer=300;puBar.style.opacity='1';puInner.style.width='100%';spawnBananaFX(b.x,b.y);showStreak('POWER BANANA x2!');}};
    colB(p1);
  }
  if(p1.bananaTimer>0)puInner.style.width=(p1.bananaTimer/300*100)+'%';
  updateRepair();
  // Update wrenches
  for(let i=wrenches.length-1;i>=0;i--){
    const w=wrenches[i];w.x-=speed;w.rot+=.05;
    // Track anchor pipe — keep wrench in the centre of its gap as the pipe scrolls
    if(w.anchorPipe&&pipes.includes(w.anchorPipe)){
      const[tH,bY]=getTH(w.anchorPipe);
      w.y=(tH+bY)/2;
    }
    if(w.collected){w.collectedTimer++;if(w.collectedTimer>20){wrenches.splice(i,1);continue;}continue;}
    if(w.x<-30){wrenches.splice(i,1);continue;}
    if(p1.alive){
      const dx=PX-w.x,dy=p1.y-(w.y+Math.sin(frame*.08+w.bob)*5);
      if(dx*dx+dy*dy<90*90){
        w.collected=true;
        runStats.wrenches++;
        startRepair();
        sndUpgrade();vibrate(30);spawnP(w.x,w.y,'#44ddff',20);spawnP(w.x,w.y,'#ffffff',10);
      }
    }
  }
  for(const p of particlePool){if(!p.active)continue;p.x+=p.vx;p.y+=p.vy;p.vy+=.14;p.life-=.03;if(p.life<=0)p.active=false;}
  for(const p of exhaustPool){if(!p.active)continue;p.x+=p.vx;p.y+=p.vy;p.life-=.07;p.r*=.92;if(p.life<=0)p.active=false;}
  for(let i=debris.length-1;i>=0;i--){const d=debris[i];d.x+=d.vx;d.y+=d.vy;d.vy+=.18;d.rot+=d.rotSpd;d.life-=.018;if(d.life<=0)debris.splice(i,1);}
  if(shake>0)shake*=.8;if(flash>0)flash*=.82;
  if(!p1.alive)endGame();
}



// ── DRAW FACE ────────────────────────────────────────────────────
function drawFace(c,isDead,vy,pl){

  }

  hull();c.fillStyle='#d8e4ee';c.fill();

  const hg=c.createLinearGradient(L[0]*16,L[1]*16,-L[0]*16,-L[1]*16);
  hg.addColorStop(0,'rgba(255,255,255,.55)');hg.addColorStop(.45,'rgba(255,255,255,0)');hg.addColorStop(1,'rgba(20,35,55,.45)');

  c.save();c.translate(0,-14);drawFace(c,isDead,pl.vy,pl);drawHat(c);

  // name tag
  
    if(pl.cheerTimer>0){c.save();c.globalAlpha=Math.min(1,pl.cheerTimer/20);c.fillStyle='#ffee00';c.font='bold 11px Arial';c.textAlign='center';c.fillText('OOH OOH!',0,-48+Math.sin(frame*.3)*3);c.restore();}

// ── OBSTACLE ART ────────────────────────────────────────────────
// Sunlight comes from the upper-left and stays fixed on screen while objects spin.
const OBS_LIGHT=[-0.62,-0.78];
function obsLight(rot){const cs=Math.cos(-rot),sn=Math.sin(-rot);return[OBS_LIGHT[0]*cs-OBS_LIGHT[1]*sn,OBS_LIGHT[0]*sn+OBS_LIGHT[1]*cs];}
function obsRng(seed){let st=seed>>>0;return()=>{st=(st*1664525+1013904223)>>>0;return st/4294967296;};}
function obsPath(c,pts){const n=pts.length;c.beginPath();
  let mx=(pts[n-1][0]+pts[0][0])/2,my=(pts[n-1][1]+pts[0][1])/2;c.moveTo(mx,my);
  for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];c.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}
  c.closePath();}
function obsShade(c,r,L,k){
  const g=c.createRadialGradient(L[0]*r*.55,L[1]*r*.55,r*.05,L[0]*r*.2,L[1]*r*.2,r*1.35);
  g.addColorStop(0,'rgba(255,250,235,'+(.30*k)+')');g.addColorStop(.42,'rgba(255,255,255,0)');
  g.addColorStop(.72,'rgba(0,0,10,'+(.35*k)+')');g.addColorStop(1,'rgba(0,0,10,'+(.7*k)+')');
  c.fillStyle=g;c.fillRect(-r*1.6,-r*1.6,r*3.2,r*3.2);}
function obsLin(c,L,len,a,b){const g=c.createLinearGradient(L[0]*len,L[1]*len,-L[0]*len,-L[1]*len);g.addColorStop(0,a);g.addColorStop(1,b);return g;}
function obsFoil(c,L,len){const g=c.createLinearGradient(L[0]*len,L[1]*len,-L[0]*len,-L[1]*len);
  g.addColorStop(0,'#fff1b0');g.addColorStop(.35,'#e0a83a');g.addColorStop(.7,'#9a6418');g.addColorStop(1,'#5a3608');return g;}
function obsCrinkle(c,x,y,w,h,seed){const R=obsRng(seed);c.save();c.beginPath();c.roundRect(x,y,w,h,2);c.clip();
  c.strokeStyle='rgba(255,240,190,.35)';c.lineWidth=.6;c.beginPath();
  for(let i=0;i<6;i++){const a=x+R()*w,b=y+R()*h;c.moveTo(a,b);c.lineTo(a+(R()-.5)*w*.6,b+(R()-.5)*h*.6);}
  c.stroke();c.restore();}
function obsPanel(c,x,y,w,h,L,nx,ny){
  c.fillStyle=obsLin(c,L,Math.max(w,h),'#2f5fa8','#0d1f3d');c.beginPath();c.roundRect(x,y,w,h,1);c.fill();
  c.strokeStyle='rgba(120,170,240,.45)';c.lineWidth=.5;c.beginPath();
  for(let i=1;i<nx;i++){const xx=x+w*i/nx;c.moveTo(xx,y);c.lineTo(xx,y+h);}
  for(let j=1;j<ny;j++){const yy=y+h*j/ny;c.moveTo(x,yy);c.lineTo(x+w,yy);}c.stroke();
  c.strokeStyle='#8fa6c2';c.lineWidth=.9;c.beginPath();c.roundRect(x,y,w,h,1);c.stroke();
  c.save();c.beginPath();c.roundRect(x,y,w,h,1);c.clip();c.globalAlpha=.22;c.fillStyle='#cfe4ff';
  c.beginPath();c.moveTo(x+w*.15,y);c.lineTo(x+w*.4,y);c.lineTo(x+w*.15,y+h);c.lineTo(x-w*.1,y+h);c.closePath();c.fill();c.restore();}
function obsNav(c,x,y,col,phase){
  if(((frame+phase)>>4)&1)return; // blinking
  const g=c.createRadialGradient(x,y,0,x,y,5);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=g;c.beginPath();c.arc(x,y,5,0,Math.PI*2);c.fill();

// Asteroid surface texture is baked once per rock (it spins with the rock); lighting is added live.
const ROCK_PAL=[['#6b6259','#2c2620'],['#5d6872','#22282e'],['#77594a','#2e1f18']];
const ROCK_TEX_RES=2;
function rockTexture(pts){
  if(pts._tex)return pts._tex;
  const r=pts.r||20,seed=pts.seed||1,R=obsRng(seed),pal=ROCK_PAL[seed%3];

    t.fillStyle=R()<.5?'rgba(255,255,255,.08)':'rgba(0,0,0,.18)';t.fillRect(Math.cos(a)*d,Math.sin(a)*d,1.4,1.4);}

function obsPaint(c,satType,r,pts,L){

    c.drawImage(tx.cv,-tx.half,-tx.half,tx.half*2,tx.half*2);
    // crater rims catch the light on the side facing away from the sun (they're bowls)
    c.strokeStyle='rgba(255,240,220,.35)';
    const la=Math.atan2(-L[1],-L[0]);
    for(const cr of tx.craters){c.lineWidth=Math.max(.8,cr[2]*.22);c.beginPath();c.arc(cr[0],cr[1],cr[2],la-1.2,la+1.2);c.stroke();}

    return;
  }

    c.strokeStyle='#9aa8b6';c.lineWidth=2.6;c.beginPath();c.moveTo(-31,0);c.lineTo(31,0);c.stroke();
    c.strokeStyle='#56626f';c.lineWidth=.7;c.beginPath();for(let x=-28;x<=28;x+=4){c.moveTo(x,-1.3);c.lineTo(x+2,1.3);c.moveTo(x+2,-1.3);c.lineTo(x,1.3);}c.stroke();
    obsPanel(c,-34,-15,7,30,L,1,6);obsPanel(c,-26,-15,7,30,L,1,6);obsPanel(c,19,-15,7,30,L,1,6);obsPanel(c,27,-15,7,30,L,1,6);
    c.fillStyle='#c9d2dc';c.beginPath();c.roundRect(-14,-3.5,28,7,3.5);c.fill();
    c.fillStyle=obsFoil(c,L,10);c.beginPath();c.roundRect(-8,-7,16,14,3);c.fill();obsCrinkle(c,-8,-7,16,14,11);
    c.strokeStyle='#4a3008';c.lineWidth=.7;c.beginPath();c.roundRect(-8,-7,16,14,3);c.stroke();
    c.fillStyle='#e8eef4';c.beginPath();c.roundRect(-3,-12,6,6,1.5);c.fill();
    c.restore();
    return;
  }
  if(satType===1){
    // Sputnik
    c.strokeStyle='#cfd7df';c.lineWidth=1.2;c.beginPath();
    c.moveTo(-r*.7,-r*.4);c.lineTo(-r-22,r*.55);c.moveTo(-r*.6,r*.3);c.lineTo(-r-19,r*1.05);
    c.moveTo(r*.7,-r*.4);c.lineTo(r+22,-r*.55);c.moveTo(r*.6,r*.3);c.lineTo(r+19,r*.25);c.stroke();
    const g=c.createRadialGradient(L[0]*r*.45,L[1]*r*.45,r*.05,0,0,r);
    g.addColorStop(0,'#ffffff');g.addColorStop(.18,'#f0f4f8');g.addColorStop(.55,'#a9b6c4');g.addColorStop(1,'#39434f');
    c.fillStyle=g;c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.fill();
    c.save();c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.clip();c.globalAlpha=.25;c.strokeStyle='#ffffff';c.lineWidth=1.5;
    c.beginPath();c.arc(0,0,r*.72,Math.atan2(L[1],L[0])-.6,Math.atan2(L[1],L[0])+.2);c.stroke();c.restore();
    c.strokeStyle='rgba(50,60,72,.55)';c.lineWidth=.8;c.beginPath();c.ellipse(0,0,r,r*.3,0,0,Math.PI*2);c.stroke();
    c.strokeStyle='#20272f';c.lineWidth=1;c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.stroke();

    obsPanel(c,13,-12,24,24,L,4,4);
    c.fillStyle=obsFoil(c,L,12);c.beginPath();c.roundRect(-10,-8,20,16,2.5);c.fill();obsCrinkle(c,-10,-8,20,16,23);

    c.fillStyle=obsFoil(c,L,r*.7);c.beginPath();c.roundRect(-r*.62,-r*.62,r*1.24,r*1.24,1.5);c.fill();

    c.strokeStyle='#28313b';c.lineWidth=1;c.beginPath();c.roundRect(-r,-r,r*2,r*2,2.5);c.stroke();

// Each obstacle is painted once per 11.25° rotation step (lit from the fixed sun direction)
// and reused; the small leftover angle is applied when drawing so motion stays smooth.
// At most one new paint per frame — otherwise the nearest already-painted step is reused.
const OBS_STEPS=32,OBS_CACHE=new Map(),OBS_CACHE_MAX=110,OBS_LAST=new Map();
let obsBakeFrame=-1,obsBakes=0;
function obsHalf(t,r,pts){
  if(t===4){let m=0;for(const q of pts)m=Math.max(m,Math.hypot(q[0],q[1]));return Math.ceil(m+5);}
  if(t===0)return Math.ceil(40*r/38);
  if(t===1)return Math.ceil(r*1.6+26);
  if(t===2)return 42;
  return Math.ceil(Math.hypot(r+13,r)+3);
}
function obsLRU(map,key,val,max){map.delete(key);map.set(key,val);if(map.size>max)map.delete(map.keys().next().value);}
function drawSatellite(c,satType,r,pts,rot){
  rot=rot||0;
  if(satType===4&&!pts)pts=mkRock(18,r);
  const half=obsHalf(satType,r,pts);
  // Not on screen yet (or already gone) — nothing to draw or paint
  const m=c.getTransform(),sx=m.e/renderRes;
  if(sx-half*1.2>W||sx+half*1.2<0)return;
  const step=Math.PI*2/OBS_STEPS;
  let ki=((Math.round(rot/step)%OBS_STEPS)+OBS_STEPS)%OBS_STEPS;
  const res=Math.min(2,Math.max(1,Math.ceil(renderRes*2)/2));
  const id=(satType===4?('R'+pts.seed):('S'+satType))+'_'+Math.round(r)+'@'+res;
  let spr=OBS_CACHE.get(id+'|'+ki);
  if(spr)obsLRU(OBS_CACHE,id+'|'+ki,spr,OBS_CACHE_MAX);
  else{
    if(obsBakeFrame!==frame){obsBakeFrame=frame;obsBakes=0;}
    const last=OBS_LAST.get(id);
    if(obsBakes>=1&&last){ki=last.ki;spr=last.spr;}   // over this frame's budget: reuse nearest painted step
    else{
      obsBakes++;
      const cv=document.createElement('canvas');cv.width=cv.height=Math.max(1,Math.ceil(half*2*res));
      const t=cv.getContext('2d');t.scale(res,res);t.translate(half,half);t.rotate(ki*step);
      obsPaint(t,satType,r,pts,obsLight(ki*step));
      spr={cv,half};obsLRU(OBS_CACHE,id+'|'+ki,spr,OBS_CACHE_MAX);
    }
  }
  obsLRU(OBS_LAST,id,{ki,spr},80);
  const ak=ki*step;
  c.rotate(-ak);c.drawImage(spr.cv,-spr.half,-spr.half,spr.half*2,spr.half*2);c.rotate(ak);
  // Blinking navigation lights are drawn live so they keep blinking
  if(satType===0){const k=r/38;obsNav(c,-14*k,0,'rgba(255,60,60,.9)',0);obsNav(c,14*k,0,'rgba(80,255,140,.9)',16);}
  else if(satType===2)obsNav(c,6,-5,'rgba(255,60,60,.9)',8);
}

function drawObs(p){
  const[tH,bY]=getTH(p);
  p.rot1+=p.rs1;p.rot2+=p.rs2;
  if(p.isLucky){p.luckyPulse=(p.luckyPulse||0)+.12;}

  if(p.type==='cluster'&&p.cluster){
    for(const ck of p.cluster){
      ck.rot+=ck.rs;
      ctx.save();ctx.translate(p.x+ck.ox,ck.oy);ctx.rotate(ck.rot);
      if(ck.sat===4&&!ck.pts)ck.pts=mkRock(18,ck.r);
      drawSatellite(ctx,ck.sat,ck.r,ck.pts||null,ck.rot);
      ctx.restore();
    }
    return;
  }

  function drawOne(cx,cy,satType,pts,rot,r){
    ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);
    if(p.isLucky){
      // Outer huge gold halo
      ctx.save();ctx.globalAlpha=.55+.35*Math.sin(p.luckyPulse);
      ctx.fillStyle='#ffdd00';
      ctx.beginPath();ctx.arc(0,0,r+32,0,Math.PI*2);ctx.fill();
      ctx.restore();
      // Mid bright halo
      ctx.save();ctx.globalAlpha=.7;
      ctx.fillStyle='#ffee44';
      ctx.beginPath();ctx.arc(0,0,r+18,0,Math.PI*2);ctx.fill();
      ctx.restore();
      // Inner ring
      ctx.save();ctx.globalAlpha=.9+.1*Math.sin(p.luckyPulse);
      ctx.strokeStyle='#ffffaa';ctx.lineWidth=3.5;
      ctx.beginPath();ctx.arc(0,0,r+8,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }
    drawSatellite(ctx,satType,r,pts,rot);
    if(p.isLucky){
      // Solid gold overlay — the obstacle becomes a gold nugget
      ctx.save();ctx.globalAlpha=.85;ctx.fillStyle='#ffcc00';
      ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.restore();
      // Bright outline
      ctx.save();ctx.strokeStyle='#fff8cc';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();ctx.restore();
      // Sparkle stars rotating around it
      ctx.save();
      for(let s=0;s<4;s++){
        const sa=p.luckyPulse*.5+s*Math.PI/2;
        const sx=Math.cos(sa)*(r+22),sy=Math.sin(sa)*(r+22);
        ctx.fillStyle='#ffffff';
        ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('✦',sx,sy);
      }
      ctx.restore();
    }
    ctx.restore();
  }

  // Top obstacle
  drawOne(p.x,tH,p.topSat,p.topPts,p.rot1,p.topR);
  // Bottom obstacle
  drawOne(p.x,bY,p.botSat,p.botPts,p.rot2,p.botR);

  // Lucky ✦ marker in gap centre — BIG
  if(p.isLucky){
    ctx.save();
    const cy=tH+(bY-tH)/2;
    // Outer pulsing glow
    ctx.globalAlpha=.5+.4*Math.sin(p.luckyPulse);
    ctx.fillStyle='#ffdd00';
    ctx.beginPath();ctx.arc(p.x,cy,28,0,Math.PI*2);ctx.fill();
    // Bright inner glow
    ctx.globalAlpha=.85;
    ctx.fillStyle='#fff8cc';
    ctx.beginPath();ctx.arc(p.x,cy,16,0,Math.PI*2);ctx.fill();
    // Star symbol
    ctx.globalAlpha=1;ctx.fillStyle='#ff8800';
    ctx.font='bold 40px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('✦',p.x,cy);
    // 3x label
    ctx.fillStyle='#ffaa00';ctx.font='bold 9px Orbitron,monospace';
    ctx.fillText('3x',p.x,cy+22);
    ctx.restore();
  }
  // Moving arrow hint
  if(p.type==='moving'){
    ctx.save();ctx.globalAlpha=.35+.25*Math.sin(frame*.1);
    ctx.fillStyle='#aabbcc';ctx.font='bold 9px Arial';ctx.textAlign='center';
    ctx.fillText('↕',p.x,tH-18);ctx.restore();
  }
}

function drawBanana(b){const bob=Math.sin(frame*.08+b.bob)*5;ctx.save();ctx.translate(b.x,b.y+bob);if(b.collected){ctx.globalAlpha=Math.max(0,1-b.collectedTimer*.06);ctx.scale(1+b.collectedTimer*.06,1+b.collectedTimer*.06);}drawCoin(ctx,12);if(!b.collected){ctx.globalAlpha=.4+.4*Math.sin(frame*.15);ctx.strokeStyle='#ffffaa';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.stroke();}ctx.restore();}
function drawWrench(w){

function drawDebris(d){

let lastMenuDraw=0;
function draw(ts){
  ctx.clearRect(0,0,W,H);
  if(shake>.5){ctx.save();ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);}
  drawBg();drawStars();
  // Next planet text only (no sprite draw in gauntlet)
  if(state==='playing'){
    const np=planetIdx<PLANET_SEQ.length?PLANET_SEQ[planetIdx]:null;

    ctx.font='8px Orbitron,monospace';ctx.textAlign='right';
    if(np){
      ctx.fillStyle=planetAccent(np.name);
      ctx.fillText(np.name+' @ '+nextTriggerScore(),W-8,H-8-SAFE_B);
    } else {
      ctx.fillStyle='#ff6644';
      ctx.fillText('★ singularity at 500',W-8,H-8-SAFE_B);
    }

  }
  for(const p of pipes)drawObs(p);
  for(const b of powerBananas)if(!b.collected||b.collectedTimer<15)drawBanana(b);
  for(const w of wrenches)if(!w.collected||w.collectedTimer<15)drawWrench(w);
  for(const p of exhaustPool){if(!p.active)continue;ctx.save();ctx.globalAlpha=p.life*.7;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore();}
  for(const d of debris)drawDebris(d);
  const PX=88,ang1=Math.min(Math.max(p1.vy*.055,-.5),1.1);
  if(state==='playing'||state==='dead'){
    if(false){
      // nothing — 2P draws via GS.draw() below
    } else {
      if(p1.alive||debris.length===0){drawShuttleAt(ctx,PX-6,p1.y,ang1,p1,!p1.alive,false);drawRepairMonkey(PX-6,p1.y);}
    }
  }
  for(const p of particlePool){if(!p.active)continue;ctx.save();ctx.globalAlpha=p.life;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore();}
  // First-run hint: shown until the player has flapped 3 times
  if(state==='playing'&&totalRuns<2&&flapCount<3&&p1.alive){
    ctx.save();
    const pulse=.55+.45*Math.sin(frame*.12);
    ctx.globalAlpha=pulse;
    ctx.fillStyle='#ffee66';ctx.font='bold 15px Orbitron,monospace';ctx.textAlign='center';
    ctx.fillText('👆 TAP TO FIRE THRUSTERS',W/2,p1.y+70);
    ctx.restore();
  }
  // Teaching: slow-mo dim + toast pill
  if(slowMoTimer>0&&state==='playing'){ctx.save();ctx.globalAlpha=.25;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.restore();}
  if(toast&&state==='playing'){
    toast.timer--;
    if(toast.timer<=0)toast=null;
    else{
      ctx.save();
      const a=toast.timer>120?(140-toast.timer)/20:Math.min(1,toast.timer/20);
      ctx.globalAlpha=a;
      ctx.font='bold 13px Orbitron,monospace';ctx.textAlign='center';
      const tw=ctx.measureText(toast.text).width+36;
      ctx.fillStyle='rgba(5,8,20,.88)';
      ctx.strokeStyle='rgba(255,200,0,.7)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.roundRect(W/2-tw/2,132,tw,34,17);ctx.fill();ctx.stroke();
      ctx.fillStyle='#ffdd44';ctx.fillText(toast.text,W/2,154);
      ctx.restore();
    }
  }
  if(flash>.01){ctx.save();ctx.globalAlpha=flash;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.restore();}
  drawScanline();
  if(shake>.5)ctx.restore();
}

let lastFrameTime=0;
// FPS tracking
let fpsEl=null;
let fpsFrames=0, fpsLastSample=performance.now(), fpsCurrent=60;
let fpsMin=999, fpsMax=0, fpsSamples=[];
let fpsShown=false;
function fpsToggle(){
  fpsShown=!fpsShown;
  if(!fpsEl)fpsEl=document.getElementById('fps');
  if(fpsEl)fpsEl.style.display=fpsShown?'block':'none';
}

function loop(ts){
  if(gamePaused){requestAnimationFrame(loop);return;}
  // Cap at 60fps for consistent speed on 120Hz displays
  if(ts-lastFrameTime<14){requestAnimationFrame(loop);return;}
  // Track FPS — measured between render frames
  const dt=ts-lastFrameTime;
  if(lastFrameTime>0){
    const instFps=1000/dt;
    fpsSamples.push(instFps);
    if(fpsSamples.length>60)fpsSamples.shift();
  }
  lastFrameTime=ts;
  fpsFrames++;
  if(ts-fpsLastSample>=500){
    // Compute average over last samples
    const avg=fpsSamples.reduce((a,b)=>a+b,0)/Math.max(1,fpsSamples.length);
    fpsCurrent=Math.round(avg);
    const sampleMin=Math.min(...fpsSamples);
    const sampleMax=Math.max(...fpsSamples);
    fpsMin=Math.min(fpsMin,sampleMin);
    fpsMax=Math.max(fpsMax,sampleMax);
    fpsLastSample=ts;
    if(fpsShown){
      if(!fpsEl)fpsEl=document.getElementById('fps');
      if(fpsEl){
        // Object counts that may affect performance
        const pipeCount=(typeof pipes!=='undefined')?pipes.length:0;
        const obsCount=(typeof BNS!=='undefined'&&BNS.obs)?BNS.obs.length:0;
        const partActive=particlePool.filter(p=>p.active).length;
        const exhActive=exhaustPool.filter(p=>p.active).length;
        fpsEl.innerHTML='FPS '+fpsCurrent+'<br>'+
          '<span style="opacity:.7">min '+Math.round(fpsMin)+' / max '+Math.round(fpsMax)+'</span><br>'+
          '<span style="opacity:.7">obs '+pipeCount+' bns '+obsCount+'</span><br>'+
          '<span style="opacity:.7">prt '+partActive+'+'+exhActive+'</span><br>'+
          '<span style="opacity:.7">spd '+(typeof speed!=='undefined'?speed.toFixed(1):'-')+'</span>';
        fpsEl.classList.remove('warn','crit');
        if(fpsCurrent<30)fpsEl.classList.add('crit');
        else if(fpsCurrent<50)fpsEl.classList.add('warn');
      }
    }
  }
  frame++;
  // Pause button visibility (only write DOM on change)
  const wantBtn=PAUSABLE_STATES.includes(state)&&!userPaused;
  if(wantBtn!==pauseBtnShown){pauseBtnShown=wantBtn;pauseBtn.style.display=wantBtn?'flex':'none';}
  // Deliberate user pause: render frozen world + overlay, skip all updates
  if(userPaused&&PAUSABLE_STATES.includes(state)){
    try{
      if(state==='playing')draw(ts);
      else if(state==='blackhole')drawBlackhole();
      else drawBonus();
      if(pauseMode==='paused')drawPauseOverlay();
      else if(pauseMode==='countdown'){
        drawCountdown();
        countdownTimer--;
        if(countdownTimer<=0)finishResume();
      }
    }catch(e){console.error('Pause overlay error:',e);}
    requestAnimationFrame(loop);
    return;
  }
  try{
    if(state==='playing'){
      if(slowMoTimer>0){slowMoTimer--;slowMoSkip=!slowMoSkip;if(!slowMoSkip)update();}
      else update();
      draw(ts);
    }
    else if(state==='resume'){draw(ts);drawResumeOverlay();}
    else if(state==='blackhole'){updateBlackhole();drawBlackhole();}
    else if(state==='bonus'||state==='approach'){
      for(const p of exhaustPool){if(!p.active)continue;p.x+=p.vx;p.y+=p.vy;p.life-=.07;p.r*=.92;if(p.life<=0)p.active=false;}
      for(const p of particlePool){if(!p.active)continue;p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.life-=.03;if(p.life<=0)p.active=false;}
      if(shake>0)shake*=.8;if(flash>0)flash*=.82;
      updateBonus();updateRepair();drawBonus();
    }
    else if(state==='menu'){
      if(ts-lastMenuDraw>16){updateMenu();drawMenuScene();lastMenuDraw=ts;}
    }else{
      if(ts-lastMenuDraw>33){for(const s of stars){s.x-=s.spd*.2;if(s.x<0)s.x=W;}for(const p of planets){p.x-=p.spd*.15;if(p.x<-60)p.x=W+60;}starsDirty=true;draw(ts);lastMenuDraw=ts;}
    }
  }catch(e){
    console.error('Game loop error in state '+state+':',e);
  }
  requestAnimationFrame(loop);
}

    <div style="background:rgba(255,255,255,.04);border-radius:8px;padding:10px 12px;margin-bottom:14px">
      <div style="color:#ff8866;font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:6px">🌙 PLANET BONUS LEVELS</div>
      <div style="color:#bbb;font-size:10px;line-height:1.6">
        Score 50 = <b style="color:#aabbcc">MOON</b>, 120 = <b style="color:#ff6644">MARS</b>, 220 = <b style="color:#eedd99">SATURN</b>, 400 = <b style="color:#bbccff">PLUTO</b>. 30 second timed bonus rounds — fly into drifting bananas to collect them. Rocket auto-launches at 0. At score 500 the singularity awaits.
      </div>
    </div>

    <div style="background:rgba(150,80,255,.08);border-radius:8px;padding:10px 12px;margin-bottom:14px;border:1px solid rgba(150,80,255,.3)">
      <div style="color:#bb88ff;font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:6px">⚫ THE SINGULARITY</div>
      <div style="color:#bbb;font-size:10px;line-height:1.6">
        At score 500 you reach a black hole. A timing meter sweeps back and forth — tap when the marker is inside the green <b>TAP HERE</b> zone. Land <b>10 green hits</b> to escape. Miss and your orbit tightens, making the zone harder to hit. Escape successfully for <b style="color:#ffcc00">+5000 🍌</b> and a permanent speed boost. Fail and all your upgrades reset to zero — high risk, high reward.
      </div>
    </div>

    <div style="color:#ffcc00;font-size:14px;font-weight:900;letter-spacing:2px;text-align:center;margin:8px 0 8px">⚡ UPGRADES</div>

    <div style="background:rgba(255,255,255,.04);border-radius:8px;padding:8px 12px;margin-bottom:6px">
      <div style="color:#ffcc00;font-size:10px;font-weight:700">NANO HULL <span style="color:#888;font-size:9px;letter-spacing:0;font-weight:400">— 50 / 120 / 250 🍌</span></div>
      <div style="color:#999;font-size:9px;line-height:1.5;margin-top:2px">Shrinks the shuttle's hitbox. Easier to thread tight gaps.</div>
    </div>
    <div style="background:rgba(255,255,255,.04);border-radius:8px;padding:8px 12px;margin-bottom:6px">
      <div style="color:#ffcc00;font-size:10px;font-weight:700">BOUNCE HULL <span style="color:#888;font-size:9px;letter-spacing:0;font-weight:400">— 80 / 180 / 350 🍌</span></div>
      <div style="color:#999;font-size:9px;line-height:1.5;margin-top:2px">+1 wall bounce charge per level. Bounces survive crashes but cost a wing.</div>
    </div>
    <div style="background:rgba(255,255,255,.04);border-radius:8px;padding:8px 12px;margin-bottom:6px">
      <div style="color:#ffcc00;font-size:10px;font-weight:700">BANANA MAGNET <span style="color:#888;font-size:9px;letter-spacing:0;font-weight:400">— 60 / 150 / 300 🍌</span></div>
      <div style="color:#999;font-size:9px;line-height:1.5;margin-top:2px">Pulls bananas toward you. Stronger pull each level.</div>
    </div>
    <div style="background:rgba(255,255,255,.04);border-radius:8px;padding:8px 12px;margin-bottom:14px">
      <div style="color:#ffcc00;font-size:10px;font-weight:700">BANANA BOOST <span style="color:#888;font-size:9px;letter-spacing:0;font-weight:400">— 40 / 100 / 220 🍌</span></div>
      <div style="color:#999;font-size:9px;line-height:1.5;margin-top:2px">+1 flat banana per obstacle, per level. Stacks with other multipliers.</div>
    </div>

    <div style="color:#ffcc00;font-size:14px;font-weight:900;letter-spacing:2px;text-align:center;margin:8px 0 8px">💎 BOOSTS</div>

    <div style="background:rgba(255,255,255,.04);border-radius:8px;padding:8px 12px;margin-bottom:6px">
      <div style="color:#44ff88;font-size:10px;font-weight:700">DAILY INSURANCE <span style="color:#888;font-size:9px;letter-spacing:0;font-weight:400">— 400 🍌 (one-time)</span></div>
      <div style="color:#999;font-size:9px;line-height:1.5;margin-top:2px">Saves your daily streak if you skip a day. Refills after use.</div>
    </div>
    <div style="background:rgba(255,255,255,.04);border-radius:8px;padding:8px 12px;margin-bottom:6px">
      <div style="color:#ffdd00;font-size:10px;font-weight:700">BANANA DOUBLER <span style="color:#888;font-size:9px;letter-spacing:0;font-weight:400">— 1000 🍌 (24 hours)</span></div>
      <div style="color:#999;font-size:9px;line-height:1.5;margin-top:2px">All run earnings ×2 for 24 hours. Buy again to extend the timer.</div>
    </div>
    <div style="background:rgba(255,255,255,.04);border-radius:8px;padding:8px 12px;margin-bottom:14px">
      <div style="color:#44ddff;font-size:10px;font-weight:700">AUTO-REPAIR <span style="color:#888;font-size:9px;letter-spacing:0;font-weight:400">— 2000 🍌 per charge (stack)</span></div>
      <div style="color:#999;font-size:9px;line-height:1.5;margin-top:2px">Triggers automatically when hull is fully depleted. The repair monkey climbs out and fixes all wings to full. Consumed on use.</div>
    </div>

    <div style="background:rgba(255,180,0,.06);border-radius:8px;padding:10px 12px;margin-bottom:8px;border:1px solid rgba(255,180,0,.2)">
      <div style="color:#ffcc00;font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:6px">🎯 DAILY MISSION</div>
      <div style="color:#bbb;font-size:10px;line-height:1.6">
        A new challenge every day. Complete it to earn a bonus banana reward (250-500 🍌). The mission shows on the main menu with your progress. Resets at midnight local time.
      </div>
    </div>

    <div style="background:rgba(255,180,0,.06);border-radius:8px;padding:10px 12px;margin-bottom:14px;border:1px solid rgba(255,180,0,.2)">
      <div style="color:#ffcc00;font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:6px">🔥 DAILY STREAK</div>
      <div style="color:#bbb;font-size:10px;line-height:1.6">
        Play every day for bonus bananas:<br>
        Day 2 = <b style="color:#ffee00">1.5×</b> bananas<br>
        Day 3 = <b style="color:#ffee00">2×</b> bananas<br>
        Day 7+ = <b style="color:#ffee00">3×</b> bananas
      </div>
    </div>

    <button id="btnHelpBack" style="${BSec};display:block;width:240px;margin:6px auto">⌂ BACK TO MENU</button>
  </div>`;
  document.getElementById('btnHelpBack').onclick=()=>showMenu();
}

function showMenu(){
state='menu';s1El.style.display='block';resize();
  s1El.textContent='';puBar.style.opacity='0';hullEl.style.opacity='0';
  initMenuState();
  const dm=dailyMultiplier();
  const streakInfo=dailyStreak>1?`<div style="color:#ffee00;font-size:11px;margin-bottom:4px">🔥 DAY ${dailyStreak} STREAK — ${dm}x BANANAS</div>`:'';
  // Daily mission card
  ensureDailyMission();
  const m=currentMission();
  const labelText=m.label.replace('TARGET',m.target);
  const progress=Math.min(dailyMissionProgress,m.target);
  const pctW=Math.min(100,(progress/m.target)*100);
  const missionCard=dailyMissionClaimed
    ? `<div style="background:rgba(0,220,100,.08);border:1px solid rgba(0,220,100,.3);border-radius:8px;padding:8px 12px;margin:6px auto 8px;width:260px;text-align:left">
        <div style="color:#44ff88;font-size:10px;font-weight:700;letter-spacing:1px">🎯 DAILY MISSION ✓ COMPLETE</div>
        <div style="color:#888;font-size:9px;margin-top:2px">${labelText} — claimed +${fmtN(m.reward)} 🍌</div>
       </div>`
    : `<div style="background:rgba(255,255,255,.04);border:1px solid rgba(255,180,0,.4);border-radius:8px;padding:8px 12px;margin:6px auto 8px;width:260px;text-align:left">
        <div style="display:flex;justify-content:space-between;align-items:center"><div style="color:#ffcc00;font-size:10px;font-weight:700;letter-spacing:1px">🎯 DAILY MISSION</div><div style="color:#ffcc00;font-size:10px;font-weight:700">+${fmtN(m.reward)} 🍌</div></div>
        <div style="color:#ddd;font-size:10px;margin-top:3px">${labelText}</div>
        <div style="height:5px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:5px;overflow:hidden"><div style="height:100%;width:${pctW}%;background:linear-gradient(90deg,#ff8800,#ffcc00);transition:width .3s"></div></div>
        <div style="color:#888;font-size:9px;margin-top:3px;text-align:right">${fmtN(progress)} / ${fmtN(m.target)}</div>
       </div>`;
  OV.style.display='flex';OV.innerHTML=`
    <div style="color:#ffcc00;font-size:36px;font-weight:900;letter-spacing:3px;text-shadow:0 0 18px #ffaa00;margin-bottom:2px">MONKEY</div>
    <div style="color:#ff6600;font-size:20px;font-weight:700;letter-spacing:2px;margin-bottom:8px">SHUTTLE</div>
    <div style="color:#886644;font-size:11px;margin-bottom:3px">RUNS: ${fmtN(totalRuns)} &nbsp;|&nbsp; BEST: ${fmtN(hiScore)}</div>
    ${streakInfo}
    ${missionCard}
    <div style="color:#ffcc00;font-size:13px;margin-bottom:12px">🍌 ${fmtN(bananas)} BANANAS${hasBananaDoubler()?' ⚡x2':''}</div>
    <button id="bPlay" style="${BPri};width:240px">▶ PLAY</button>
    <div style="display:flex;gap:6px;margin-top:4px;width:240px">
      <button id="bUpg" style="${BSec};font-size:9px;letter-spacing:.5px">⚡ UPGRADES</button>
      <button id="bHelp" style="${BSec};font-size:9px;letter-spacing:.5px">❓ HOW</button>
      <button id="bOpt" style="${BSec};font-size:9px;letter-spacing:.5px">⚙ OPTIONS</button>
    </div>`;
  insuranceUsed=false;
  document.getElementById('bPlay').onclick=()=>startGame();
  document.getElementById('bUpg').onclick=()=>showUpgradeShop();
  document.getElementById('bHelp').onclick=()=>showHowToPlay();
  document.getElementById('bOpt').onclick=()=>showOptions();
}

function startGame(){
  updateDailyStreak();
  OV.style.display='none';OV.innerHTML='';
  s1El.style.display='block';
  s1El.textContent='0';
  state='playing';resetGame();resize();
}

function showDead(finalBananas,baseBananas,dm,afterDaily,missionWon){
  s1El.style.display='block';resize();

  const fs=p1.score;
  const rec=fs>=hiScore&&fs>0;
  // Banana math breakdown
  let mathRows=`<div style="display:flex;justify-content:space-between;color:#aaa"><span>Collected:</span><span style="color:#fff">${fmtN(baseBananas||0)} 🍌</span></div>`;
  if(dm>1){mathRows+=`<div style="display:flex;justify-content:space-between;color:#ffee00"><span>× ${dm} daily streak:</span><span>${fmtN(afterDaily)} 🍌</span></div>`;}
  if(hasBananaDoubler()){mathRows+=`<div style="display:flex;justify-content:space-between;color:#ffdd00"><span>× 2 banana doubler:</span><span>${fmtN(finalBananas)} 🍌</span></div>`;}
  const breakdownBox=`<div style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:8px 12px;margin:0 auto 10px;width:240px;font-size:11px;font-family:Orbitron,monospace;letter-spacing:.5px">${mathRows}<div style="height:1px;background:rgba(255,255,255,.15);margin:6px 0"></div><div style="display:flex;justify-content:space-between;color:#ffcc00;font-weight:700"><span>EARNED:</span><span>+${fmtN(finalBananas)} 🍌</span></div></div>`;
  // Death sayings — classics, originals, and HHGTTG-flavored parodies
  const DEATH_LINES=[
    ['HOUSTON WE HAVE','A PROBLEM'],
    ['DON\'T PANIC',''],
    ['SO LONG, AND THANKS','FOR ALL THE BANANAS'],
    ['MOSTLY','HARMLESS'],
    ['THE ANSWER WAS','NOT 42'],
    ['FLYING IS MISSING','THE GROUND. YOU DIDN\'T.'],
    ['RAPID UNSCHEDULED','DISASSEMBLY'],
    ['GRAVITY: 1','MONKEY: 0'],
    ['OUT OF BANANAS','AND ALTITUDE'],
    ['OOH OOH...','UH OH.'],
    ['SPACE IS','HARD'],
    ['INSUFFICIENT THRUST','EXCESSIVE SATELLITE'],
    ['LIFE, THE UNIVERSE,','AND SATELLITES'],
    ['THIS MUST BE','THURSDAY'],
    ['SHARE','AND ENJOY'],
    ['RESISTANCE IS','USELESS'],
    ['SHUTTLES HANG IN THE SKY','EXACTLY LIKE BRICKS DO'],
    ['NEVER FORGET','YOUR TOWEL'],
    ['ONE SMALL STEP','ONE GIANT SPLAT'],
    ['FAILURE IS','ALWAYS AN OPTION'],
    ['THE EAGLE HAS','CRASH LANDED'],
    ['MISSION CONTROL','IS SPEECHLESS'],
    ['BANANA','SPLIT'],
    ['MONKEY SEE,','MONKEY THUD'],
    ['100% ORGANIC','SPACE DEBRIS'],
    ['EVOLUTION TOOK','A STEP BACK'],
    ['PHYSICS','ALWAYS WINS'],
    ['SKILL','ISSUE'],
    ['HAVE YOU TRIED','NOT CRASHING?'],
    ['WARRANTY','VOID'],
    ['ORBIT STATUS:','DECAYED'],
    ['NOT THE','RIGHT STUFF'],
  ];
  let dlIdx=Math.floor(Math.random()*DEATH_LINES.length);
  if(dlIdx===window._lastDeathLine)dlIdx=(dlIdx+1)%DEATH_LINES.length; // no back-to-back repeats
  window._lastDeathLine=dlIdx;
  const dl=DEATH_LINES[dlIdx];
  OV.style.display='flex';OV.innerHTML=`<div style="text-align:center;padding:8px 0">
    <div style="color:#ff5500;font-size:18px;font-weight:900;letter-spacing:2px">${dl[0]}</div>
    <div style="color:#ff5500;font-size:18px;font-weight:900;letter-spacing:2px;margin-bottom:8px">${dl[1]}</div>
    
    <div style="color:#fff;font-size:56px;font-weight:900;text-shadow:0 0 18px #ffaa00;line-height:1">${fmtN(fs)}</div>
    ${rec?`<div style="color:#ffee00;font-size:12px;font-weight:700;margin:4px 0">⭐ NEW RECORD!</div>`:''}
    <div style="color:#886644;font-size:11px;margin-bottom:8px">BEST: ${fmtN(hiScore)}</div>
    ${missionWon?`<div style="background:rgba(0,220,100,.12);border:1px solid rgba(0,220,100,.5);border-radius:8px;padding:8px 12px;margin:0 auto 10px;width:240px;color:#44ff88;font-size:11px;font-weight:700;letter-spacing:1px">🎯 DAILY MISSION COMPLETE!<div style="font-size:10px;margin-top:2px;color:#ffcc00">+${fmtN(currentMission().reward)} 🍌 BONUS</div></div>`:''}
    ${breakdownBox}
    <button id="dRetry" style="${BPri};width:240px">▶ RETRY</button>
    <button id="dMenu" style="${BSec};display:block;width:240px;margin:4px auto">⌂ MAIN MENU</button>
    <button id="dShare" style="background:rgba(0,180,255,.1);border:1px solid rgba(0,180,255,.35);color:#55ccff;font-size:11px;font-weight:700;padding:10px 0;border-radius:8px;cursor:pointer;font-family:Orbitron,monospace;width:240px;min-height:42px;margin:4px auto;display:block">📤 SHARE SCORE</button>
  </div>`;
  document.getElementById('dRetry').onclick=()=>startGame();
  document.getElementById('dMenu').onclick=()=>showMenu();
  document.getElementById('dShare').onclick=()=>{
    try{
      const shareText='I scored '+fmtN(fs)+' in Monkey Shuttle! 🚀🍌  Fly a banana-powered rocket to the edge of the solar system.';
      // 1) Native iOS share sheet via App.js bridge — text-only for reliability
      //    (large base64 image payloads via postMessage are unreliable across WebView size limits).
      if(window.nativeShare){
        try{window.nativeShare(shareText,'');return;}catch(e){}
      }
      // 2) Web Share API (some mobile browsers)
      if(navigator.share){
        try{navigator.share({text:shareText,title:'Monkey Shuttle'}).catch(()=>{});return;}catch(e){}
      }
      // 3) Fallback: score-card image for browsers with no share support
      const sc2=document.createElement('canvas');sc2.width=400;sc2.height=200;const c=sc2.getContext('2d');
      const bg=c.createLinearGradient(0,0,400,200);bg.addColorStop(0,'#01060f');bg.addColorStop(1,'#020b1e');c.fillStyle=bg;c.fillRect(0,0,400,200);
      c.fillStyle='#ffcc00';c.font='bold 24px Orbitron,monospace';c.textAlign='center';c.fillText('MONKEY SHUTTLE',200,44);
      c.fillStyle='#ff8800';c.font='12px Orbitron,monospace';c.fillText('MONKEY SHUTTLE',200,68);
      c.fillStyle='#fff';c.font='bold 66px Orbitron,monospace';c.fillText(fmtN(fs),200,148);
      c.fillStyle='#888';c.font='11px Orbitron,monospace';c.fillText('BEST: '+fmtN(hiScore)+'  |  DAY '+dailyStreak+' STREAK',200,174);
      const img=sc2.toDataURL('image/png');
      OV.innerHTML=`<div style="text-align:center"><img src="${img}" style="border-radius:8px;max-width:320px;width:100%;border:1px solid rgba(255,180,0,.3)"><div style="color:#aaa;font-size:10px;margin-top:8px">TAP AND HOLD IMAGE TO SAVE</div><button id="sBack" style="${BSec};margin-top:10px">CLOSE</button></div>`;
      document.getElementById('sBack').onclick=()=>showDead(finalBananas,baseBananas,dm,afterDaily);
    }catch(err){
      // Share failed silently in production. If needed we could show a toast here.
    }
  };
}

// ── BOOT ─────────────────────────────────────────────────────────
requestAnimationFrame(loop);
showMenu();
</script>
</body>
</html>
