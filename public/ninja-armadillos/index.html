<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ninja Armadillos</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#140d1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ninja Armadillos">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--bg:#140d1a;--pad:rgba(42,29,51,.8);--edge:rgba(246,231,200,.18);--hi:#e8842a;--ink:#f6e7c8;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;color:var(--ink);overscroll-behavior:none}
*{touch-action:none;-webkit-tap-highlight-color:transparent}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;outline:none}
#touch{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;gap:8px;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
 padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none;font-family:"Press Start 2P",monospace}
#touch.on{display:flex}
#zone{position:fixed;left:0;top:0;bottom:0;width:50%;display:none;z-index:1}
#zone.on{display:block}
#dpad{position:fixed;left:0;top:0;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:var(--pad);border:2px solid var(--edge);pointer-events:none;z-index:1;display:none;opacity:.35;transition:opacity .12s}
#dpad.on{display:block}#dpad.act{opacity:1;transition:none}
#dpad::before,#dpad::after{content:"";position:absolute;background:rgba(246,231,200,.12);border-radius:4px}
#dpad::before{left:50%;top:16px;bottom:16px;width:34px;margin-left:-17px}
#dpad::after{top:50%;left:16px;right:16px;height:34px;margin-top:-17px}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(246,231,200,.3)}
#touch{z-index:2}
.sp{flex:1 1 150px;min-width:0;max-width:150px}
.mid{display:flex;gap:8px;pointer-events:auto;margin-bottom:6px}
.s{padding:12px 14px;border-radius:8px;background:var(--pad);border:2px solid var(--edge);font-size:10px;color:var(--ink)}
.btns{display:grid;grid-template-columns:86px 86px;grid-template-rows:86px 86px;gap:12px;pointer-events:auto;flex:none}
.b{border-radius:50%;background:var(--pad);border:2px solid var(--edge);color:var(--ink);font-size:11px;display:flex;align-items:center;justify-content:center}
.b.on,.s.on,#pz.on{background:var(--hi);color:#140d1a}
.mid.hide{visibility:hidden;pointer-events:none}
#pz{position:fixed;left:0;top:0;width:40px;height:40px;border-radius:10px;background:var(--pad);border:2px solid var(--edge);display:none;z-index:3;pointer-events:auto;align-items:center;justify-content:center}
#pz.show{display:flex}#pz i{display:block;width:5px;height:15px;background:var(--ink);margin:0 3px;border-radius:1px;pointer-events:none}
#pz.on i{background:#140d1a}
</style>
</head>
<body>
<canvas id="c" width="384" height="216" tabindex="0" aria-label="Ninja Armadillos game screen"></canvas>
<div id="zone"></div>
<div id="pz" data-k="p" aria-label="Pause"><i></i><i></i></div>
<div id="dpad"><div id="knob"></div></div>
<div id="touch">
 <div class="sp"></div>
 <div class="mid"><div class="s" data-k="s">START</div></div>
 <div class="btns">
  <div class="b" data-k="e">ROLL</div><div class="b" data-k="c">SPEC</div>
  <div class="b" data-k="a">HIT</div><div class="b" data-k="b">JUMP</div>
 </div>
</div>
<script>
(()=>{
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=384,H=216,TOP=126,BOT=196,GRAV=0.24;
const FONT='"Press Start 2P", monospace';

/* ---------------- input (with buffering) ---------------- */
const K={},P={},BUF={a:0,b:0,c:0,e:0};
const KEYMAP={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',
 KeyJ:'a',KeyZ:'a',KeyK:'b',KeyX:'b',Space:'b',KeyL:'c',KeyC:'c',KeyI:'e',KeyV:'e',ShiftLeft:'e',ShiftRight:'e',Enter:'s',KeyP:'p',Escape:'p',KeyM:'m'};
function press(k){if(!K[k]){P[k]=true;if(k in BUF)BUF[k]=9}K[k]=true;initAudio()}
function release(k){K[k]=false}
function took(k){if(BUF[k]>0){BUF[k]=0;return true}return false}
function clearBuf(){BUF.a=BUF.b=BUF.c=BUF.e=0}
addEventListener('keydown',e=>{const k=KEYMAP[e.code];if(!k)return;e.preventDefault();press(k)});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(!k)return;e.preventDefault();release(k)});
addEventListener('blur',()=>{for(const k in K)K[k]=false});

/* ---------------- audio ---------------- */
let AC=null,master=null,muted=false,track=null,mNext=0,mStep=0;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.32;master.connect(AC.destination)}catch(e){AC=null}}
function tone(f,d,type,v,slide,when){if(!AC||muted)return;const t=AC.currentTime+(when||0);const o=AC.createOscillator(),gn=AC.createGain();
 o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
 gn.gain.setValueAtTime(v||0.2,t);gn.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+d+0.03)}
let nbuf=null;
function noise(d,v,freq){if(!AC||muted)return;if(!nbuf){nbuf=AC.createBuffer(1,AC.sampleRate*0.6,AC.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
 const s=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain(),t=AC.currentTime;s.buffer=nbuf;f.type='highpass';f.frequency.value=freq||800;
 gn.gain.setValueAtTime(v||0.3,t);gn.gain.exponentialRampToValueAtTime(0.001,t+d);s.connect(f);f.connect(gn);gn.connect(master);s.start(t);s.stop(t+d+0.02)}
const SFX={
 hit(){noise(.07,.32,1400);tone(150,.08,'square',.18,-70)},
 swing(){tone(700,.05,'triangle',.1,-350)},
 jump(){tone(260,.14,'square',.12,260)},
 special(){tone(180,.28,'sawtooth',.13,380);tone(360,.2,'square',.08,500,.05)},
 lasso(){tone(900,.18,'triangle',.12,-600)},
 hurt(){tone(240,.22,'sawtooth',.22,-160)},
 taco(){tone(660,.08,'square',.18);tone(990,.12,'square',.18,0,.08)},
 coin(){tone(1320,.06,'square',.13);tone(1760,.14,'square',.13,0,.06)},
 spit(){tone(520,.14,'sine',.2,-280)},
 thud(){tone(90,.1,'square',.15,-30)},
 roar(){tone(95,.7,'sawtooth',.3,-45);noise(.5,.18,300)},
 boom(){noise(.45,.35,120);tone(70,.45,'square',.25,-40)},
 smack(){noise(.3,.4,200);tone(110,.3,'square',.3,-60);tone(1400,.08,'square',.12,0,.02)},
 bell(){tone(1180,.12,'square',.1);tone(1180,.12,'square',.1,0,.16)},
 horn(){tone(220,.35,'sawtooth',.16);tone(277,.35,'sawtooth',.12)},
 select(){tone(880,.06,'square',.14)},
 buzz(){tone(220,.25,'sawtooth',.04,30);tone(236,.25,'sawtooth',.03,-20,.05)},
 hiss(){noise(.3,.16,2400)},
 screech(){tone(1900,.28,'sawtooth',.08,-1000);tone(2500,.18,'square',.05,-1300,.05)},
 hoot(){tone(330,.18,'sine',.18,-40);tone(300,.3,'sine',.16,-30,.24)},
 roll(){tone(140,.22,'triangle',.18,90);noise(.18,.12,500)},
 squeak(){tone(1500,.07,'square',.1,400);tone(1800,.07,'square',.08,300,.08)},
 unlock(){[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.12,'square',.16,0,i*.08))},
 start(){[523,659,784,1047].forEach((f,i)=>tone(f,.13,'square',.18,0,i*.09))},
 clear(){[659,784,988,1319,988,1319].forEach((f,i)=>tone(f,.14,'square',.16,0,i*.11))},
 lose(){[392,349,311,262].forEach((f,i)=>tone(f,.25,'triangle',.22,0,i*.2))}
};
const midi=n=>440*Math.pow(2,(n-69)/12);
const TRACKS={
 main:{bpm:138,bass:[40,0,40,52,40,0,43,45,40,0,40,52,47,0,45,43],
  lead:[64,0,67,0,69,0,67,64,0,62,64,0,0,0,0,0,64,0,67,0,71,0,69,67,69,0,67,64,62,0,0,0]},
 boss:{bpm:156,bass:[38,38,50,38,41,41,53,41,36,36,48,36,40,40,52,43],
  lead:[74,0,72,0,70,0,69,0,70,72,0,0,65,0,0,0,74,0,72,0,77,0,76,74,72,0,70,0,69,0,0,0]}
};
function setTrack(n){const t=n?TRACKS[n]:null;if(t===track)return;track=t;mStep=0;mNext=0}
function musicTick(){if(!AC||muted||!track)return;const spd=60/track.bpm/2;
 if(mNext<AC.currentTime)mNext=AC.currentTime+0.02;
 while(mNext<AC.currentTime+0.12){const i=mStep%track.bass.length,w=mNext-AC.currentTime;
  const b=track.bass[i];if(b)tone(midi(b),spd*0.9,'triangle',0.2,0,w);
  const l=track.lead[mStep%track.lead.length];if(l)tone(midi(l),spd*0.85,'square',0.055,0,w);
  mNext+=spd;mStep++}}

/* ---------------- helpers ---------------- */
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v;
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function text(s,x,y,c,sz,al,sh){ctx.font=(sz||8)+'px '+FONT;ctx.textAlign=al||'left';ctx.textBaseline='top';
 if(sh!==null){ctx.fillStyle=sh||'#140d1a';ctx.fillText(s,Math.round(x)+1,Math.round(y)+1)}ctx.fillStyle=c||'#f6e7c8';ctx.fillText(s,Math.round(x),Math.round(y))}
function otext(s,x,y,c,sz,al){for(const [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1],[1,1],[2,2]])text(s,x+dx,y+dy,OUT,sz,al,null);text(s,x,y,c,sz,al,null)}
function shade(c,k){const n=parseInt(c.slice(1,7),16);k=k||0.7;const f=v=>clamp(Math.round(v*k),0,255);
 return'#'+((1<<24)|(f(n>>16)<<16)|(f(n>>8&255)<<8)|f(n&255)).toString(16).slice(1)}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=(a,b,c)=>{let h=(a*374761393+b*668265263+c*2147483647)|0;h=(h^(h>>>13))*1274126177|0;return(h>>>0)%1000/1000};

/* ---------------- chibi sprite system ---------------- */
const OUTC=[0x22,0x16,0x1c],OUT='#22161c';
let g=null,SC=1,FL=null;
function Px(x,y,w,h,c){g.fillStyle=FL||c;g.fillRect(Math.round(x*SC),Math.round(y*SC),Math.ceil(w*SC),Math.ceil(h*SC))}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function outlineCanvas(c,passes){const x=c.getContext('2d',{willReadFrequently:true}),w=c.width,h=c.height;let im;
 try{im=x.getImageData(0,0,w,h)}catch(e){return}if(!im||!im.data)return;const d=im.data;
 for(let p=0;p<passes;p++){const src=new Uint8ClampedArray(d);
  for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){const i=(y*w+xx)*4;if(src[i+3])continue;
   if((xx>0&&src[i-1])||(xx<w-1&&src[i+7])||(y>0&&src[i-w*4+3])||(y<h-1&&src[i+w*4+3])){d[i]=OUTC[0];d[i+1]=OUTC[1];d[i+2]=OUTC[2];d[i+3]=255}}}
 x.putImageData(im,0,0)}
const SPR=new Map();
function sprite(key,w,h,ox,oy,fn,passes,fl,sc){let s=SPR.get(key);if(s)return s;
 const c=mk(w,h),x=c.getContext('2d',{willReadFrequently:true});const pg=g,psc=SC,pfl=FL;g=x;SC=sc||1;FL=fl||null;
 x.save();x.translate(ox,oy);fn();x.restore();g=pg;SC=psc;FL=pfl;
 outlineCanvas(c,passes===undefined?2:passes);s={c,ox,oy};if(SPR.size>900)SPR.clear();SPR.set(key,s);return s}
function blit(s,x,y,f){x=Math.round(x);y=Math.round(y);
 if(f<0){ctx.save();ctx.translate(x,0);ctx.scale(-1,1);ctx.drawImage(s.c,-s.ox,y-s.oy);ctx.restore()}else ctx.drawImage(s.c,x-s.ox,y-s.oy)}

const S=['#e4d2b0','#b39f7e','#7c6a52'],SK=['#ffd9c2','#f0ae92','#c27b60'];
const CLAW='#4a3434',EYE='#140c10',WHITE='#fff8ec',NOSE='#5a2a2a',BROW='#4a3226',BLUSH='#ff8fa8',GOLD='#ffd23a';
const STAFF=['#c08a52','#8a5a30','#5e3b1c'];

function hatC(type,H0,H1,H2){
 if(type==='cowboy'){Px(-6,-39,23,3,H1);Px(-6,-39,23,1,H0);Px(-1,-46,13,7,H1);Px(0,-46,11,1,H0);Px(-1,-40,13,1,H2);Px(4,-46,3,1,H2)}
 else if(type==='cap'){Px(-1,-44,12,1,H1);Px(-3,-43,16,7,H1);Px(-1,-43,7,2,H0);Px(12,-38,9,3,H2);Px(12,-38,9,1,H1);Px(5,-45,3,1,H2)}
 else if(type==='hard'){Px(-1,-46,14,1,H1);Px(-3,-45,18,7,H1);Px(0,-44,5,2,'#fff6c8');Px(4,-46,2,8,H2);Px(-6,-38,24,2,H2);Px(-6,-38,24,1,H0)}
 else{Px(-2,-44,14,1,H1);Px(-4,-43,18,7,H1);Px(-1,-42,6,2,H0);for(let i=0;i<6;i++)Px(-3+i*3,-41,1,4,H2);Px(-4,-37,18,2,H2);Px(3,-48,6,4,'#f6e7c8');Px(4,-48,3,1,'#ffffff')}}
function armsC(h,pose,big){
 if(pose==='carry'){Px(-1,-26,4,9,SK[1]);Px(5,-26,4,9,SK[1]);Px(-2,-30,5,5,SK[2]);Px(5,-30,5,5,SK[2]);return}
 if(h.id==='juniper'){
  if(pose.startsWith('punch')){const len=h.reach+(pose==='punch3'?6:2),y=pose==='punch2'?-17:-15;
   Px(2,y,len,3,STAFF[1]);Px(2,y,len,1,STAFF[0]);Px(2+len,y-2,4,7,STAFF[2]);Px(4,y-1,5,5,SK[2])}
  else if(pose==='jump'||pose==='kick'){Px(-7,-32,3,26,STAFF[1]);Px(-7,-32,1,26,STAFF[0]);Px(4,-16,5,4,SK[2])}
  else if(pose==='hurt'){Px(-10,-36,3,32,STAFF[1]);Px(-5,-18,4,5,SK[2])}
  else{Px(10,-40,3,40,STAFF[1]);Px(10,-40,1,40,STAFF[0]);Px(9,-41,5,3,STAFF[2]);Px(7,-17,5,5,SK[2])}return}
 if(pose==='punch1'){Px(5,-15,9,4,SK[1]);Px(13,-17,7+big,7+big,SK[2]);Px(14,-17,5,2,SK[1])}
 else if(pose==='punch2'){Px(5,-17,10,4,SK[1]);Px(14,-19,7+big,7+big,SK[2]);Px(15,-19,5,2,SK[1])}
 else if(pose==='punch3'){Px(5,-20,5,6,SK[1]);Px(6,-28,7+big,8+big,SK[2]);Px(7,-28,5,2,SK[1])}
 else if(pose==='jump'){Px(5,-17,5,4,SK[1]);Px(9,-18,4,5,SK[2])}
 else if(pose==='kick'||pose==='hurt'){Px(-4,-18,4,5,SK[2])}
 else{Px(5,-14,4,5,SK[1]);Px(5,-10,5+big,3+big,SK[2])}}
function ballDraw(h,fr){const r=13,cy=-13,C=h.id==='rat'?['#b8b4c4','#8e8a9c','#5f5b6e']:h.id==='hog'?['#55516a','#2a2834','#16141c']:S;
 if(h.id==='hog')for(let k=0;k<12;k++){const a=k/12*6.283+fr*0.4;Px(Math.round(Math.cos(a)*(r+1))-1,cy+Math.round(Math.sin(a)*(r+1))-1,3,3,C[1])}
 if(h.id==='rat'){Px(-22,-6,10,2,'#f2a0b4');Px(-24,-9,3,4,'#f2a0b4')}
 for(let y=-r;y<=r;y++){const w=Math.round(Math.sqrt(r*r-y*y));Px(-w,cy+y,w*2,1,C[1])}
 for(let k=0;k<5;k++){const bx=((k*6+fr*3)%30)-15;
  for(let y=-r+1;y<r;y++){const w=Math.sqrt(r*r-y*y);if(bx>-w+1&&bx<w-1)Px(bx,cy+y,1,1,C[2])}}
 for(let y=-r+2;y<-2;y++){const w=Math.sqrt(r*r-y*y);Px(-w+2,cy+y,3,1,C[0])}
 Px(-3,cy+r-3,7,2,h.vest);Px(-r+2,cy-1,2,3,shade(h.vest,0.7))}
function hogDraw(h,pose,fr){const Q0='#55516a',Q1='#2a2834',Q2='#16141c',FC='#e8d2b4',FC2='#c8a888',B1=h.hatC,B2=shade(h.hatC,0.65),PW='#f0ae92';
 if(pose==='down'){Px(-16,-10,24,9,Q1);for(let i=0;i<6;i++)Px(-16+i*4,-13,3,3,Q1);Px(6,-12,12,10,FC);Px(17,-9,4,3,FC);Px(20,-9,2,2,'#1a1010');
  Px(10,-10,1,1,EYE);Px(12,-10,1,1,EYE);Px(11,-9,1,1,EYE);Px(10,-8,1,1,EYE);Px(12,-8,1,1,EYE);Px(4,-12,8,2,B1);return}
 const moving=pose==='walk'||pose==='carry',wk=moving?[0,2,0,-2][fr%4]:0,bob=((moving||pose==='idle')&&fr%2)?-1:0,lean=pose==='hurt'?-2:0;
 if(pose==='jump'){Px(-5,-9,5,5,FC2);Px(2,-9,5,5,FC2)}
 else if(pose==='kick'){Px(-5,-9,5,5,FC2);Px(3,-11,12,4,FC2);Px(14,-12,4,5,PW)}
 else{Px(-5+wk,-6,5,6,FC2);Px(2-wk,-6,5,6,FC2);Px(-6+wk,-2,6,2,PW);Px(2-wk,-2,6,2,PW)}
 g.save();g.translate(lean,bob);
 for(let i=0;i<5;i++){Px(-14,-36+i*6,7,5,Q1);Px(-17,-34+i*6,4,2,Q1);Px(-13,-36+i*6,3,1,Q0)}
 Px(-9,-20,14,14,Q1);Px(-2,-19,8,12,FC);Px(-1,-19,6,2,shade(FC,1.06));
 Px(-3,-21,11,3,B1);Px(-3,-21,11,1,shade(B1,1.3));
 Px(-8,-42,14,14,Q1);Px(-6,-42,8,2,Q0);Px(0,-36,13,15,FC);Px(1,-36,9,2,shade(FC,1.06));
 Px(-6,-45,3,3,Q1);Px(-1,-46,3,4,Q1);Px(4,-45,3,3,Q1);Px(-10,-38,3,3,Q1);Px(-11,-32,3,3,Q1);
 Px(2,-40,4,4,FC2);Px(12,-30,5,5,FC);Px(16,-30,3,3,'#1a1010');Px(10,-25,4,1,FC2);
 if(pose==='hurt'){Px(5,-32,5,1,EYE);Px(6,-33,1,1,EYE)}
 else if(pose==='vic'){Px(5,-31,1,1,EYE);Px(6,-32,2,1,EYE);Px(8,-31,1,1,EYE);Px(9,-26,4,2,'#7a1b10')}
 else{Px(6,-33,3,4,EYE);Px(7,-33,1,1,'#ffffff');if(pose.startsWith('punch')||pose==='kick')Px(5,-35,5,1,Q2)}
 Px(4,-27,3,1,BLUSH);
 Px(-7,-38,19,3,B1);Px(-7,-38,19,1,shade(B1,1.3));Px(-11,-37,4,2,B1);Px(-13,-35,3,3,B2);Px(-10,-34,2,3,B2);

function heroPose(p){const s=p.state,id=p.h.id;

 if(s==='roll')return id==='rat'?['walk',(p.t>>1)%4]:['ball',(p.t>>1)%4];
 if(s==='rollc')return id==='rat'?['walk',p.t%4]:['ball',p.t%4];
 if(s==='attack')return['punch'+p.combo,0];if(s==='jump')return[p.kick?'kick':'jump',0];
 if(s==='special'){if(id==='dusty')return['punch1',0];if(id==='pepper')return[(p.t>>2)%2?'kick':'punch2',0];
  if(id==='boulder')return[p.t<14?'jump':'punch3',0];if(id==='rat')return['punch3',0];if(id==='hog')return['ball',(p.t>>1)%4];return['punch1',0]}

 if(e.T.cat){if(s==='pounce'||s==='retreat'||s==='leapUp'||s==='pounceDown'||(s==='drop'&&e.z>0))return['pounce',0];if(s==='crouch'||s==='stalk')return['crouch',0];if(s==='block')return['block',0];if(s==='dizzy')return['stun',0]}

/* ---------------- loop ---------------- */
let last=performance.now(),acc=0;
function frame(now){const dt=Math.min(100,now-last);last=now;const STEP=1000/60;
 if(dt>STEP-3&&dt<STEP+3){acc=0;update();for(const k in P)P[k]=false;syncTouchUI()}
 else{acc+=dt;let n=0;while(acc>=STEP-2&&n<4){update();for(const k in P)P[k]=false;syncTouchUI();acc=Math.max(0,acc-STEP);n++}}
 draw();requestAnimationFrame(frame)}

  homeX=sl+75;homeY=ih-sb-75;if(dpId===null)padAt(homeX,homeY)}}

try{if(matchMedia('(pointer:coarse)').matches)enableTouch()}catch(e){}
function dpSet(e){const dx=e.clientX-ox,dy=e.clientY-oy,dead=14;
 const set=(k,v)=>{if(v)press(k);else release(k)};
 set('l',dx<-dead);set('r',dx>dead);set('u',dy<-dead);set('d',dy>dead);
 const m=Math.min(1,Math.hypot(dx,dy)/48)*40,a=Math.atan2(dy,dx);knob.style.transform='translate('+Math.cos(a)*m+'px,'+Math.sin(a)*m+'px)'}
function dpEnd(e){if(e&&e.pointerId!==dpId)return;dpId=null;['l','r','u','d'].forEach(release);knob.style.transform='';dpad.classList.remove('act');padAt(homeX,homeY)}
/* floating stick: it appears wherever the thumb lands in the left zone */
zone.addEventListener('pointerdown',e=>{e.preventDefault();if(dpId!==null)return;dpId=e.pointerId;try{zone.setPointerCapture(e.pointerId)}catch(_){}
 ox=e.clientX;oy=Math.min(e.clientY,innerHeight-40);padAt(ox,oy);dpad.classList.add('act');dpSet(e);cv.focus();initAudio()});
zone.addEventListener('pointermove',e=>{if(e.pointerId===dpId)dpSet(e)});
zone.addEventListener('pointerup',dpEnd);zone.addEventListener('pointercancel',dpEnd);zone.addEventListener('lostpointercapture',dpEnd);
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;
 const down=e=>{e.preventDefault();press(k);b.classList.add('on')},up=()=>{release(k);b.classList.remove('on')};
 b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)});
cv.addEventListener('pointerdown',()=>{cv.focus();initAudio()});

requestAnimationFrame(frame);
// offline + home-screen app support (only on johnsen.world, not inside Claude)
try{if('serviceWorker' in navigator&&/(^|\.)johnsen\.world$|^localhost$/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
