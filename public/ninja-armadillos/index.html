<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ninja Armadillos</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#140d1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ninja Armadillos">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--bg:#140d1a;--pad:rgba(42,29,51,.8);--edge:rgba(246,231,200,.18);--hi:#e8842a;--ink:#f6e7c8;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;color:var(--ink);overscroll-behavior:none}
*{touch-action:none;-webkit-tap-highlight-color:transparent}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;outline:none}
#touch{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;gap:8px;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
 padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none;font-family:"Press Start 2P",monospace}
#touch.on{display:flex}
#zone{position:fixed;left:0;top:0;bottom:0;width:50%;display:none;z-index:1}
#zone.on{display:block}
#dpad{position:fixed;left:0;top:0;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:var(--pad);border:2px solid var(--edge);pointer-events:none;z-index:1;display:none;opacity:.35;transition:opacity .12s}
#dpad.on{display:block}#dpad.act{opacity:1;transition:none}
#dpad::before,#dpad::after{content:"";position:absolute;background:rgba(246,231,200,.12);border-radius:4px}
#dpad::before{left:50%;top:16px;bottom:16px;width:34px;margin-left:-17px}
#dpad::after{top:50%;left:16px;right:16px;height:34px;margin-top:-17px}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(246,231,200,.3)}
#touch{z-index:2}
.sp{flex:1 1 150px;min-width:0;max-width:150px}
.mid{display:flex;gap:8px;pointer-events:auto;margin-bottom:6px}
.s{padding:12px 14px;border-radius:8px;background:var(--pad);border:2px solid var(--edge);font-size:10px;color:var(--ink)}
.btns{display:grid;grid-template-columns:86px 86px;grid-template-rows:86px 86px;gap:12px;pointer-events:auto;flex:none}
.b{border-radius:50%;background:var(--pad);border:2px solid var(--edge);color:var(--ink);font-size:11px;display:flex;align-items:center;justify-content:center}
.b.on,.s.on,#pz.on{background:var(--hi);color:#140d1a}
.mid.hide{visibility:hidden;pointer-events:none}
#pz{position:fixed;left:0;top:0;width:40px;height:40px;border-radius:10px;background:var(--pad);border:2px solid var(--edge);display:none;z-index:3;pointer-events:auto;align-items:center;justify-content:center}
#pz.show{display:flex}#pz i{display:block;width:5px;height:15px;background:var(--ink);margin:0 3px;border-radius:1px;pointer-events:none}
#pz.on i{background:#140d1a}
</style>
</head>
<body>
<canvas id="c" width="384" height="216" tabindex="0" aria-label="Ninja Armadillos game screen"></canvas>
<div id="zone"></div>
<div id="pz" data-k="p" aria-label="Pause"><i></i><i></i></div>
<div id="dpad"><div id="knob"></div></div>
<div id="touch">
 <div class="sp"></div>
 <div class="mid"><div class="s" data-k="s">START</div></div>
 <div class="btns">
  <div class="b" data-k="e">ROLL</div><div class="b" data-k="c">SPEC</div>
  <div class="b" data-k="a">HIT</div><div class="b" data-k="b">JUMP</div>
 </div>
</div>
<script>
(()=>{
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=384,H=216,TOP=126,BOT=196,GRAV=0.24;
const FONT='"Press Start 2P", monospace';

/* ---------------- input (with buffering) ---------------- */
const K={},P={},BUF={a:0,b:0,c:0,e:0};
const KEYMAP={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',
 KeyJ:'a',KeyZ:'a',KeyK:'b',KeyX:'b',Space:'b',KeyL:'c',KeyC:'c',KeyI:'e',KeyV:'e',ShiftLeft:'e',ShiftRight:'e',Enter:'s',KeyP:'p',Escape:'p',KeyM:'m'};
function press(k){if(!K[k]){P[k]=true;if(k in BUF)BUF[k]=9}K[k]=true;initAudio()}
function release(k){K[k]=false}
function took(k){if(BUF[k]>0){BUF[k]=0;return true}return false}
function clearBuf(){BUF.a=BUF.b=BUF.c=BUF.e=0}
addEventListener('keydown',e=>{const k=KEYMAP[e.code];if(!k)return;e.preventDefault();press(k)});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(!k)return;e.preventDefault();release(k)});
addEventListener('blur',()=>{for(const k in K)K[k]=false});

/* ---------------- audio ---------------- */
let AC=null,master=null,muted=false,track=null,mNext=0,mStep=0;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.32;master.connect(AC.destination)}catch(e){AC=null}}
function tone(f,d,type,v,slide,when){if(!AC||muted)return;const t=AC.currentTime+(when||0);const o=AC.createOscillator(),gn=AC.createGain();
 o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
 gn.gain.setValueAtTime(v||0.2,t);gn.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+d+0.03)}
let nbuf=null;
function noise(d,v,freq){if(!AC||muted)return;if(!nbuf){nbuf=AC.createBuffer(1,AC.sampleRate*0.6,AC.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
 const s=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain(),t=AC.currentTime;s.buffer=nbuf;f.type='highpass';f.frequency.value=freq||800;
 gn.gain.setValueAtTime(v||0.3,t);gn.gain.exponentialRampToValueAtTime(0.001,t+d);s.connect(f);f.connect(gn);gn.connect(master);s.start(t);s.stop(t+d+0.02)}
const SFX={
 hit(){noise(.07,.32,1400);tone(150,.08,'square',.18,-70)},
 swing(){tone(700,.05,'triangle',.1,-350)},
 jump(){tone(260,.14,'square',.12,260)},
 special(){tone(180,.28,'sawtooth',.13,380);tone(360,.2,'square',.08,500,.05)},
 lasso(){tone(900,.18,'triangle',.12,-600)},
 hurt(){tone(240,.22,'sawtooth',.22,-160)},
 taco(){tone(660,.08,'square',.18);tone(990,.12,'square',.18,0,.08)},
 coin(){tone(1320,.06,'square',.13);tone(1760,.14,'square',.13,0,.06)},
 spit(){tone(520,.14,'sine',.2,-280)},
 thud(){tone(90,.1,'square',.15,-30)},
 roar(){tone(95,.7,'sawtooth',.3,-45);noise(.5,.18,300)},
 boom(){noise(.45,.35,120);tone(70,.45,'square',.25,-40)},
 smack(){noise(.3,.4,200);tone(110,.3,'square',.3,-60);tone(1400,.08,'square',.12,0,.02)},
 bell(){tone(1180,.12,'square',.1);tone(1180,.12,'square',.1,0,.16)},
 horn(){tone(220,.35,'sawtooth',.16);tone(277,.35,'sawtooth',.12)},
 select(){tone(880,.06,'square',.14)},
 roll(){tone(140,.22,'triangle',.18,90);noise(.18,.12,500)},
 squeak(){tone(1500,.07,'square',.1,400);tone(1800,.07,'square',.08,300,.08)},
 unlock(){[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.12,'square',.16,0,i*.08))},
 start(){[523,659,784,1047].forEach((f,i)=>tone(f,.13,'square',.18,0,i*.09))},
 clear(){[659,784,988,1319,988,1319].forEach((f,i)=>tone(f,.14,'square',.16,0,i*.11))},
 lose(){[392,349,311,262].forEach((f,i)=>tone(f,.25,'triangle',.22,0,i*.2))}
};
const midi=n=>440*Math.pow(2,(n-69)/12);
const TRACKS={
 main:{bpm:138,bass:[40,0,40,52,40,0,43,45,40,0,40,52,47,0,45,43],
  lead:[64,0,67,0,69,0,67,64,0,62,64,0,0,0,0,0,64,0,67,0,71,0,69,67,69,0,67,64,62,0,0,0]},
 boss:{bpm:156,bass:[38,38,50,38,41,41,53,41,36,36,48,36,40,40,52,43],
  lead:[74,0,72,0,70,0,69,0,70,72,0,0,65,0,0,0,74,0,72,0,77,0,76,74,72,0,70,0,69,0,0,0]}
};
function setTrack(n){const t=n?TRACKS[n]:null;if(t===track)return;track=t;mStep=0;mNext=0}
function musicTick(){if(!AC||muted||!track)return;const spd=60/track.bpm/2;
 if(mNext<AC.currentTime)mNext=AC.currentTime+0.02;
 while(mNext<AC.currentTime+0.12){const i=mStep%track.bass.length,w=mNext-AC.currentTime;
  const b=track.bass[i];if(b)tone(midi(b),spd*0.9,'triangle',0.2,0,w);
  const l=track.lead[mStep%track.lead.length];if(l)tone(midi(l),spd*0.85,'square',0.055,0,w);
  mNext+=spd;mStep++}}

/* ---------------- helpers ---------------- */
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v;
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function text(s,x,y,c,sz,al,sh){ctx.font=(sz||8)+'px '+FONT;ctx.textAlign=al||'left';ctx.textBaseline='top';
 if(sh!==null){ctx.fillStyle=sh||'#140d1a';ctx.fillText(s,Math.round(x)+1,Math.round(y)+1)}ctx.fillStyle=c||'#f6e7c8';ctx.fillText(s,Math.round(x),Math.round(y))}
function otext(s,x,y,c,sz,al){for(const [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1],[1,1],[2,2]])text(s,x+dx,y+dy,OUT,sz,al,null);text(s,x,y,c,sz,al,null)}
function shade(c,k){const n=parseInt(c.slice(1,7),16);k=k||0.7;const f=v=>clamp(Math.round(v*k),0,255);
 return'#'+((1<<24)|(f(n>>16)<<16)|(f(n>>8&255)<<8)|f(n&255)).toString(16).slice(1)}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=(a,b,c)=>{let h=(a*374761393+b*668265263+c*2147483647)|0;h=(h^(h>>>13))*1274126177|0;return(h>>>0)%1000/1000};

/* ---------------- chibi sprite system ---------------- */
const OUTC=[0x22,0x16,0x1c],OUT='#22161c';
let g=null,SC=1,FL=null;
function Px(x,y,w,h,c){g.fillStyle=FL||c;g.fillRect(Math.round(x*SC),Math.round(y*SC),Math.ceil(w*SC),Math.ceil(h*SC))}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function outlineCanvas(c,passes){const x=c.getContext('2d',{willReadFrequently:true}),w=c.width,h=c.height;let im;
 try{im=x.getImageData(0,0,w,h)}catch(e){return}if(!im||!im.data)return;const d=im.data;
 for(let p=0;p<passes;p++){const src=new Uint8ClampedArray(d);
  for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){const i=(y*w+xx)*4;if(src[i+3])continue;
   if((xx>0&&src[i-1])||(xx<w-1&&src[i+7])||(y>0&&src[i-w*4+3])||(y<h-1&&src[i+w*4+3])){d[i]=OUTC[0];d[i+1]=OUTC[1];d[i+2]=OUTC[2];d[i+3]=255}}}
 x.putImageData(im,0,0)}
const SPR=new Map();
function sprite(key,w,h,ox,oy,fn,passes,fl,sc){let s=SPR.get(key);if(s)return s;
 const c=mk(w,h),x=c.getContext('2d',{willReadFrequently:true});const pg=g,psc=SC,pfl=FL;g=x;SC=sc||1;FL=fl||null;
 x.save();x.translate(ox,oy);fn();x.restore();g=pg;SC=psc;FL=pfl;
 outlineCanvas(c,passes===undefined?2:passes);s={c,ox,oy};if(SPR.size>900)SPR.clear();SPR.set(key,s);return s}
function blit(s,x,y,f){x=Math.round(x);y=Math.round(y);
 if(f<0){ctx.save();ctx.translate(x,0);ctx.scale(-1,1);ctx.drawImage(s.c,-s.ox,y-s.oy);ctx.restore()}else ctx.drawImage(s.c,x-s.ox,y-s.oy)}

const S=['#e4d2b0','#b39f7e','#7c6a52'],SK=['#ffd9c2','#f0ae92','#c27b60'];
const CLAW='#4a3434',EYE='#140c10',WHITE='#fff8ec',NOSE='#5a2a2a',BROW='#4a3226',BLUSH='#ff8fa8',GOLD='#ffd23a';
const STAFF=['#c08a52','#8a5a30','#5e3b1c'];

function hatC(type,H0,H1,H2){
 if(type==='cowboy'){Px(-6,-39,23,3,H1);Px(-6,-39,23,1,H0);Px(-1,-46,13,7,H1);Px(0,-46,11,1,H0);Px(-1,-40,13,1,H2);Px(4,-46,3,1,H2)}
 else if(type==='cap'){Px(-1,-44,12,1,H1);Px(-3,-43,16,7,H1);Px(-1,-43,7,2,H0);Px(12,-38,9,3,H2);Px(12,-38,9,1,H1);Px(5,-45,3,1,H2)}
 else if(type==='hard'){Px(-1,-46,14,1,H1);Px(-3,-45,18,7,H1);Px(0,-44,5,2,'#fff6c8');Px(4,-46,2,8,H2);Px(-6,-38,24,2,H2);Px(-6,-38,24,1,H0)}
 else{Px(-2,-44,14,1,H1);Px(-4,-43,18,7,H1);Px(-1,-42,6,2,H0);for(let i=0;i<6;i++)Px(-3+i*3,-41,1,4,H2);Px(-4,-37,18,2,H2);Px(3,-48,6,4,'#f6e7c8');Px(4,-48,3,1,'#ffffff')}}
function armsC(h,pose,big){
 if(pose==='carry'){Px(-1,-26,4,9,SK[1]);Px(5,-26,4,9,SK[1]);Px(-2,-30,5,5,SK[2]);Px(5,-30,5,5,SK[2]);return}
 if(h.id==='juniper'){
  if(pose.startsWith('punch')){const len=h.reach+(pose==='punch3'?6:2),y=pose==='punch2'?-17:-15;
   Px(2,y,len,3,STAFF[1]);Px(2,y,len,1,STAFF[0]);Px(2+len,y-2,4,7,STAFF[2]);Px(4,y-1,5,5,SK[2])}
  else if(pose==='jump'||pose==='kick'){Px(-7,-32,3,26,STAFF[1]);Px(-7,-32,1,26,STAFF[0]);Px(4,-16,5,4,SK[2])}
  else if(pose==='hurt'){Px(-10,-36,3,32,STAFF[1]);Px(-5,-18,4,5,SK[2])}
  else{Px(10,-40,3,40,STAFF[1]);Px(10,-40,1,40,STAFF[0]);Px(9,-41,5,3,STAFF[2]);Px(7,-17,5,5,SK[2])}return}
 if(pose==='punch1'){Px(5,-15,9,4,SK[1]);Px(13,-17,7+big,7+big,SK[2]);Px(14,-17,5,2,SK[1])}
 else if(pose==='punch2'){Px(5,-17,10,4,SK[1]);Px(14,-19,7+big,7+big,SK[2]);Px(15,-19,5,2,SK[1])}
 else if(pose==='punch3'){Px(5,-20,5,6,SK[1]);Px(6,-28,7+big,8+big,SK[2]);Px(7,-28,5,2,SK[1])}
 else if(pose==='jump'){Px(5,-17,5,4,SK[1]);Px(9,-18,4,5,SK[2])}
 else if(pose==='kick'||pose==='hurt'){Px(-4,-18,4,5,SK[2])}
 else{Px(5,-14,4,5,SK[1]);Px(5,-10,5+big,3+big,SK[2])}}
function ballDraw(h,fr){const r=13,cy=-13,C=h.id==='rat'?['#b8b4c4','#8e8a9c','#5f5b6e']:S;
 if(h.id==='rat'){Px(-22,-6,10,2,'#f2a0b4');Px(-24,-9,3,4,'#f2a0b4')}
 for(let y=-r;y<=r;y++){const w=Math.round(Math.sqrt(r*r-y*y));Px(-w,cy+y,w*2,1,C[1])}
 for(let k=0;k<5;k++){const bx=((k*6+fr*3)%30)-15;
  for(let y=-r+1;y<r;y++){const w=Math.sqrt(r*r-y*y);if(bx>-w+1&&bx<w-1)Px(bx,cy+y,1,1,C[2])}}
 for(let y=-r+2;y<-2;y++){const w=Math.sqrt(r*r-y*y);Px(-w+2,cy+y,3,1,C[0])}
 Px(-3,cy+r-3,7,2,h.vest);Px(-r+2,cy-1,2,3,shade(h.vest,0.7))}
function ratDraw(h,pose,fr){const F0='#b8b4c4',F1='#8e8a9c',F2='#5f5b6e',PK='#f2a0b4',PK2='#c9708a',WH='#e8e4f0',B1=h.hatC,B2=shade(h.hatC,0.65);
 if(pose==='down'){
  Px(-30,-4,12,2,PK);Px(-19,-6,4,2,PK);Px(-15,-11,19,10,F1);Px(-14,-11,16,2,F0);
  Px(3,-15,14,14,F1);Px(4,-15,8,2,F0);Px(1,-20,6,6,F1);Px(2,-19,4,4,PK);Px(14,-10,7,5,F1);Px(20,-9,2,2,PK);
  Px(7,-10,5,1,EYE);Px(8,-12,1,1,EYE);Px(11,-12,1,1,EYE);Px(3,-15,12,2,B1);return}
 const moving=pose==='walk'||pose==='carry',wk=moving?[0,2,0,-2][fr%4]:0;
 const bob=((moving||pose==='idle')&&fr%2)?-1:0,lean=pose==='hurt'?-2:0;
 if(pose==='jump'){Px(-5,-9,5,5,F2);Px(2,-9,5,5,F1);Px(-6,-5,6,2,PK);Px(2,-5,6,2,PK)}
 else if(pose==='kick'){Px(-5,-9,5,5,F2);Px(3,-11,12,4,F1);Px(3,-11,12,1,F0);Px(14,-12,4,5,PK)}
 else{Px(-5+wk,-6,5,6,F2);Px(2-wk,-6,5,6,F1);Px(-6+wk,-2,6,2,PK);Px(2-wk,-2,6,2,PK)}
 g.save();g.translate(lean,bob);
 const tw=fr%2;Px(-12,-9,4,2,PK);Px(-16,-11+tw,4,2,PK);Px(-20,-13+tw,4,2,PK);Px(-23,-16,3,3,PK);Px(-24,-19-tw,2,3,PK2);
 Px(-9,-19,13,13,F1);Px(-8,-19,10,2,F0);Px(-9,-7,13,1,F2);
 Px(1,-17,6,10,WH);Px(-1,-20,9,3,B1);Px(-1,-20,9,1,shade(B1,1.3));
 Px(-5,-47,10,10,F2);Px(-3,-45,6,6,PK2);
 Px(-3,-37,16,18,F1);Px(-4,-34,18,13,F1);Px(-2,-37,9,2,F0);Px(-4,-22,18,2,F2);
 Px(5,-48,10,10,F1);Px(7,-46,6,6,PK);
 Px(8,-29,9,7,F1);Px(15,-27,4,5,F1);Px(8,-23,10,1,F2);Px(18,-27,3,3,PK2);
 Px(13,-25,9,1,WH);Px(13,-22,8,1,WH);Px(12,-24,1,1,F2);
 if(pose==='hurt'){Px(4,-31,6,2,EYE);Px(5,-32,1,1,EYE);Px(10,-23,3,2,'#7a1b10')}
 else if(pose==='vic'){Px(4,-28,1,1,EYE);Px(5,-29,1,1,EYE);Px(6,-30,2,1,EYE);Px(8,-29,1,1,EYE);Px(9,-28,1,1,EYE);Px(3,-24,3,1,BLUSH);Px(11,-22,5,3,'#7a1b10');Px(12,-22,3,1,'#ff8fa8');Px(13,-21,2,2,WHITE)}
 else{Px(4,-32,6,6,WHITE);Px(6,-31,4,5,EYE);Px(7,-30,2,2,'#ffffff');
  if(pose.startsWith('punch')||pose==='kick'||pose==='carry')Px(3,-34,7,1,F2);Px(3,-24,3,1,BLUSH);Px(13,-21,2,2,WHITE)}

function dropWpn(){const p=G.p;if(!p.wpn)return;G.picks.push({x:p.x,y:p.y,z:6,vz:2,kind:p.wpn.k,uses:p.wpn.uses,t:0});p.wpn=null}
function weaponNear(){const p=G.p;return G.picks.find(k=>WPN[k.kind]&&k.z===0&&Math.abs(k.x-p.x)<20&&Math.abs(k.y-p.y)<10)}
function startAttack(chain){const p=G.p;
 if(p.wpn&&WPN[p.wpn.k].ranged){p.state='throw';p.t=0;G.stars.push({x:p.x+p.f*10,y:p.y,z:18,vx:p.f*5.5,t:0});SFX.swing();useWpn();return}if(chain&&p.combo<3)p.combo++;else if(p.comboT>0)p.combo=p.combo%3+1;else p.combo=1;
 const fast=p.wpn&&WPN[p.wpn.k].fast;p.state='attack';p.t=0;p.dur=p.combo===3?(fast?16:22):(fast?9:13);SFX.swing()}
function startSpecial(){const p=G.p;if(p.hp>8)p.hp-=5;p.state='special';p.t=0;p.set=new Set();p.z=0;p.lassoE=null;p.lassoLen=0;p.lassoHit=false;SFX.special()}
function startRoll(){const p=G.p,ix=(K.r?1:0)-(K.l?1:0);if(ix)p.f=ix;p.z=0;p.ch=0;p.rpw=0;
 if(!K.e){launchRoll();return}p.state='rollc';p.t=0}
function launchRoll(){const p=G.p;p.state='roll';p.t=0;p.set=new Set();p.rollCd=p.h.id==='rat'?28:40;
 if(p.rpw>=1){G.shake=Math.max(G.shake,3);ring(p.x,p.y,30,'#ffd23a')}
 if(p.h.id==='rat')SFX.squeak();else SFX.roll();dust(p.x,p.y)}
function rollChargeStep(){const p=G.p,ix=(K.r?1:0)-(K.l?1:0);p.t++;p.ch++;if(ix)p.f=ix;
 p.rpw=Math.min(1,p.ch/45);
 if(p.t%4===0)dust(p.x-p.f*6,p.y);
 if(p.t%6===0)tone(200+p.rpw*500,.05,'square',.06);
 if(p.rpw>=1&&p.t%3===0)part(p.x+rnd(-12,12),p.y,rnd(4,24),rnd(-.5,.5),0,rnd(.5,1.5),p.t%2?'#ffd23a':'#fff6c8',14,3,0.05);
 if(p.ch===45)SFX.coin();
 if(!K.e||p.ch>=80)launchRoll()}
function rollStep(){const p=G.p,h=p.h,rat=h.id==='rat',pw=p.rpw||0,dur=(rat?22:32)+Math.round(22*pw),iy=(K.d?1:0)-(K.u?1:0);p.t++;
 const sp=(rat?3.6:3.1)*(1+0.7*pw)*Math.min(1.25,Math.max(0.9,h.spd))*(p.t>dur-8?(dur-p.t)/8+0.15:1);
 if(pw>=1&&p.t%2===0)part(p.x-p.f*10,p.y,rnd(4,20),-p.f*rnd(.5,1.5),0,rnd(0,1),p.t%4?'#ffd23a':'#ff8a3a',12,3,0.02);
 p.x+=p.f*sp;p.y+=iy*1.1;if(p.t%3===0)dust(p.x-p.f*8,p.y);
 if(p.t%10===1)p.set=new Set();
 strikeArea({reach:rat?10:12,dmg:(rat?7:10)*h.pow*(1+pw),knock:true,set:p.set});
 if(took('b')){p.state='jump';p.vz=4.6;p.z=0.01;p.kick=false;p.jvx=p.f*h.spd*2;SFX.jump();return}
 if(p.t>=dur){p.state='idle'}}
function ratPack(){const p=G.p;for(let i=0;i<3;i++){const y=clamp(p.y+(i-1)*16,TOP,BOT);
 G.minis.push({x:p.x-p.f*(14+i*10),y,z:0,vx:p.f*(4.2+i*0.3),t:-i*5,set:new Set(),f:p.f})}SFX.squeak()}
function updMinis(){for(const m of G.minis){m.t++;if(m.t<0)continue;m.x+=m.vx;
  for(const e of G.en){if(NOHIT.has(e.state)||e.dead||e.dying||m.set.has(e))continue;
   if(Math.abs(e.x-m.x)<10+4*e.T.s&&Math.abs(e.y-m.y)<10+2*e.T.s){m.set.add(e);hurtEnemy(e,9*G.p.h.pow,!e.T.boss,m.f,true);G.hitstop=2}}
  for(const pr of G.props)if(!pr.broken&&Math.abs(pr.x-m.x)<10&&Math.abs(pr.y-m.y)<10)breakProp(pr)}
 G.minis=G.minis.filter(m=>m.t<110&&m.x>G.camX-30&&m.x<G.camX+W+30)}
function strikeArea(o){const p=G.p;let hit=false;
 for(const e of G.en){if(NOHIT.has(e.state)||e.dead)continue;if(o.set&&o.set.has(e))continue;
  const s=e.T.s,dx=(e.x-p.x)*p.f,dy=Math.abs(e.y-p.y);
  const inX=o.radius?Math.abs(e.x-p.x)<o.radius+6*s:(dx>-6&&dx<o.reach+6+4*s);
  const dyLim=o.depth||(10+3*s);
  if(inX&&dy<dyLim&&Math.abs(p.z-e.z)<(o.zr||24)){hurtEnemy(e,o.dmg,o.knock,Math.sign(e.x-p.x)||p.f,true);if(o.set)o.set.add(e);hit=true}}
 for(const pr of G.props){if(pr.broken)continue;const dx=(pr.x-p.x)*p.f,dy=Math.abs(pr.y-p.y);
  const inX=o.radius?Math.abs(pr.x-p.x)<o.radius+8:(dx>-6&&dx<o.reach+12);if(inX&&dy<(o.depth||12)&&p.z<20){breakProp(pr);hit=true}}
 if(hit){G.shake=Math.max(G.shake,o.knock?4:2);G.hitstop=o.knock?5:3}return hit}
function hurtEnemy(e,dmg,knock,dir,fromPlayer){const T=e.T;
 if(T.ferret&&!T.name&&fromPlayer&&!knock&&e.state==='walk'&&Math.random()<0.25){
  for(let i=0;i<9;i++)part(e.x+rnd(-8,8),e.y,rnd(2,26),rnd(-1,1),rnd(-.2,.2),rnd(0,1),i%2?'#ffffff':'#d9d2e6',22,4,-0.03);
  e.x=clamp(e.x+dir*30,G.camX+14,G.camX+W-14);e.state='stun';e.t=0;e.stunT=8;e.vx=0;floater(e.x,e.y,'POOF','#ffffff');SFX.swing();return}
 if(e.state==='dizzy')dmg*=1.5;dmg=Math.round(dmg);e.hp-=dmg;e.flash=6;e.hbT=150;SFX.hit();sparks(e.x-dir*3,e.y,e.z+16*T.ds);G.score+=10;
 if(fromPlayer)addCombo();
 if(T.boss){if(e.hp<=0){bossDie(e);return}if(e.state==='walk'||e.state==='windup'){e.state='stun';e.t=0;e.stunT=7;e.vx=dir*0.4}return}
 if(T.name){if(e.hp<=0&&!e.dying){e.dying=true;e.state='down';e.t=0;e.vx=dir*2;e.vz=3;e.z=0.1;e.flying=false;G.score+=T.score;floater(e.x,e.y,T.score);G.shake=6;SFX.boom();G.picks.push({x:e.x,y:e.y,z:4,vz:2.4,kind:['bo','chucks','stars'][(Math.random()*3)|0],t:0})}
  else if(e.state==='walk'){e.state='stun';e.t=0;e.stunT=6;e.vx=dir*0.4}return}
 if(knock||e.hp<=0){e.state='down';e.t=0;e.vx=dir*(knock?2.8:1.6);e.vz=2.6;e.z=0.1;e.flying=!!knock}
 else{e.state='stun';e.t=0;e.stunT=14;e.vx=dir*0.8}
 if(e.hp<=0&&!e.dying){e.dying=true;G.score+=T.score;floater(e.x,e.y,T.score)}}
function hurtHeld(e,dmg){const T=e.T;e.hp-=dmg;e.flash=6;e.hbT=150;SFX.hit();sparks(e.x,e.y,16,'#fff6c8');G.score+=10;addCombo();G.hitstop=3;
 if(e.hp<=0&&!e.dying){e.dying=true;G.score+=T.score;floater(e.x,e.y,T.score)}}
function bossDie(e){e.hp=0;e.dying=true;e.state='dead';e.t=0;G.score+=e.T.score;floater(e.x,e.y,e.T.score);SFX.roar();G.shake=6;
 for(const o of G.en)if(o!==e&&!o.dying){o.dying=true;o.hp=0;o.state='down';o.t=0;o.vz=2;o.z=0.1;o.vx=rnd(-2,2)}G.proj=[];G.embers=[]}
function dropHeld(){const p=G.p;if(p.held){const e=p.held;if(e.state==='held'){e.state='stun';e.t=0;e.stunT=20}p.held=null}
 if(p.carry){debris(p.x,p.y,p.carry==='can'?'#8fa3ab':'#c0503f');G.picks.push({x:p.x+p.f*10,y:p.y,z:4,vz:2,kind:'taco',t:0});p.carry=null}
 if(p.lassoE){const e=p.lassoE;if(e.state==='lassoed'){e.state='stun';e.t=0;e.stunT=20}p.lassoE=null}}
function hurtPlayer(dmg,dir){const p=G.p;if(p.inv>0||p.state==='special'||p.state==='roll'||p.state==='rollc'||p.state==='down'||G.winT>0||G.clearT>0)return;
 dropHeld();p.hp-=dmg;p.flash=8;SFX.hurt();G.shake=Math.max(G.shake,3);sparks(p.x,p.y,p.z+18,'#ffffff');
 if(p.hp<=0){dropWpn();p.hp=0;p.dying=true;p.state='down';p.t=0;p.vx=dir*2;p.vz=3;p.z=0.1}
 else if(dmg>=14){dropWpn();p.state='down';p.t=0;p.vx=dir*2;p.vz=2.6;p.z=0.1}
 else{p.state='hurt';p.t=0;p.vx=dir*1.4}}
function breakProp(pr){pr.broken=true;SFX.hit();
 debris(pr.x,pr.y,{crate:'#c4813f',can:'#8fa3ab',cactus:'#5cb04a',barrel:'#c0503f'}[pr.kind]);
 G.picks.push({x:pr.x,y:pr.y,z:4,vz:2.4,kind:pr.oneup?'oneup':pr.weap?pr.weap:Math.random()<0.55?'taco':'coin',t:0})}
function spawnEnemy(type){const T=ETYPES[type],side=T.boss?1:(Math.random()<0.5?-1:1);
 const e={id:++G.nid,type,T,x:side<0?G.camX-26:G.camX+W+26,y:rnd(TOP+8,BOT-8),z:0,vz:0,vx:0,f:-side,hp:T.hp,state:'walk',t:0,cd:40+rnd(0,40),stunT:0,flash:0,hbT:0,anim:(Math.random()*60)|0,dying:false,dead:false,flying:false,bt:0};
 if(T.boss){e.y=(TOP+BOT)/2;SFX.roar();setTrack('boss');G.shake=5}
 else if(T.drop){const p=G.p;e.x=clamp(p.x+rnd(-70,70),G.camX+30,G.camX+W-30);e.y=clamp(p.y+rnd(-14,14),TOP+4,BOT-4);e.z=130;e.state='drop';e.t=0;e.f=p.x>e.x?1:-1;
  for(let i=0;i<8;i++)part(e.x+rnd(-14,14),e.y,rnd(100,124),rnd(-1,1),0,rnd(-1,0.5),i%2?'#3fae4a':'#5cd05a',40,3,0.04);SFX.swing()}
 else if(!T.name&&G.mh.length){const vis=G.mh.filter(m=>m.x>G.camX+40&&m.x<G.camX+W-40&&Math.abs(m.x-G.p.x)>44&&m.open<=0);
  if(vis.length&&Math.random()<0.45){const m=vis[(Math.random()*vis.length)|0];e.x=m.x;e.y=m.y;e.state='rise';e.t=0;m.open=150;SFX.thud();
   for(let i=0;i<3;i++)part(m.x+rnd(-6,6),m.y,2,rnd(-1,1),0,rnd(1.5,2.5),'#5e5560',22,3,0.15)}}
 if(T.name&&!G.seen[e.type]){G.seen[e.type]=1;G.introT=150;G.introE=e.type;if(!T.boss)SFX.roar();clearBuf()}
 G.en.push(e);return e}
function shoot(e,vy,big){G.proj.push({x:e.x+e.f*14*e.T.ds,y:e.y,z:big?34:16,vx:e.f*(big?2.5:2.2),vy:vy||0,t:0,dmg:big?13:e.T.dmg,big:!!big,star:!!e.T.star});SFX.spit()}

/* ---------------- grab / throw ---------------- */
function startGrab(e){const p=G.p;p.state='grab';p.t=0;p.held=e;p.knees=0;p.kneeT=0;e.state='held';e.vx=0;e.z=0;e.f=-p.f;e.x=p.x+p.f*14;e.y=p.y;SFX.thud()}
function throwHeld(mode){const p=G.p,e=p.held;p.held=null;if(!e)return;p.state='throw';p.t=0;SFX.swing();
 if(mode==='screen'){e.state='screen';e.t=0;e.sx=e.x-G.camX;e.sy=e.y-18;hurtHeld(e,24);G.hitstop=0}
 else{const dir=mode==='back'?-p.f:p.f;if(mode==='back')p.f=-p.f;e.state='down';e.t=0;e.flying=true;e.vx=dir*4.2;e.vz=3;e.z=1;e.x=p.x+dir*10;hurtHeld(e,mode==='back'?16:12)}}

/* ---------------- player ---------------- */
function specialStep(){const p=G.p,h=p.h;p.t++;
 if(h.id==='dusty'){
  if(!p.lassoE&&!p.lassoHit&&p.t<=14){p.lassoLen=Math.min(104,p.t*8);if(p.t===1)SFX.lasso();
   for(const e of G.en){if(NOHIT.has(e.state)||e.dying)continue;const dx=(e.x-p.x)*p.f;
    if(dx>4&&dx<p.lassoLen+6&&Math.abs(e.y-p.y)<12){
     if(e.T.boss||e.T.name){hurtEnemy(e,12,false,p.f,true);p.lassoLen=dx;p.lassoHit=true}
     else{p.lassoE=e;e.state='lassoed';e.f=-p.f;e.flash=6;SFX.hit();addCombo()}break}}}
  else if(!p.lassoE)p.lassoLen=Math.max(0,p.lassoLen-10);
  if(p.lassoE){const e=p.lassoE;if(e.state!=='lassoed'||e.dead){p.lassoE=null}
   else{const tx=p.x+p.f*14;e.x+=(tx-e.x)*0.25;e.y+=(p.y-e.y)*0.3;p.lassoLen=Math.abs(e.x-p.x);if(Math.abs(e.x-tx)<2.5){p.lassoE=null;startGrab(e);return}}}
  if(p.t>=34&&!p.lassoE)p.state='idle'}
 else if(h.id==='pepper'){
  p.x+=p.f*2.7;if(p.t%4===1){p.set=new Set();SFX.swing()}if(p.t%3===0)dust(p.x-p.f*6,p.y);
  strikeArea({reach:20,dmg:6,knock:p.t>=22,set:p.set});if(p.t>=26)p.state='idle'}
 else if(h.id==='boulder'){
  if(p.t<14)p.z=Math.sin(p.t/14*Math.PI)*18;
  if(p.t===14){p.z=0;G.shake=7;SFX.boom();ring(p.x,p.y,66,'#ffd23a');ring(p.x,p.y,44,'#fff0d2');
   strikeArea({radius:62,dmg:18*h.pow/1.5,knock:true,depth:22,zr:30})}
  if(p.t>=32)p.state='idle'}
 else if(h.id==='rat'){if(p.t===6)ratPack();if(p.t>=20)p.state='idle'}
 else{
  if(p.t%8===1){p.set=new Set();SFX.swing()}if(p.t%4===0)p.f=-p.f;
  strikeArea({radius:28,dmg:7,knock:p.t>=24,depth:14,set:p.set});if(p.t>=32)p.state='idle'}}
function updPlayer(){const p=G.p,h=p.h;if(p.inv>0)p.inv--;if(p.rollCd>0)p.rollCd--;updMinis();if(p.comboT>0)p.comboT--;if(p.flash>0)p.flash--;if(p.kneeT>0)p.kneeT--;p.anim++;
 for(const k in BUF)if(BUF[k]>0)BUF[k]--;
 const ix=(K.r?1:0)-(K.l?1:0),iy=(K.d?1:0)-(K.u?1:0);
 switch(p.state){
  case 'idle':case 'walk':{
   p.x+=ix*h.spd*1.25;p.y+=iy*h.spd*0.85;if(ix)p.f=ix;p.state=(ix||iy)?'walk':'idle';
   if(ix){const e=G.en.find(o=>!o.T.boss&&!o.T.name&&(o.state==='walk'||o.state==='stun')&&!o.dying&&o.z===0&&(o.x-p.x)*ix>-2&&(o.x-p.x)*ix<16&&Math.abs(o.y-p.y)<6);
    if(e){if((e.x-p.x)*ix<10)p.x=e.x-ix*10;if(++p.grabT>=7){p.grabT=0;startGrab(e);break}}else p.grabT=0}else p.grabT=0;
   const wk=took('a')?(weaponNear()||true):null;
   if(wk&&wk!==true){const old=p.wpn;p.wpn={k:wk.kind,uses:wk.uses||WPN[wk.kind].uses};wk.got=true;SFX.coin();floater(p.x,p.y-10,WPN[wk.kind].name,'#ffd23a');
    if(old)G.picks.push({x:p.x-p.f*12,y:p.y,z:4,vz:2,kind:old.k,uses:old.uses,t:0})}
   else if(wk){const pr=G.props.find(o=>!o.broken&&(o.kind==='can'||o.kind==='barrel')&&(o.x-p.x)*p.f>-4&&(o.x-p.x)*p.f<18&&Math.abs(o.y-p.y)<9);
    if(pr){pr.broken=true;p.state='carry';p.carry=pr.kind;SFX.jump()}else startAttack(false)}
   else if(took('b')){p.state='jump';p.vz=4.3;p.z=0.01;p.kick=false;p.jvx=ix*h.spd*1.35;SFX.jump()}
   else if(took('c'))startSpecial();
   else if(p.rollCd<=0&&took('e'))startRoll();
   break}
  case 'attack':{p.t++;const W0=p.wpn?WPN[p.wpn.k]:null,act=W0&&W0.fast?(p.combo===3?6:4):(p.combo===3?8:5);
   if(p.t===act){const hit=strikeArea({reach:h.reach+(W0?W0.reach||0:0),dmg:(p.combo===3?16:9)*h.pow*(W0?W0.pow||1:1),knock:p.combo===3});if(hit&&W0)useWpn()}
   if(p.t>7&&p.combo<3&&took('a')){startAttack(true);break}
   if(took('c')){startSpecial();break}
   if(p.t>4&&p.rollCd<=0&&took('e')){startRoll();break}
   if(p.t>=p.dur){p.state='idle';p.comboT=16}break}
  case 'jump':
   p.x+=p.jvx;p.y+=iy*0.5;p.z+=p.vz;p.vz-=GRAV;
   if(!p.kick&&took('a')){p.kick=true;p.set=new Set();SFX.swing()}
   if(p.kick)strikeArea({reach:h.reach+2,dmg:13*h.pow,knock:true,set:p.set});
   if(p.z<=0){p.z=0;p.vz=0;p.state='idle';p.kick=false;dust(p.x,p.y)}break;
  case 'special':specialStep();break;
  case 'roll':rollStep();break;
  case 'rollc':rollChargeStep();break;
  case 'grab':{p.t++;const e=p.held;
   if(!e||e.dead||e.state!=='held'){p.held=null;p.state='idle';break}
   e.x=p.x+p.f*14;e.y=p.y;e.z=0;
   if(took('a')){if(ix===-p.f)throwHeld('back');
    else{p.kneeT=10;p.knees++;hurtHeld(e,7);if(e.hp<=0||p.knees>=3)throwHeld('fwd')}}
   else if(took('b'))throwHeld('screen');
   else if(p.t>150){e.state='stun';e.t=0;e.stunT=10;p.held=null;p.state='idle'}
   break}
  case 'carry':
   p.x+=ix*h.spd;p.y+=iy*h.spd*0.75;if(ix)p.f=ix;
   if(took('a')){G.thrown.push({x:p.x+p.f*8,y:p.y,z:30,vx:p.f*4.6,kind:p.carry,t:0});p.carry=null;p.state='throw';p.t=0;SFX.swing()}
   break;
  case 'throw':p.t++;if(p.t>=14)p.state='idle';break;
  case 'hurt':p.t++;p.x+=p.vx;p.vx*=0.85;if(p.t>=16)p.state='idle';break;
  case 'down':
   p.x+=p.vx;
   if(p.z>0||p.vz>0){p.z+=p.vz;p.vz-=GRAV;if(p.z<=0){p.z=0;p.vz=0;dust(p.x,p.y);SFX.thud()}}else{p.vx*=0.7;p.t++}
   if(p.t>55){if(p.dying){G.lives--;if(G.lives<=0){gameOver();return}p.hp=100;p.dying=false;p.inv=150;sparks(p.x,p.y,16,'#9fe3ff')}else p.inv=60;p.state='idle'}
   break;
 }
 if(p.state!=='jump'&&p.state!=='down'&&p.state!=='special'&&p.z>0)p.z=Math.max(0,p.z-3);
 p.y=clamp(p.y,TOP,BOT);p.x=clamp(p.x,G.camX+10,G.camX+W-10)}
function gameOver(){G.mode='over';G.ct=240;saveHi();setTrack(null);SFX.lose()}

/* ---------------- enemies ---------------- */
function crash(e){for(const o of G.en){if(o===e||o.state==='down'||NOHIT.has(o.state)||o.dying||o.T.boss)continue;

function approach(e,tx,ty,spd){const dx=tx-e.x,dy=ty-e.y;

 if(G.combo>=2){const sz=G.comboPop>4?16:8,c=G.combo>=10?'#ff6a2a':G.combo>=5?'#7cf06a':'#ffd23a';
  otext(String(G.combo),W-8,30,c,sz===16?16:16,'right');otext('HITS',W-8,48,c,8,'right')}
 if(G.goT>0&&(G.goT>>4)%2){text('GO',W-46,92,'#ffd23a',16,'left',OUT);ctx.fillStyle=OUT;ctx.beginPath();ctx.moveTo(W-5,100);ctx.lineTo(W-15,89);ctx.lineTo(W-15,111);ctx.fill();
  ctx.fillStyle='#ffd23a';ctx.beginPath();ctx.moveTo(W-8,100);ctx.lineTo(W-14,92);ctx.lineTo(W-14,108);ctx.fill()}
 if(p.state==='grab'&&(G.t>>4)%2)text('J KNEE  <J THROW  K SLAM',W/2,30,'#ffffff',8,'center',OUT);
 if(muted)text('MUTE',W/2+20,13,'#b9a6c9',8,'center')}

function drawBlind(){const a=Math.min(1,G.blind/22);ctx.globalAlpha=a*0.72;rect(0,22,W,H-22,'#d9d2e6');
 for(let i=0;i<26;i++){const x=(i*61+G.t*(i%2?0.4:-0.3))%(W+80)-40,y=40+((i*37)%160);ctx.globalAlpha=a*0.9;ell(x,y,26+(i%3)*8,14+(i%2)*6,i%3?'#e9e2f0':'#c9c0d6')}
 ctx.globalAlpha=1}
function drawIntro(){const T=ETYPES[G.introE],t=150-G.introT,ease=k=>1-Math.pow(1-Math.min(1,k),3);
 const fade=G.introT<16?G.introT/16:1;ctx.globalAlpha=0.55*fade;rect(0,0,W,H,'#0a0610');ctx.globalAlpha=1;
 const bx=Math.round(-W+W*ease(t/14))+(G.introT<16?Math.round(-(16-G.introT)*26):0);
 ctx.save();ctx.translate(bx,0);
 rect(0,58,W,100,OUT);rect(0,61,W,94,'#2a1d33');rect(0,61,W,3,'#e8842a');rect(0,152,W,3,'#e8842a');
 for(let i=0;i<14;i++)rect(((i*31+t*3)%(W+40))-20,66+((i*17)%80),18,1,'rgba(232,132,42,0.25)');
 const k=ETYPES[G.introE].boss?1.15:T.ds*0.95;ctx.save();ctx.translate(96,148);ctx.scale(2/k*0.9,2/k*0.9);
 blit(antSprite(G.introE,(t>>3)%2?'wind':'strike',0,t<20&&(t>>1)%2),0,0,1);ctx.restore();
 const tx=Math.round(196+Math.max(0,40-t*3));
 if(t>10)text('BOSS',tx,74,'#ff6a2a',8,'left');
 if(t>16){for(const [dx,dy] of [[-2,0],[2,0],[0,-2],[0,2],[2,2]])text(T.name,tx+dx,90+dy,OUT,T.name.length>10?16:16,'left',null);text(T.name,tx,90,'#ffd23a',16,'left',null)}
 if(t>26)text(T.title,tx,116,'#f6e7c8',8,'left');
 if(t>40&&(t>>3)%2)text('GET READY!',tx,134,'#7cf06a',8,'left');
 ctx.restore()}
function banner(a,b,c,o){o=o||0;rect(0,76+o,W,56,OUT);rect(0,78+o,W,52,'#2a1d33');rect(0,78+o,W,2,'#e8842a');rect(0,128+o,W,2,'#e8842a');
 text(a,W/2,86+o,'#ffd23a',16,'center','#7a1b10');if(b)text(b,W/2,108+o,'#f6e7c8',8,'center');if(c)text(c,W/2,118+o,'#b9a6c9',8,'center')}

function pauseMenu(){rect(0,0,W,H,'rgba(20,13,26,0.55)');rect(102,58,180,100,OUT);rect(104,60,176,96,'#2a1d33');rect(104,60,176,2,'#e8842a');rect(104,154,176,2,'#e8842a');
 text('PAUSED',W/2,70,'#ffd23a',16,'center','#7a1b10');
 ['RESUME','QUIT TO MENU'].forEach((o,i)=>{const on=G.pm===i,y=100+i*18;if(on)text('>',W/2-62,y,'#e8842a',8,'left');text(o,W/2,y,on?'#ffffff':'#b9a6c9',8,'center')});
 text(touchOn?'HIT TO SELECT':'M TOGGLES SOUND',W/2,140,'#7d6a8c',8,'center',null)}
function drawTitle(){const st=STAGES[0],cam=Math.round(G.tcam%(st.len-W));drawBG(st,cam);
 rect(0,0,W,H,'rgba(20,13,26,0.5)');
 const bob=Math.round(Math.sin(G.t*0.05)*2);
 for(const [s,y,c,z] of [['NINJA',14,'#ffd23a',16],['ARMADILLOS',36,'#ff8a3a',24]]){
  for(const [dx,dy] of [[-2,0],[2,0],[0,-2],[0,2],[2,2],[3,3]])text(s,W/2+dx,y+bob+dy,OUT,z,'center',null);text(s,W/2,y+bob,c,z,'center',null)}
 otext('FOUR DILLOS VS. THE FIRE ANT GANG',W/2,80,'#ffffff',8,'center');
 HEROES.slice(0,4).forEach((h,i)=>blit(heroSprite(h,'idle',(G.t>>4)%2,false),104+i*58,194,i<2?1:-1));
 blit(antSprite('ant','walk',(G.t>>3)%4,false),W-22,196,-1);blit(antSprite('ant','walk',((G.t>>3)+2)%4,false),22,196,1);
 if((G.t>>5)%2)otext(touchOn?'TAP START':'PRESS ENTER',W/2,96,'#ffffff',8,'center');
 if(!touchOn)otext('WASD MOVE J HIT K JUMP L SPEC I ROLL',W/2,112,'#ffe9d2',8,'center');
 otext('ROLL UP TO BOWL ANTS OVER',W/2,123,'#ffe9d2',8,'center');
 otext('HIT CANS & BARRELS TO PICK THEM UP',W/2,134,'#ffe9d2',8,'center');
 otext('HI '+String(hi).padStart(7,'0'),W/2,206,'#ffd23a',8,'center')}

function drawSelect(){drawBG(STAGES[0],0);rect(0,0,W,H,'rgba(20,13,26,0.7)');
 otext('CHOOSE YOUR FIGHTER',W/2,8,'#ffd23a',8,'center');
 HEROES.forEach((h,i)=>{const x=6+i*75,y=24,on=G.sel===i,lock=h.secret&&!ratOn,cw=72;
  rect(x-2,y-2,cw+4,168,OUT);rect(x,y,cw,164,on?'#4a3458':'#2a1d33');rect(x,y,cw,3,on?'#ffd23a':'#5a4468');
  ctx.save();ctx.beginPath();ctx.rect(x,y,cw,164);ctx.clip();
  if(lock){ctx.save();ctx.translate(x+30,y+98);ctx.scale(2,2);ctx.globalAlpha=0.9;blit(sprite('lockrat',70,57,24,53,()=>ratDraw(h,'idle',0),2,'#140d1a'),0,0,1);ctx.restore();
   otext('?????',x+cw/2,y+102,'#7d6a8c',8,'center');text('BEAT THE',x+cw/2,y+125,'#b9a6c9',8,'center',null);text('GAME TO',x+cw/2,y+135,'#b9a6c9',8,'center',null);text('UNLOCK',x+cw/2,y+145,'#b9a6c9',8,'center',null);ctx.restore();return}
  const pose=on?['idle','punch1','punch2','punch3'][(G.t>>3)%4]:'idle';
  ctx.save();ctx.translate(x+30,y+98);ctx.scale(2,2);blit(heroSprite(h,pose,(G.t>>4)%2,false),0,0,1);ctx.restore();
  otext(h.name,x+cw/2,y+102,on?'#ffd23a':'#f6e7c8',8,'center');otext(h.role,x+cw/2,y+113,'#ff8a3a',8,'center');
  [['SPD',h.spd/1.5],['POW',h.pow/1.5],['RCH',h.reach/30]].forEach((s,k)=>{const yy=y+125+k*10;text(s[0],x+4,yy,'#d9c9e6',8,'left',null);rect(x+29,yy-1,40,8,OUT);rect(x+30,yy,Math.round(38*s[1]),6,h.bar||h.vest)});
  text(h.sp,x+cw/2,y+155,'#ffffff',8,'center',null);ctx.restore()});
 HEROES.forEach((h,i)=>{if(G.sel!==i)return;const x=6+i*75,y=24,cw=72;rect(x,y,2,164,'#ffd23a');rect(x+cw-2,y,2,164,'#ffd23a');rect(x,y+162,cw,2,'#ffd23a');rect(x,y,cw,3,'#ffd23a')});
 otext(touchOn?'STICK TO PICK  HIT TO GO':'LEFT/RIGHT TO PICK  ENTER TO GO',W/2,200,'#ffffff',8,'center')}

function draw(){ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=false;
 if(G.mode==='title'){drawTitle();return}if(G.mode==='select'){drawSelect();return}
 if(G.mode==='bonus'||(G.mode==='pause'&&G.pfrom==='bonus')){drawBonus();if(G.mode==='pause')pauseMenu();return}
 if(G.mode==='cart'||((G.mode==='pause'||G.mode==='over')&&G.pfrom==='cart')){drawCart();if(G.mode==='pause')pauseMenu();else if(G.mode==='over')banner('GAME OVER','FINAL SCORE '+G.score,G.ct<180?'PRESS START FOR MENU':null);return}
 drawWorld();if(G.blind>0)drawBlind();drawHUD();const st=STAGES[G.si];
 if(G.mode==='play'&&G.introT>0){drawIntro();return}
 if(G.mode==='play'){if(G.bannerT>0&&G.bannerT<160)banner('STAGE '+(G.si+1),st.name,st.sub);
  if(G.clearT>0)banner('STAGE CLEAR!','BONUS 3000',null,-50)}
 else if(G.mode==='pause')pauseMenu();
 else if(G.mode==='over')banner('GAME OVER','FINAL SCORE '+G.score,G.ct<180?'PRESS START FOR MENU':null);
 else if(G.mode==='win'){banner('DRY GULCH IS SAFE!','FINAL SCORE '+G.score,G.t2>60?'PRESS START':null,-50);if(G.newRat&&(G.t2>>4)%2)otext('SLIVER THE RAT UNLOCKED!',W/2,88,'#7cf06a',8,'center')}}

/* ---------------- loop ---------------- */
let last=performance.now(),acc=0;
function frame(now){acc+=Math.min(100,now-last);last=now;
 while(acc>=1000/60){update();for(const k in P)P[k]=false;syncTouchUI();acc-=1000/60}
 draw();requestAnimationFrame(frame)}

/* ---------------- layout + touch ---------------- */
let touchOn=false;const tEl=document.getElementById('touch'),dpad=document.getElementById('dpad'),knob=document.getElementById('knob'),zone=document.getElementById('zone'),btnsEl=document.querySelector('.btns');
function enableTouch(){if(touchOn)return;touchOn=true;tEl.classList.add('on');zone.classList.add('on');dpad.classList.add('on');resize()}
/* stop iOS Safari double-tap zoom, pinch zoom and scroll: cancel the touch itself (pointer events still fire) */
const noZoom=e=>{if(e.cancelable)e.preventDefault()};
document.addEventListener('touchstart',e=>{enableTouch();initAudio();noZoom(e)},{passive:false});
document.addEventListener('touchmove',noZoom,{passive:false});
document.addEventListener('touchend',noZoom,{passive:false});
['gesturestart','gesturechange','gestureend','dblclick'].forEach(t=>document.addEventListener(t,noZoom,{passive:false}));
let homeX=0,homeY=0,dpId=null,ox=0,oy=0;const pz=document.getElementById('pz'),midEl=document.querySelector('.mid');
function placePause(l,t,w,h,s){const iw=innerWidth,sz=44;let x,y;
 if(iw-(l+w)>=sz+12){x=l+w+8;y=t+4}
 else if(t>=sz+8){x=l+w-sz-8;y=t-sz-6}
 else{x=l+w-sz-4;y=t+Math.round(24*s)+4}
 pz.style.left=x+'px';pz.style.top=y+'px'}
let lastUI='';
function syncTouchUI(){if(!touchOn)return;const m=G.mode,game=m==='play'||m==='cart'||m==='bonus'||m==='pause',k=game?'g':'m';if(k===lastUI)return;lastUI=k;
 pz.classList.toggle('show',game);midEl.classList.toggle('hide',game)}
function padAt(x,y){dpad.style.left=x+'px';dpad.style.top=y+'px'}
function resize(){const iw=innerWidth,ih=innerHeight,portrait=ih>iw,reserve=touchOn&&portrait?260:0;
 const s=Math.max(0.5,Math.min(iw/W,(ih-reserve)/H)),w=Math.floor(W*s),h=Math.floor(H*s);
 cv.style.width=w+'px';cv.style.height=h+'px';cv.style.left=Math.floor((iw-w)/2)+'px';
 cv.style.top=Math.floor(reserve?Math.max(8,(ih-reserve-h)/2):(ih-h)/2)+'px';
 placePause(Math.floor((iw-w)/2),parseFloat(cv.style.top),w,h,s);
 if(touchOn){const br=btnsEl.getBoundingClientRect();zone.style.width=Math.max(120,br.left-12)+'px';
  const sl=parseFloat(getComputedStyle(tEl).paddingLeft)||16,sb=parseFloat(getComputedStyle(tEl).paddingBottom)||14;
  homeX=sl+75;homeY=ih-sb-75;if(dpId===null)padAt(homeX,homeY)}}
addEventListener('resize',resize);resize();
try{if(matchMedia('(pointer:coarse)').matches)enableTouch()}catch(e){}
function dpSet(e){const dx=e.clientX-ox,dy=e.clientY-oy,dead=14;
 const set=(k,v)=>{if(v)press(k);else release(k)};
 set('l',dx<-dead);set('r',dx>dead);set('u',dy<-dead);set('d',dy>dead);
 const m=Math.min(1,Math.hypot(dx,dy)/48)*40,a=Math.atan2(dy,dx);knob.style.transform='translate('+Math.cos(a)*m+'px,'+Math.sin(a)*m+'px)'}
function dpEnd(e){if(e&&e.pointerId!==dpId)return;dpId=null;['l','r','u','d'].forEach(release);knob.style.transform='';dpad.classList.remove('act');padAt(homeX,homeY)}
/* floating stick: it appears wherever the thumb lands in the left zone */
zone.addEventListener('pointerdown',e=>{e.preventDefault();if(dpId!==null)return;dpId=e.pointerId;try{zone.setPointerCapture(e.pointerId)}catch(_){}
 ox=e.clientX;oy=Math.min(e.clientY,innerHeight-40);padAt(ox,oy);dpad.classList.add('act');dpSet(e);cv.focus();initAudio()});
zone.addEventListener('pointermove',e=>{if(e.pointerId===dpId)dpSet(e)});
zone.addEventListener('pointerup',dpEnd);zone.addEventListener('pointercancel',dpEnd);zone.addEventListener('lostpointercapture',dpEnd);
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;
 const down=e=>{e.preventDefault();press(k);b.classList.add('on')},up=()=>{release(k);b.classList.remove('on')};
 b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)});
cv.addEventListener('pointerdown',()=>{cv.focus();initAudio()});

requestAnimationFrame(frame);
// offline + home-screen app support (only on johnsen.world, not inside Claude)
try{if('serviceWorker' in navigator&&/(^|\.)johnsen\.world$|^localhost$/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
