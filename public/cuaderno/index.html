  set: async function (k, v) {

// Local date — NOT toISOString(), which is UTC and would roll the day over
// in the late afternoon for anyone in the Americas.
const fmt = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const todayStr = () => fmt(new Date());
const addDays = n => {
  const d = new Date();
  d.setDate(d.getDate() + n);
  return fmt(d);
};

// ---------- Audio: browser speech, Mexican voice preferred ----------
const synth = typeof window !== "undefined" ? window.speechSynthesis : null;
let pickedVoice = null;
let voiceLabel = "";
function chooseVoice() {
  if (!synth) return null;
  const all = synth.getVoices();
  const es = all.filter(v => v.lang && v.lang.toLowerCase().startsWith("es"));
  if (!es.length) return null;
  const by = re => es.find(v => re.test(v.lang));
  pickedVoice = by(/es[-_]MX/i) ||
  // Mexican — what we want
  by(/es[-_]US/i) ||
  // US Spanish, closest cousin
  by(/es[-_](419|CO|PE|CL|AR)/i) ||
  // other Latin American
  es[0]; // anything Spanish beats nothing
  voiceLabel = pickedVoice ? `${pickedVoice.name} (${pickedVoice.lang})` : "";
  return pickedVoice;
}
if (synth) {
  chooseVoice();
  synth.onvoiceschanged = chooseVoice;
}

// Strip flags, warning signs, and other non-speech marks
const sayable = t => t.replace(/[\u{1F1E6}-\u{1F1FF}\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\uFE0F]/gu, "").replace(/\s+/g, " ").trim();
function speak(text, rate = 0.9) {
  if (!synth) return;
  const clean = sayable(text);
  if (!clean) return;
  try {
    synth.cancel();
    const u = new SpeechSynthesisUtterance(clean);
    const v = pickedVoice || chooseVoice();
    if (v) u.voice = v;
    u.lang = v ? v.lang : "es-MX";
    u.rate = rate;
    synth.speak(u);
  } catch (e) {
    console.error("speech failed", e);
  }
}

// iOS needs a first utterance inside a real tap to unlock audio
let primed = false;
function primeSpeech() {
  if (!synth || primed) return;
  primed = true;
  try {
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    synth.speak(u);
  } catch (e) {
    /* ignore */
  }
}
